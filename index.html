<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#B33A1E">
<meta name="color-scheme" content="light only">
<title>Cabosse</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Cabosse">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ============================================================
   Cabosse — jetons de conception
   Mêmes règles que RHABDO : fond clair, cartes blanches, une
   seule couleur de signal. Accent indigo pour distinguer les
   deux applications sur l'écran d'accueil.
   ============================================================ */
:root{
  --fond:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEFF3; --filet:#E1E5EA;
  --texte:#14171C; --texte-2:#5F6A7B; --texte-3:#9AA3B2;
  --accent:#3A56D4; --accent-doux:#E7EBFC;
  --faite:#00A08C; --reportee:#F2A104; --annulee:#D14343; --retard:#D14343;
  --ombre:0 1px 2px rgba(20,23,28,.06), 0 4px 14px rgba(20,23,28,.05);
  --corps:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--fond);color-scheme:light;color:var(--texte);font-family:var(--corps);
  font-size:16px;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--texte);background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-s);padding:11px 12px;width:100%;appearance:none}
textarea{resize:vertical;min-height:64px;line-height:1.4}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' stroke='%235F6A7B' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' d='M4 6.5l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-doux)}
input[type="checkbox"]{width:22px;height:22px;flex:0 0 auto;padding:0;border-radius:7px;
  border:1.5px solid var(--filet);background:var(--surface);cursor:pointer;appearance:none;
  transition:background-color .15s,border-color .15s}
input[type="checkbox"]:checked{border-color:var(--accent);background-color:var(--accent);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' d='M3.2 8.4l3.4 3.4L12.8 5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center;background-size:14px 14px}
.check-ligne{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.check-ligne span{font-size:13px;color:var(--texte-2);font-weight:600}

#app{display:flex;flex-direction:column;height:100dvh}
#entete{flex:0 0 auto;padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;
  gap:12px;background:var(--surface);border-bottom:1px solid var(--filet)}
#entete .glyphe{width:36px;height:36px;flex:0 0 auto;border-radius:var(--r-s);background:#B33A1E;
  color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800}
#entete .titres{flex:1;min-width:0}
#entete .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600}
#entete h1{margin:0;font-weight:800;font-size:19px;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btn-imprimer{flex:0 0 auto;width:36px;height:36px;border-radius:var(--r-s);
  background:var(--surface-2);font-size:17px;display:flex;align-items:center;justify-content:center}
#impression{display:none}
#bascule-profil{flex:0 0 auto;display:flex;gap:4px;padding:8px 16px;background:var(--surface);
  border-bottom:1px solid var(--filet)}
#bascule-profil .seg{flex:1;padding:8px 6px;border-radius:99px;background:var(--surface-2);
  font-size:12.5px;font-weight:700;color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bascule-profil .seg.actif{background:var(--accent);color:#fff}
#vue{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
#barre{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
  border-top:1px solid var(--filet);padding-bottom:var(--safe-b)}
#barre button{padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--texte-3);transition:color .15s}
#barre button .ic{font-size:20px;line-height:1;filter:grayscale(1) opacity(.55)}
#barre button .lb{font-size:10px;font-weight:600}
#barre button[aria-current="page"]{color:var(--accent)}
#barre button[aria-current="page"] .ic{filter:none}

.etiquette{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--texte-3);font-weight:600;margin:0 0 8px}
.carte{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:15px;
  box-shadow:var(--ombre)}
.champ{margin-bottom:12px}
.champ label{display:block;font-size:12.5px;font-weight:600;color:var(--texte-2);margin-bottom:6px}
.bouton{display:block;width:100%;padding:16px;border-radius:99px;background:var(--surface-2);
  font-weight:700;font-size:16px;letter-spacing:-.01em;transition:transform .08s}
.bouton:active{transform:scale(.98)}
.bouton.principal{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(58,86,212,.28)}
.bouton.discret{background:transparent;border:1.5px solid var(--filet);color:var(--texte-2);
  font-weight:600;font-size:14.5px;padding:13px}
.vide{text-align:center;padding:52px 20px;color:var(--texte-2)}
.vide .gros{font-size:38px;margin-bottom:12px}
.vide p{margin:0 0 4px}
.suivi-banniere{background:var(--accent-doux);color:var(--accent);font-size:12px;font-weight:700;
  text-align:center;padding:9px 12px;border-radius:var(--r-m);margin-bottom:14px}

/* --- agenda --- */
.jour{margin-bottom:16px}
.jour > h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--texte-2);
  display:flex;align-items:baseline;gap:8px}
.compte{font-family:var(--mono);font-size:11px;color:var(--texte-3);font-weight:500}
.jour.retard > h2{color:var(--retard)}
.rev{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:13px 15px;
  margin-bottom:8px;box-shadow:var(--ombre)}
.rev .haut{display:flex;align-items:center;gap:10px}
.rev .code{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.01em}
.rev .matiere{font-size:12.5px;color:var(--texte-2);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.puce{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.rev .rang{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--texte-3);
  background:var(--surface-2);border-radius:99px;padding:3px 8px;flex:0 0 auto}
.rev .rang.ancrage{color:var(--accent);background:var(--accent-doux)}
.rev .note{font-size:11.5px;color:var(--reportee);font-weight:600;margin-top:6px}
.rev .cmds{display:flex;gap:7px;margin-top:11px}
.rev .cmds button{flex:1;padding:9px 6px;border-radius:99px;background:var(--surface-2);
  font-size:12.5px;font-weight:600;color:var(--texte-2)}
.rev .cmds button.ok{background:var(--faite);color:#fff}
.rev .cmds button.verrou{opacity:.4;cursor:not-allowed}

/* --- carte de repos du dimanche --- */
.rev.repos{display:flex;align-items:center;justify-content:center;padding:16px 15px}
.repos-corps{display:flex;flex-direction:column;align-items:center;gap:6px}
.repos-ic{font-size:26px;line-height:1}
.repos-txt{font-size:13.5px;font-weight:700;color:var(--texte-2)}
.repos-detail{font-size:11.5px;color:var(--texte-3);font-weight:600;text-align:center;max-width:220px}
.rev.repos.succes .repos-txt{color:var(--faite)}
.rev.repos.succes .repos-ic{animation:repos-pop .5s ease}
@keyframes repos-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}

/* --- section pliable (semaines suivantes, historique) --- */
details.pliable{margin:4px 0 16px;border:1px solid var(--filet);border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--ombre);overflow:hidden}
details.pliable summary{padding:14px 15px;font-size:13px;font-weight:700;color:var(--texte-2);
  list-style:none;position:relative;padding-right:34px;cursor:pointer}
details.pliable summary::-webkit-details-marker{display:none}
details.pliable summary::after{content:"+";font-size:18px;color:var(--texte-3);
  position:absolute;right:15px;top:50%;transform:translateY(-50%)}
details.pliable[open] summary::after{content:"\2013"}
details.pliable summary .compte{margin-left:6px}
details.pliable .contenu-pliable{padding:0 15px 15px}
details.pliable .contenu-pliable .jour{margin-bottom:14px}
.hist-l{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--filet)}
.hist-l:last-child{border-bottom:0}
.hist-l .txt{flex:1;min-width:0}
.hist-l .txt b{display:block;font-family:var(--mono);font-size:13px;font-weight:700}
.hist-l .txt span{display:block;font-size:11.5px;color:var(--texte-2)}
.hist-l button{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--surface-2);
  font-size:11.5px;font-weight:600;color:var(--texte-2)}
.hist-l button.sup{color:var(--annulee);padding:7px 10px}
.hist-groupe{margin-bottom:14px}
.hist-groupe:last-child{margin-bottom:0}
.hist-entete{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hist-entete span{flex:1;min-width:0;font-size:12.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-suppr-serie{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--annulee)}
.sync-code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:var(--r-s);
  padding:10px 12px;word-break:break-all}
.parametres-verrou{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:20px}
.parametres-verrou .ic{font-size:20px;flex:0 0 auto}
.parametres-verrou .txt{flex:1;min-width:0}
.parametres-verrou .txt b{display:block;font-size:13px;font-weight:700}
.parametres-verrou .txt span{font-size:11.5px;color:var(--texte-2)}

/* --- chat --- */
#chat-fil{display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 320px)}
.vide-chat{text-align:center;color:var(--texte-3);font-size:13px;padding:24px 0;margin:auto}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:82%}
.msg.moi{align-self:flex-end;align-items:flex-end}
.msg-auteur{font-size:10.5px;font-weight:700;color:var(--texte-3);margin:0 0 2px 3px}
.msg-bulle{background:var(--surface);border:1px solid var(--filet);border-radius:16px 16px 16px 4px;
  padding:9px 13px;font-size:14px;line-height:1.4;box-shadow:var(--ombre);word-break:break-word;white-space:pre-wrap}
.msg.moi .msg-bulle{background:var(--accent);color:#fff;border-color:var(--accent);
  border-radius:16px 16px 4px 16px}
.msg-heure{font-size:10px;color:var(--texte-3);margin:3px 4px 0}
.chat-bas{position:sticky;bottom:0;background:var(--fond);padding-top:10px;margin-top:14px}
.chat-nom{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px}
.chat-saisie{display:flex;gap:8px;align-items:flex-end}
.chat-saisie input{flex:1}
.chat-saisie button{flex:0 0 auto;width:44px;height:44px;border-radius:99px;background:var(--accent);
  color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}

/* --- aperçu de l'échéancier --- */
.apercu{margin-top:12px}
.apercu .l{display:flex;align-items:baseline;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--filet);font-size:13px}
.apercu .l:last-child{border-bottom:0}
.apercu .l .r{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--texte-3);
  min-width:56px}
.apercu .l .r.ancrage{color:var(--accent)}
.apercu .l .d{font-variant-numeric:tabular-nums}

/* --- liste des cours --- */
.ligne{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-m);margin-bottom:8px;box-shadow:var(--ombre)}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-family:var(--mono);font-size:14px;font-weight:700}
.ligne .txt span{display:block;font-size:12px;color:var(--texte-2)}
.ligne .sup{flex:0 0 auto;width:34px;height:34px;border-radius:var(--r-s);
  background:var(--surface-2);color:var(--texte-3);font-size:15px}

/* --- gestion des matières --- */
.mat-l{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--filet)}
.mat-l:last-child{border-bottom:0}
.mat-nom{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat-nom b{font-family:var(--mono)}
.mini{flex:0 0 auto;width:30px;height:30px;border-radius:var(--r-s);background:var(--surface-2);
  color:var(--texte-2);font-size:14px}
.mini.sup{color:var(--annulee)}
.mini.ok{color:#fff;background:var(--faite)}
.mat-edit input[type="text"]{flex:1;padding:8px 10px;font-size:13px}
input[type="color"]{width:34px;height:34px;flex:0 0 auto;padding:2px;border-radius:var(--r-s);
  border:1.5px solid var(--filet);background:var(--surface);cursor:pointer}

/* --- statistiques --- */
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.tuile{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);
  padding:13px 15px;box-shadow:var(--ombre)}
.tuile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.tuile span{display:block;font-size:11.5px;font-weight:600;color:var(--texte-2);margin-top:2px}
.tuile.faite b{color:var(--faite)} .tuile.reportee b{color:var(--reportee)}
.tuile.annulee b{color:var(--annulee)} .tuile.venir b{color:var(--accent)}
.carte.graf{margin-bottom:12px;padding:13px 14px 6px}
.graf-titre{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--texte-2)}
.tab .l{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--filet);font-size:13px}
.tab .l:last-child{border-bottom:0}
.tab .l.entete{padding-top:0;font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--texte-3);font-weight:700}
.tab .l .n{display:flex;align-items:center;gap:8px;min-width:0}
.tab .l .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .l .v{font-variant-numeric:tabular-nums;font-weight:700;min-width:34px;text-align:right}
.tab .l.entete .v{font-weight:700}

/* --- report, confirmation et note --- */
#voile,#confirm-voile,#note-voile,#motdepasse-voile,#chatnom-voile{position:fixed;inset:0;background:rgba(20,23,28,.45);display:none;
  align-items:flex-end;z-index:20}
#voile.on,#confirm-voile.on,#note-voile.on,#motdepasse-voile.on,#chatnom-voile.on{display:flex}
#voile .feuille,#confirm-voile .feuille,#note-voile .feuille,#motdepasse-voile .feuille,#chatnom-voile .feuille{width:100%;background:var(--surface);
  border-radius:var(--r-l) var(--r-l) 0 0;padding:20px 16px calc(20px + var(--safe-b))}
#voile h3,#confirm-voile h3,#note-voile h3,#motdepasse-voile h3,#chatnom-voile h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.02em}
#voile p,#confirm-voile p,#note-voile p,#motdepasse-voile p,#chatnom-voile p{margin:0 0 14px;font-size:13px;color:var(--texte-2)}
.note-apercu{margin-top:6px;font-size:12px;color:var(--texte-2);background:var(--surface-2);
  border-radius:var(--r-s);padding:7px 9px;line-height:1.35}
.note-ajouter{margin-top:6px;font-size:11.5px;font-weight:600;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(78px + var(--safe-b));transform:translateX(-50%);
  background:var(--texte);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;
  border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
#toast.on{opacity:1}

/* --- feuille imprimable --- */
@media print{
  body *{visibility:hidden}
  #impression, #impression *{visibility:visible}
  #impression{display:block;position:absolute;left:0;top:0;width:100%}
  @page{size:A4;margin:11mm}
}
.pr-page{font-family:var(--corps);color:#000;font-size:8.3px;line-height:1.25}
.pr-entete{font-size:12px;font-weight:800;margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px solid #000}
.pr-grille{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.pr-jour{margin-bottom:7px;break-inside:avoid}
.pr-jour h3{margin:0 0 2px;font-size:9px;font-weight:800;text-transform:uppercase;
  border-bottom:1px solid #000;padding-bottom:1px;letter-spacing:.02em}
.pr-vide{margin:0 0 3px;color:#888;font-size:8px}
.pr-item{margin-bottom:3px}
.pr-nom{font-weight:700}
.pr-mat,.pr-rang{font-weight:400;color:#444}
.pr-cases{display:flex;gap:9px;margin:1px 0 3px;flex-wrap:wrap}
.pr-c{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pr-c i,.pr-nouveau i{display:inline-block;width:7px;height:7px;border:1px solid #000;flex:0 0 auto}
.pr-nouveau{display:flex;align-items:center;gap:4px;margin-top:2px;color:#333;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header id="entete">
    <div class="glyphe">C</div>
    <div class="titres">
      <div class="eyebrow">Réactivation mémorielle</div>
      <h1>Cabosse</h1>
    </div>
    <button id="btn-imprimer" title="Imprimer le planning des 2 semaines" aria-label="Imprimer">🖨️</button>
  </header>
  <div id="bascule-profil" style="display:none"></div>
  <main id="vue"></main>
  <nav id="barre">
    <button data-vue="agenda"><span class="ic">📅</span><span class="lb">Agenda</span></button>
    <button data-vue="ajout"><span class="ic">➕</span><span class="lb">Ajouter</span></button>
    <button data-vue="chat"><span class="ic">💬</span><span class="lb">Chat</span></button>
    <button data-vue="stats"><span class="ic">📊</span><span class="lb">Statistiques</span></button>
  </nav>
</div>
<div id="voile"><div class="feuille">
  <h3>Reporter la révision</h3>
  <p id="voile-info"></p>
  <input type="date" id="voile-date">
  <div style="display:flex;gap:9px;margin-top:14px">
    <button class="bouton discret" id="voile-annuler" style="flex:1">Fermer</button>
    <button class="bouton principal" id="voile-ok" style="flex:1;padding:13px;font-size:14.5px">Reporter</button>
  </div>
</div></div>
<div id="confirm-voile"><div class="feuille">
  <h3 id="confirm-titre"></h3>
  <p id="confirm-info"></p>
  <div id="confirm-note-zone" class="champ" style="display:none">
    <label for="confirm-note">Point de difficulté à noter (optionnel)</label>
    <textarea id="confirm-note" rows="3" placeholder="Ex. confond passé simple et imparfait…"></textarea>
  </div>
  <div id="confirm-actions" style="display:flex;flex-direction:column;gap:9px"></div>
  <button class="bouton discret" id="confirm-non" style="margin-top:9px">Fermer</button>
</div></div>
<div id="note-voile"><div class="feuille">

<!-- ============================================================
     Synchronisation Firebase (optionnelle)
     Coller ci-dessous la configuration du projet Firebase créé pour
     Cabosse (Console Firebase → Paramètres du projet → Vos
     applications → icône </> « application Web »). Tant que ces
     valeurs ne sont pas remplacées, la synchronisation reste
     désactivée sans faire planter le reste de l'app.

     Nécessite aussi, dans la console Firebase :
     Authentication → Sign-in method → activer « Anonymous ».
     Voir les règles Firestore fournies séparément — l'écriture y
     est vérifiée via un identifiant anonyme stocké dans un document
     jamais lisible par un client, distinct du code de lecture.
     ============================================================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, limitToLast }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDL1Du9jLAD13gHQI1Y_4LQ1SsWGRSQJAc",
  authDomain: "cabosse-famille.firebaseapp.com",
  projectId: "cabosse-famille",
  storageBucket: "cabosse-famille.firebasestorage.app",
  messagingSenderId: "779388589101",
  appId: "1:779388589101:web:f6cac26a448e2f25d4d4a4"
};

const configure = Object.values(FIREBASE_CONFIG).every(v => typeof v === 'string' && !v.startsWith('COLLE_'));
let bdd = null, auth = null, arreterEcoute = null, arreterEcouteChat = null;
if (configure) {
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    bdd = getFirestore(app);
    auth = getAuth(app);
  } catch (e) { console.error('SABOSSE sync : configuration Firebase invalide', e); }
}

/* Authentifie l'appareil auprès de Firebase à la demande : requis
   pour pousser les données de révision (mode source) et pour
   envoyer un message dans le chat, quel que soit le rôle. La lecture
   des données de révision, elle, ne demande aucune identité. */
function assurerAuth(){
  return new Promise((resolve, reject) => {
    if (auth.currentUser) { resolve(auth.currentUser); return; }
    const arret = onAuthStateChanged(auth, u => { if (u) { arret(); resolve(u); } });
    signInAnonymously(auth).catch(e => { arret(); reject(e); });
  });
}

window.SabosseSync = {
  disponible: configure && !!bdd,
  async envoyer(code, donnees){
    if (!this.disponible || !code) return false;
    try {
      const u = await assurerAuth();
      /* Tentative d'enregistrement comme écrivain autorisé — n'a
         d'effet réel que la toute première fois (le document est
         ensuite verrouillé par les règles Firestore) ; les tentatives
         suivantes échouent silencieusement, sans conséquence. */
      try { await setDoc(doc(bdd, 'sabosse_writers', code), {uid: u.uid}); } catch (e) { /* déjà pris, sans effet */ }
      await setDoc(doc(bdd, 'sabosse', code), Object.assign({}, donnees, {misAJour: Date.now()}));
      return true;
    } catch (e) { console.error('SABOSSE sync : envoi impossible', e); return false; }
  },
  suivre(code, callback){
    if (!this.disponible || !code) return;
    if (arreterEcoute) arreterEcoute();
    arreterEcoute = onSnapshot(
      doc(bdd, 'sabosse', code),
      snap => { if (snap.exists()) callback(snap.data()); },
      err => { console.error('SABOSSE sync : écoute interrompue', err); callback(null, err); }
    );
  },
  arreter(){
    if (arreterEcoute) { arreterEcoute(); arreterEcoute = null; }
  },
  /* Chat familial : contrairement aux données de révision, n'importe
     quel appareil authentifié (source ou suivi) peut y écrire — ce
     n'est plus une donnée à sens unique. */
  async envoyerMessage(code, message){
    if (!this.disponible || !code) return false;
    try {
      await assurerAuth();
      await addDoc(collection(bdd, 'sabosse_chat', code, 'messages'), message);
      return true;
    } catch (e) { console.error('SABOSSE sync : message impossible', e); return false; }
  },
  suivreChat(code, callback){
    if (!this.disponible || !code) return;
    if (arreterEcouteChat) arreterEcouteChat();
    const q = query(collection(bdd, 'sabosse_chat', code, 'messages'), orderBy('quand', 'asc'), limitToLast(200));
    arreterEcouteChat = onSnapshot(q,
      snap => {
        const msgs = [];
        snap.forEach(d => msgs.push(Object.assign({id: d.id}, d.data())));
        callback(msgs);
      },
      err => { console.error('SABOSSE sync : chat interrompu', err); callback(null, err); }
    );
  },
  arreterChat(){
    if (arreterEcouteChat) { arreterEcouteChat(); arreterEcouteChat = null; }
  }
};

/* Signale au script principal que SabosseSync est prêt à l'emploi
   (ce module se charge après le script classique, jamais avant). */
window.dispatchEvent(new Event('sabosse-sync-pret'));
</script>

<script>
'use strict';
const VERSION = 'v9 · 3 septembre 2026';

/* ============================================================
   Matières — liste par défaut au premier lancement, éditable
   ensuite depuis la vue Ajout (DB.matieres fait foi une fois créé).
   ============================================================ */
const MATIERES_DEFAUT = [
  {code:'ANG', nom:'Anglais',                        c:'#3A56D4'},
  {code:'MAT', nom:'Mathématiques',                  c:'#D14343'},
  {code:'HIS', nom:'Histoire',                       c:'#8B4FD6'},
  {code:'GEO', nom:'Géographie',                     c:'#00A08C'},
  {code:'FRA', nom:'Français',                       c:'#E07B00'},
  {code:'PHY', nom:'Physique Chimie',                c:'#0088A8'},
  {code:'MUS', nom:'Musique',                        c:'#C2185B'},
  {code:'ART', nom:'Arts plastiques',                c:'#6D8B00'},
  {code:'SVT', nom:'Sciences de la vie et de la Terre', c:'#2E7D32'}
];
function matiereDe(code){
  return donneesLecture().matieres.find(m => m.code === code) || {nom: code, c: '#9AA3B2'};
}

/* ============================================================
   Dates — tout se calcule sur des dates locales à midi, pour
   qu'un changement d'heure ne décale jamais une échéance.
   ============================================================ */
function dDe(iso){
  const p = iso.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0, 0);
}
function isoDe(d){
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const j = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + j;
}
function plus(d, n){
  const r = new Date(d.getTime());
  r.setDate(r.getDate() + n);
  return r;
}
function aujourdhui(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12, 0, 0, 0);
}
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS  = ['janvier','février','mars','avril','mai','juin',
               'juillet','août','septembre','octobre','novembre','décembre'];
function libelleJour(iso){
  const d = dDe(iso);
  return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] +
         (d.getFullYear() !== aujourdhui().getFullYear() ? ' ' + d.getFullYear() : '');
}
function libelleCourt(iso){
  const d = dDe(iso);
  return String(d.getDate()).padStart(2,'0') + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

/* Semaine du lundi au dimanche, quel que soit le jour de départ. */
function lundiDe(d){
  const jsem = d.getDay();
  return plus(d, jsem === 0 ? -6 : 1 - jsem);
}
function dimancheDe(d){ return plus(lundiDe(d), 6); }

/* Une révision n'est validable que si son échéance est dépassée,
   ou à sept jours au plus. Au-delà, le bouton « Faite » est verrouillé
   pour éviter une validation par anticipation excessive. */
function joursAvant(iso){ return Math.round((dDe(iso) - aujourdhui()) / 86400000); }
function estValidable(iso){ return joursAvant(iso) <= 7; }

/* Fin de l'année scolaire : le 1er juillet qui suit la date du cours. */
function finAnnee(d){
  const juillet = new Date(d.getFullYear(), 6, 1, 12, 0, 0, 0);
  return d < juillet ? juillet : new Date(d.getFullYear() + 1, 6, 1, 12, 0, 0, 0);
}

/* ============================================================
   Échéancier
   Un ancrage : le premier samedi qui suit la date du cours.
   Puis le cycle J+7, J+14, J+21, J+28, puis tous les 28 jours,
   toujours compté depuis la date du cours, jusqu'au 1er juillet.
   ============================================================ */
/* La rampe donne l'écart, en jours, entre chaque révision et la
   précédente (pas depuis la date du cours) : 7, 7, 14, 14, 21, 21,
   21, puis un rythme fixe de 28 jours jusqu'à la fin de l'année. */
const RAMPE_INTERVALLES = [7, 7, 14, 14, 21, 21, 21, 28];

function echeancier(dateISO){
  const d = dDe(dateISO);
  const fin = finAnnee(d);
  const sortie = [];

  let samedi = plus(d, 1);
  while (samedi.getDay() !== 6) samedi = plus(samedi, 1);
  if (samedi <= fin) sortie.push({rang:'Ancrage', ancrage:true, date:isoDe(samedi)});

  const deltas = [];
  let cumul = 0;
  RAMPE_INTERVALLES.forEach(ecart => { cumul += ecart; deltas.push(cumul); });
  for (let x = cumul + 28; plus(d, x) <= fin; x += 28) deltas.push(x);

  deltas.forEach(x => {
    const q = plus(d, x);
    if (q > fin) return;
    const jour = isoDe(q);
    const deja = sortie.find(e => e.date === jour);
    if (deja) { deja.rang = deja.rang + ' · J+' + x; return; }
    sortie.push({rang:'J+' + x, ancrage:false, date:jour});
  });

  sortie.sort((a, b) => a.date < b.date ? -1 : 1);
  return sortie;
}

/* ============================================================
   Stockage
   ============================================================ */
const CLE = 'sabosse';
const Store = {
  dispo: true,
  lire(){
    const defaut = {cours:[], revisions:[], matieres: MATIERES_DEFAUT.slice(), suivi: null,
                    reglages:{afficherAncrage:true, prenom:'', role:'aucun', codePartage:'', codeSuivi:'', affichage:'personnel', nomChat:''}};
    try {
      const brut = localStorage.getItem(CLE);
      if (!brut) return defaut;
      const o = JSON.parse(brut);
      return {
        cours: o.cours || [],
        revisions: o.revisions || [],
        matieres: (o.matieres && o.matieres.length) ? o.matieres : MATIERES_DEFAUT.slice(),
        suivi: o.suivi || null,
        reglages: Object.assign({afficherAncrage:true, prenom:'', role:'aucun', codePartage:'', codeSuivi:'', affichage:'personnel', nomChat:''}, o.reglages || {})
      };
    } catch (e) { this.dispo = false; return defaut; }
  },
  ecrire(db){
    try { localStorage.setItem(CLE, JSON.stringify(db)); }
    catch (e) { this.dispo = false; toast('Stockage indisponible.'); }
  }
};
let DB = Store.lire();

/* Deux jeux de données peuvent coexister sur un même appareil : le
   « personnel » (celui que l'appareil encode lui-même) et le
   « suivi » (le miroir en lecture seule d'un autre appareil, reçu
   par Firebase). reglages.affichage choisit lequel est à l'écran ;
   les écritures ne touchent jamais le jeu affiché en mode suivi,
   puisque toute la partie édition de l'interface reste masquée
   par modeLecture() dans ce cas. */
function donneesLecture(){
  if (DB.reglages.affichage === 'suivi' && DB.suivi) {
    return {
      cours: DB.suivi.cours || [],
      revisions: DB.suivi.revisions || [],
      matieres: (DB.suivi.matieres && DB.suivi.matieres.length) ? DB.suivi.matieres : MATIERES_DEFAUT,
      afficherAncrage: (DB.suivi.reglages && typeof DB.suivi.reglages.afficherAncrage === 'boolean')
        ? DB.suivi.reglages.afficherAncrage : true,
      prenom: (DB.suivi.reglages && DB.suivi.reglages.prenom) || ''
    };
  }
  return {
    cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres,
    afficherAncrage: DB.reglages.afficherAncrage, prenom: DB.reglages.prenom
  };
}

/* modeLecture() : l'écran affiche actuellement le miroir d'un autre
   appareil, donc rien n'est modifiable ici — toute édition se fait
   sur l'appareil source. Indépendant du rôle de synchronisation :
   un appareil « suivi » peut très bien être en train d'afficher son
   propre profil personnel, pleinement éditable, à un instant donné. */
function modeLecture(){ return DB.reglages.affichage === 'suivi'; }

function sauver(){
  Store.ecrire(DB);
  if (DB.reglages.role === 'source' && DB.reglages.codePartage &&
      window.SabosseSync && window.SabosseSync.disponible) {
    window.SabosseSync.envoyer(DB.reglages.codePartage, {
      cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres,
      reglages: {afficherAncrage: DB.reglages.afficherAncrage, prenom: DB.reglages.prenom}
    });
  }
}

function idCours(code, num, date){ return code + '-' + num + '-' + date; }
function refCours(c){ return c.code + '-' + c.numero; }
function trouverCours(id){ return donneesLecture().cours.find(c => c.id === id); }

function ajouterCours(code, numero, dateISO){
  const id = idCours(code, numero, dateISO);
  if (DB.cours.some(c => c.id === id)) return false;
  DB.cours.push({id, code, numero, date: dateISO, commentaire: ''});
  echeancier(dateISO).forEach((e, i) => {
    DB.revisions.push({
      id: id + '#' + i,
      cours: id,
      rang: e.rang,
      ancrage: e.ancrage,
      prevue: e.date,
      date: e.date,
      statut: 'aFaire'
    });
  });
  sauver();
  return true;
}

function supprimerCours(id){
  DB.cours = DB.cours.filter(c => c.id !== id);
  DB.revisions = DB.revisions.filter(r => r.cours !== id);
  sauver();
}

/* Suppression définitive d'une seule révision de l'historique —
   distincte de « Réactiver », qui ne fait que changer son statut.
   Les statistiques, calculées à chaque rendu depuis DB.revisions,
   ignorent automatiquement ce qui a été supprimé. */
function supprimerRevision(id){
  DB.revisions = DB.revisions.filter(r => r.id !== id);
  sauver();
  rendre();
  toast('Révision supprimée définitivement.');
}

/* ============================================================
   Rendu
   ============================================================ */
let vueActive = 'agenda';

/* Mémorise, pour la session, quels panneaux repliables sont ouverts,
   pour qu'une action à l'intérieur (ajouter, réactiver…) ne referme
   pas le panneau au moment où la vue se redessine. */
let sectionsOuvertes = {};
function ouvert(cle){ return sectionsOuvertes[cle] ? ' open' : ''; }
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.matches && d.matches('details.pliable[data-cle]')) {
    sectionsOuvertes[d.dataset.cle] = d.open;
  }
}, true);

/* Verrou des Paramètres avancés : un mot de passe simple, côté
   client — un frein pour éviter qu'un enfant curieux ne modifie la
   synchronisation ou les matières par mégarde, pas une protection
   cryptographique (le mot de passe est visible dans le code source). */
const MOT_DE_PASSE_PARAMETRES = 'bregmatique';
let parametresDeverrouilles = false;
const mdpVoile = document.getElementById('motdepasse-voile');

function ouvrirMotDePasse(){
  document.getElementById('motdepasse-champ').value = '';
  mdpVoile.classList.add('on');
  setTimeout(() => document.getElementById('motdepasse-champ').focus(), 60);
}
function fermerMotDePasse(){ mdpVoile.classList.remove('on'); }
function tenterDeverrouillage(){
  const val = document.getElementById('motdepasse-champ').value;
  if (val === MOT_DE_PASSE_PARAMETRES) {
    parametresDeverrouilles = true;
    fermerMotDePasse();
    rendre();
    toast('Paramètres avancés déverrouillés.');
  } else {
    toast('Mot de passe incorrect.');
  }
}
document.getElementById('motdepasse-annuler').addEventListener('click', fermerMotDePasse);
mdpVoile.addEventListener('click', e => { if (e.target === mdpVoile) fermerMotDePasse(); });
document.getElementById('motdepasse-ok').addEventListener('click', tenterDeverrouillage);
document.getElementById('motdepasse-champ').addEventListener('keydown', e => {
  if (e.key === 'Enter') tenterDeverrouillage();
});

const vue = document.getElementById('vue');

function ech(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function rendre(){
  document.querySelectorAll('#barre button').forEach(b => {
    if (b.dataset.vue === vueActive) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  if (vueActive === 'agenda') vue.innerHTML = vueAgenda();
  else if (vueActive === 'ajout') { vue.innerHTML = vueAjout(); majApercu(); }
  else if (vueActive === 'chat') { vue.innerHTML = vueChat(); vue.scrollTop = vue.scrollHeight; }
  else vue.innerHTML = vueStats();
  if (vueActive !== 'chat') vue.scrollTop = 0;
  majBascule();
}

/* Bascule « Mes révisions / Suivi » : uniquement visible si cet
   appareil a un profil suivi configuré. Volontairement hors des
   Paramètres avancés (donc jamais derrière le mot de passe), pour
   rester accessible à l'usage quotidien. */
function majBascule(){
  const zone = document.getElementById('bascule-profil');
  if (DB.reglages.role !== 'suivi') { zone.style.display = 'none'; return; }
  zone.style.display = 'flex';
  const dlSuivi = (DB.suivi && DB.suivi.reglages && DB.suivi.reglages.prenom) || 'Suivi';
  zone.innerHTML =
    '<button data-act="profil-personnel" class="seg' + (DB.reglages.affichage !== 'suivi' ? ' actif' : '') + '">Mes révisions</button>' +
    '<button data-act="profil-suivi" class="seg' + (DB.reglages.affichage === 'suivi' ? ' actif' : '') + '">' + ech(dlSuivi) + '</button>';
}

/* --- Agenda ------------------------------------------------ */

/* L'ancrage du samedi s'affiche sous un nom plus engageant que
   « Ancrage », y compris quand il coïncide avec une échéance J+x. */
function libelleRang(rang){
  return rang.replace(/^Ancrage/, 'Nouveau !');
}

/* Une carte de révision, réutilisée pour les retards, la semaine
   en cours, la semaine prochaine et le repli « Semaines suivantes ». */
function carteRevision(r){
  const c = trouverCours(r.cours);
  if (!c) return '';
  const m = matiereDe(c.code);
  const validable = estValidable(r.date);
  const boutonFaite = validable
    ? '<button class="ok" data-act="faite" data-id="' + r.id + '">Faite</button>'
    : '<button class="verrou" disabled>Faite</button>';
  const cmds = modeLecture() ? '' :
    '<div class="cmds">' + boutonFaite +
      '<button data-act="reporter" data-id="' + r.id + '">Reporter</button>' +
      '<button data-act="annuler" data-id="' + r.id + '">Annuler</button>' +
    '</div>';
  const commentaire = (c.commentaire || '').trim();
  const texteNote = ech(commentaire.length > 90 ? commentaire.slice(0, 90) + '…' : commentaire);
  const attrsNote = modeLecture() ? ' style="cursor:default"' : (' data-act="note" data-id="' + c.id + '"');
  const zoneNote = commentaire
    ? '<button type="button" class="note-apercu"' + attrsNote + '>📝 ' + texteNote + '</button>'
    : (modeLecture() ? '' : '<button class="note-ajouter" data-act="note" data-id="' + c.id + '">+ Ajouter une note</button>');
  return '<article class="rev">' +
    '<div class="haut">' +
      '<i class="puce" style="background:' + m.c + '"></i>' +
      '<b class="code">' + ech(refCours(c)) + '</b>' +
      '<span class="matiere">' + ech(m.nom) + '</span>' +
      '<span class="rang' + (r.ancrage ? ' ancrage' : '') + '">' + ech(libelleRang(r.rang)) + '</span>' +
    '</div>' +
    (r.statut === 'reportee'
      ? '<div class="note">Reportée du ' + libelleCourt(r.prevue) + '</div>' : '') +
    (!validable && !modeLecture()
      ? '<div class="note" style="color:var(--texte-3)">Validable à partir du ' +
        libelleCourt(isoDe(plus(dDe(r.date), -7))) + '</div>' : '') +
    zoneNote + cmds + '</article>';
}

/* La carte du dimanche : un bilan de la semaine écoulée (lundi à
   samedi), pas une révision. Succès si plus aucune n'est en attente.
   N'apparaît que pour le dimanche de la semaine en cours : l'afficher
   aussi pour la semaine prochaine doublonnerait le même message. */
function carteRepos(dimancheISO){
  const dl = donneesLecture();
  const lundi = isoDe(plus(dDe(dimancheISO), -6));
  let semaine = dl.revisions.filter(r => r.date >= lundi && r.date < dimancheISO);
  if (!dl.afficherAncrage) semaine = semaine.filter(r => !r.ancrage);
  const total = semaine.length;
  const reste = semaine.filter(r => r.statut === 'aFaire' || r.statut === 'reportee').length;
  const succes = reste === 0;
  let detail = '';
  if (!succes) {
    const prenom = (dl.prenom || '').trim();
    detail = '<span class="repos-detail">il reste ' + reste + ' révision' + (reste > 1 ? 's' : '') +
      ' sur ' + total + (prenom ? ', courage ' + ech(prenom) : '') + '.</span>';
  }
  return '<article class="rev repos' + (succes ? ' succes' : '') + '">' +
    '<div class="repos-corps">' +
      '<span class="repos-ic">' + (succes ? '🏆' : '📚') + '</span>' +
      '<span class="repos-txt">' + (succes ? 'Repos du champion' : 'Encore un peu de boulot') + '</span>' +
      detail +
    '</div></article>';
}

function grouperParDate(liste){
  const g = [];
  liste.forEach(r => {
    let e = g.find(x => x.date === r.date);
    if (!e) { e = {date: r.date, items: []}; g.push(e); }
    e.items.push(r);
  });
  return g;
}

function vueAgenda(){
  const dl = donneesLecture();
  const banniere = modeLecture()
    ? '<div class="suivi-banniere">👀 Lecture seule · suivi d\u2019un autre appareil</div>' : '';
  if (!dl.cours.length) {
    return banniere + '<div class="vide"><div class="gros">📅</div>' +
      '<p><b>Aucune révision planifiée.</b></p>' +
      '<p>' + (modeLecture()
        ? 'Rien n\u2019a encore été encodé sur l\u2019appareil suivi.'
        : 'Ajoute un cours pour lancer son échéancier.') + '</p></div>';
  }

  const auj = aujourdhui();
  const ajISO = isoDe(auj);
  const dimActuel = isoDe(dimancheDe(auj));
  const dimSuivant = isoDe(plus(dimancheDe(auj), 7));

  const enAttente = dl.revisions.filter(r =>
    (r.statut === 'aFaire' || r.statut === 'reportee') &&
    (dl.afficherAncrage || !r.ancrage));

  const retard   = enAttente.filter(r => r.date < ajISO);
  const proches  = enAttente.filter(r => r.date >= ajISO && r.date <= dimSuivant);
  const plusTard = enAttente.filter(r => r.date > dimSuivant);

  let html = banniere;

  if (retard.length) {
    grouperParDate(retard).forEach(g => {
      html += '<section class="jour retard"><h2>En retard · ' + libelleJour(g.date) +
        '<span class="compte">' + g.items.length + '</span></h2>';
      g.items.forEach(r => html += carteRevision(r));
      html += '</section>';
    });
  }

  const grProches = grouperParDate(proches);
  if (!grProches.find(g => g.date === dimActuel)) grProches.push({date: dimActuel, items: []});
  grProches.sort((a, b) => a.date < b.date ? -1 : 1);

  grProches.forEach(g => {
    const titre = g.date === ajISO ? "Aujourd'hui" : libelleJour(g.date);
    html += '<section class="jour"><h2>' + titre +
      (g.items.length ? '<span class="compte">' + g.items.length + '</span>' : '') + '</h2>';
    g.items.forEach(r => html += carteRevision(r));
    if (g.date === dimActuel) html += carteRepos(g.date);
    html += '</section>';
  });

  if (plusTard.length) {
    html += '<details class="pliable" data-cle="semaines"' + ouvert('semaines') + '>' +
      '<summary>Semaines suivantes<span class="compte">' + plusTard.length + '</span></summary>' +
      '<div class="contenu-pliable">';
    grouperParDate(plusTard).forEach(g => {
      html += '<section class="jour"><h2>' + libelleJour(g.date) +
        '<span class="compte">' + g.items.length + '</span></h2>';
      g.items.forEach(r => html += carteRevision(r));
      html += '</section>';
    });
    html += '</div></details>';
  }

  return html;
}

/* Semaine du lundi au dimanche, courte : « DD/MM » pour l'axe des graphiques. */
function libelleAxe(iso){
  const d = dDe(iso);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

/* Quatre indicateurs, semaine par semaine, calés sur la date de
   révision (r.date) — celle qui compte aujourd'hui, y compris après
   un report. Fenêtre bornée à 12 semaines pour rester lisible. */
function calculerSemaines(){
  const dl = donneesLecture();
  if (!dl.cours.length) return {semaines:[], nouveaux:[], revises:[], pourcentages:[], annules:[]};
  const lundiCourant = lundiDe(aujourdhui());
  const premiereISO = dl.cours.map(c => isoDe(lundiDe(dDe(c.date))))
    .reduce((a, b) => a < b ? a : b);
  let debut = dDe(premiereISO);
  const limite = plus(lundiCourant, -11 * 7);
  if (debut < limite) debut = limite;

  const semaines = [];
  for (let d = debut; d <= lundiCourant; d = plus(d, 7)) semaines.push(isoDe(d));

  const nouveaux = [], revises = [], pourcentages = [], annules = [];
  semaines.forEach(lundiISO => {
    const dimISO = isoDe(plus(dDe(lundiISO), 6));
    const nC = dl.cours.filter(c => c.date >= lundiISO && c.date <= dimISO).length;
    const revsSemaine = dl.revisions.filter(r => r.date >= lundiISO && r.date <= dimISO);
    const nRevisees = revsSemaine.filter(r => r.statut === 'faite').length;
    const nAnnulees = revsSemaine.filter(r => r.statut === 'annulee').length;
    const planifiees = revsSemaine.length;
    nouveaux.push(nC);
    revises.push(nRevisees);
    annules.push(nAnnulees);
    pourcentages.push(planifiees ? Math.round(nRevisees / planifiees * 100) : 0);
  });
  return {semaines: semaines, nouveaux: nouveaux, revises: revises,
          pourcentages: pourcentages, annules: annules};
}

/* Petit histogramme SVG autonome, sans bibliothèque : une barre par
   semaine, sa valeur au-dessus, l'étiquette de semaine en dessous. */
function graphiqueBarres(labels, valeurs, options){
  options = options || {};
  const larg = 640, haut = 118, margeHaut = 16, margeBas = 22;
  const zoneH = haut - margeHaut - margeBas;
  const n = Math.max(valeurs.length, 1);
  const pas = larg / n;
  const largBarre = Math.min(30, pas * 0.55);
  const maxVal = options.max || Math.max(1, Math.max.apply(null, valeurs));
  const couleur = options.couleur || 'var(--accent)';
  let barres = '';
  valeurs.forEach((v, i) => {
    const h = (v / maxVal) * zoneH;
    const x = i * pas + (pas - largBarre) / 2;
    const y = margeHaut + (zoneH - h);
    barres += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + largBarre.toFixed(1) +
      '" height="' + Math.max(h, 0).toFixed(1) + '" rx="3" fill="' + couleur + '"></rect>';
    if (v > 0) {
      barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) +
        '" text-anchor="middle" font-size="9" font-family="var(--mono)" fill="var(--texte-2)">' +
        v + (options.suffixe || '') + '</text>';
    }
    barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (haut - 6) +
      '" text-anchor="middle" font-size="8" font-family="var(--mono)" fill="var(--texte-3)">' +
      ech(labels[i]) + '</text>';
  });
  return '<svg viewBox="0 0 ' + larg + ' ' + haut + '" style="width:100%;height:auto;display:block">' +
    '<line x1="0" y1="' + (margeHaut + zoneH) + '" x2="' + larg + '" y2="' + (margeHaut + zoneH) +
    '" stroke="var(--filet)" stroke-width="1"></line>' + barres + '</svg>';
}

/* Le chat utilise le même code que la synchronisation : un seul
   canal par famille, pas de code séparé à gérer. Sans rôle de
   synchronisation configuré, il n'y a pas de canal disponible. */
function codeFamille(){
  if (DB.reglages.role === 'source') return DB.reglages.codePartage;
  if (DB.reglages.role === 'suivi') return DB.reglages.codeSuivi;
  return '';
}

let messagesChat = [];

function libelleHeure(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const auj = new Date();
  const meme = d.getFullYear() === auj.getFullYear() && d.getMonth() === auj.getMonth() && d.getDate() === auj.getDate();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return meme ? (hh + ':' + mm) : (String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + hh + ':' + mm);
}

function demarrerEcouteChat(){
  const code = codeFamille();
  if (!window.SabosseSync || !window.SabosseSync.disponible || !code) return;
  window.SabosseSync.suivreChat(code, (msgs, erreur) => {
    if (erreur) { toast('Connexion au chat interrompue.'); return; }
    if (!msgs) return;
    messagesChat = msgs;
    if (vueActive === 'chat') rendre();
  });
}

async function envoyerMessageChat(){
  const nom = (DB.reglages.nomChat || '').trim();
  if (!nom) { ouvrirChatNom(); return; }
  const champ = document.getElementById('chat-texte');
  if (!champ) return;
  const texte = champ.value.trim();
  if (!texte) return;
  const code = codeFamille();
  if (!code) return;
  champ.value = '';
  champ.disabled = true;
  const ok = await window.SabosseSync.envoyerMessage(code, {
    texte: texte.slice(0, 300), auteur: nom, quand: Date.now()
  });
  champ.disabled = false;
  champ.focus();
  if (!ok) toast('Message non envoyé, réessaie.');
}

      '<div class="tuile annulee"><b>' + annulees + '</b><span>Annulées</span></div>' +
      '<div class="tuile venir"><b>' + venir + '</b><span>À venir</span></div>' +
    '</div>' +
    '<p class="etiquette">Réalisation</p>' +
    '<div class="carte" style="margin-bottom:20px">' +
      '<div style="display:flex;align-items:baseline;gap:10px">' +
      '<b style="font-size:30px;font-weight:800;letter-spacing:-.03em;' +
      'font-variant-numeric:tabular-nums;color:var(--faite)">' + taux + '&nbsp;%</b>' +
      '<span style="font-size:13px;color:var(--texte-2)">des ' + traitees +
      ' révisions échues ont été faites</span></div></div>';

  const s7 = calculerSemaines();
  if (s7.semaines.length) {
    const labels = s7.semaines.map(libelleAxe);
    html += '<p class="etiquette">Évolution hebdomadaire</p>' +
      '<div class="carte graf"><p class="graf-titre">Nouveaux cours</p>' +
        graphiqueBarres(labels, s7.nouveaux, {couleur: 'var(--accent)'}) + '</div>' +
      '<div class="carte graf"><p class="graf-titre">Révisions faites</p>' +
        graphiqueBarres(labels, s7.revises, {couleur: 'var(--faite)'}) + '</div>' +
      '<div class="carte graf"><p class="graf-titre">Taux de révision sur le planifié</p>' +
        graphiqueBarres(labels, s7.pourcentages, {couleur: 'var(--faite)', suffixe: '%', max: 100}) + '</div>' +
      '<div class="carte graf" style="margin-bottom:20px"><p class="graf-titre">Révisions annulées</p>' +
        graphiqueBarres(labels, s7.annules, {couleur: 'var(--annulee)'}) + '</div>';
  }

  const lignes = [];
  dl.matieres.forEach(m => {
    const ids = dl.cours.filter(c => c.code === m.code).map(c => c.id);
    if (!ids.length) return;
    const revs = dl.revisions.filter(r => ids.indexOf(r.cours) !== -1);
    lignes.push({
      m: m,
      cours: ids.length,
      faites: revs.filter(r => r.statut === 'faite').length,
      annulees: revs.filter(r => r.statut === 'annulee').length
    });
  });

  html += '<p class="etiquette">Par matière</p><div class="carte tab">' +
    '<div class="l entete"><span class="n">Matière</span>' +
    '<span class="v">Cours</span><span class="v">Faites</span><span class="v">Annul.</span></div>';
  lignes.forEach(l => {
    html += '<div class="l"><span class="n">' +
      '<i class="puce" style="background:' + l.m.c + '"></i>' +
      '<span>' + ech(l.m.nom) + '</span></span>' +
      '<span class="v">' + l.cours + '</span>' +
      '<span class="v">' + l.faites + '</span>' +
      '<span class="v">' + l.annulees + '</span></div>';
  });
  html += '</div>';

  const historique = dl.revisions
    .filter(r => r.statut === 'faite' || r.statut === 'annulee')
    .sort((a, b) => a.date < b.date ? 1 : -1);
  if (historique.length) {
    const groupes = [];
    historique.forEach(r => {
      const c = trouverCours(r.cours);
      if (!c) return;
      let g = groupes.find(x => x.cours.id === c.id);
      if (!g) { g = {cours: c, items: []}; groupes.push(g); }
      g.items.push(r);
    });

    html += '<details class="pliable" data-cle="historique"' + ouvert('historique') + ' style="margin-top:20px">' +
      '<summary>Historique<span class="compte">' + historique.length + '</span></summary>' +
      '<div class="contenu-pliable">';
    groupes.forEach(g => {
      const m = matiereDe(g.cours.code);
      html += '<div class="hist-groupe"><div class="hist-entete">' +
        '<i class="puce" style="background:' + m.c + '"></i>' +
        '<span>' + ech(refCours(g.cours)) + ' · ' + ech(m.nom) + '</span>' +
        (modeLecture() ? '' :
          '<button class="hist-suppr-serie" data-act="suppr-serie-hist" data-id="' + g.cours.id + '">Supprimer la série</button>') +
        '</div><div class="carte" style="padding:5px 15px">';
      g.items.forEach(r => {
        html += '<div class="hist-l">' +
          '<div class="txt"><b>' + ech(libelleRang(r.rang)) + '</b>' +
          '<span>' + libelleCourt(r.date) + ' · ' + (r.statut === 'faite' ? 'Faite' : 'Annulée') + '</span></div>' +
          (modeLecture() ? '' :
            '<button data-act="reactiver" data-id="' + r.id + '">Réactiver</button>' +
            '<button class="sup" data-act="suppr-revision" data-id="' + r.id + '">✕</button>') +
          '</div>';
      });
      html += '</div></div>';
    });
    html += '</div></details>';
  }

  html += blocParametres();

  html +=
    '<p style="margin-top:18px;text-align:center;font-size:11.5px;color:var(--texte-3)">' +
    'Cabosse ' + VERSION + ' · données conservées sur cet appareil uniquement</p>';
  return html;
}

let minuteurToast;
function toast(txt){
  const t = document.getElementById('toast');
  t.textContent = txt;
  t.classList.add('on');
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.classList.remove('on'), 1900);
}

/* --- Impression du planning à 2 semaines -------------------- */

/* Une colonne par semaine, du lundi au dimanche, en partant du
   lundi de la semaine en cours — y compris les jours déjà passés
   cette semaine, puisqu'une révision en retard reste à cocher. */
function planningImpression(){
  const dl = donneesLecture();
  const debut = lundiDe(aujourdhui());
  const jours = [];
  for (let i = 0; i < 14; i++) jours.push(isoDe(plus(debut, i)));

  const revs = dl.revisions.filter(r =>
    (r.statut === 'aFaire' || r.statut === 'reportee') &&
    jours.indexOf(r.date) !== -1 &&
    (dl.afficherAncrage || !r.ancrage));

  function colonne(liste){
    let html = '';
    liste.forEach(iso => {
      const d = dDe(iso);
      const nomJour = JOURS[d.getDay()].charAt(0).toUpperCase() + JOURS[d.getDay()].slice(1);
      html += '<div class="pr-jour"><h3>' + nomJour + ' ' + libelleCourt(iso) + '</h3>';
      const items = revs.filter(r => r.date === iso);
      if (!items.length) html += '<p class="pr-vide">—</p>';
      items.forEach(r => {
        const c = trouverCours(r.cours);
        if (!c) return;
        const m = matiereDe(c.code);
        html += '<div class="pr-item"><div class="pr-nom">' + ech(refCours(c)) +
          ' <span class="pr-mat">' + ech(m.nom) + '</span> ' +
          '<span class="pr-rang">' + ech(libelleRang(r.rang)) + '</span></div>' +
          '<div class="pr-cases">' +
            '<span class="pr-c"><i></i>Fait</span>' +
            '<span class="pr-c"><i></i>Annulé</span>' +
            '<span class="pr-c"><i></i>Reporté au&nbsp;______</span>' +
          '</div></div>';
      });
      html += '<div class="pr-nouveau"><i></i>Nouveau à encoder&nbsp;: ______________________</div>';
      html += '</div>';
    });
    return html;
  }

  return '<div class="pr-page">' +
    '<div class="pr-entete">Cabosse' + (modeLecture() && dl.prenom ? ' · ' + ech(dl.prenom) : '') +
    ' · planning du ' + libelleCourt(jours[0]) +
    ' au ' + libelleCourt(jours[13]) + '</div>' +
    '<div class="pr-grille">' +
      '<div class="pr-col">' + colonne(jours.slice(0, 7)) + '</div>' +
      '<div class="pr-col">' + colonne(jours.slice(7, 14)) + '</div>' +
    '</div></div>';
}

function imprimerPlanning(){
  document.getElementById('impression').innerHTML = planningImpression();
  window.print();
}

document.getElementById('btn-imprimer').addEventListener('click', imprimerPlanning);

/* --- Synchronisation entre appareils ------------------------- */

/* Ce téléphone devient la « source » : il génère un code (une fois)
   et pousse désormais chaque modification vers Firestore. */
function activerPartage(){
  if (!DB.reglages.codePartage) {
    DB.reglages.codePartage = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : (Math.random().toString(36).slice(2) + Date.now().toString(36));
  }
  DB.reglages.role = 'source';
  sauver();
  demarrerEcouteChat();
  rendre();
  toast('Partage activé.');
}

/* Ce téléphone devient « suivi » : lecture seule, alimentée par le
   flux temps réel de l'appareil source identifié par ce code. */
function activerSuivi(code){
  code = (code || '').trim();
  if (!code) { toast('Colle le code reçu.'); return; }
  DB.reglages.role = 'suivi';
  DB.reglages.codeSuivi = code;
  DB.reglages.affichage = 'suivi'; // on bascule directement dessus : c'est ce qu'on vient de demander à voir
  sauver();
  demarrerEcouteSuivi();
  demarrerEcouteChat();
  rendre();
  toast('Connecté au suivi.');
}

function demarrerEcouteSuivi(){
  if (!window.SabosseSync || !window.SabosseSync.disponible ||
      DB.reglages.role !== 'suivi' || !DB.reglages.codeSuivi) return;
  window.SabosseSync.suivre(DB.reglages.codeSuivi, (donnees, erreur) => {
    if (erreur) { toast('Connexion au suivi interrompue.'); return; }
    if (!donnees) return;
    /* Écrit dans le miroir séparé DB.suivi, jamais dans les données
       personnelles de cet appareil : un arrivage Firestore ne doit
       jamais écraser ce que l'utilisateur encode pour lui-même. */
    DB.suivi = {
      cours: donnees.cours || [],
      revisions: donnees.revisions || [],
      matieres: (donnees.matieres && donnees.matieres.length) ? donnees.matieres : MATIERES_DEFAUT.slice(),
      reglages: donnees.reglages || {}
    };
    Store.ecrire(DB); // mise en cache locale pour la lecture hors-ligne, sans repousser vers Firestore
    rendre();
  });
}

function desactiverSync(){
  if (window.SabosseSync) { window.SabosseSync.arreter(); window.SabosseSync.arreterChat(); }
  DB.reglages.role = 'aucun';
  DB.reglages.affichage = 'personnel';
  messagesChat = [];
  sauver();
  rendre();
  toast('Synchronisation désactivée.');
}

/* Vide le cache du service worker puis recharge : utile quand
   l'app affiche encore une version périmée sur l'écran d'accueil. */
async function forcerMiseAJour(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
    }
    if ('caches' in window) {
      const cles = await caches.keys();
      for (const c of cles) await caches.delete(c);
    }
  } catch (e) { /* on recharge quand même */ }
  location.reload();
}

function exporterSauvegarde(){
  try {
    const blob = new Blob([JSON.stringify(DB)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sabosse-' + isoDe(aujourdhui()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Sauvegarde exportée.');
  } catch (e) { toast('Export impossible.'); }
}

function importerSauvegarde(fichier){
  const lecteur = new FileReader();
  lecteur.onload = () => {
    let o;
    try { o = JSON.parse(lecteur.result); }
    catch (e) { toast('Fichier illisible.'); return; }
    if (!o || !Array.isArray(o.cours) || !Array.isArray(o.revisions)) {
      toast('Fichier invalide.'); return;
    }
    if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
    DB = {
      cours: o.cours,
      revisions: o.revisions,
      matieres: (o.matieres && o.matieres.length) ? o.matieres : MATIERES_DEFAUT.slice(),
      suivi: o.suivi || null,
      reglages: Object.assign({afficherAncrage: true, prenom: '', role: 'aucun', codePartage: '', codeSuivi: '', affichage: 'personnel', nomChat: ''}, o.reglages || {})
    };
    sauver();
    rendre();
    toast('Sauvegarde restaurée.');
  };
  lecteur.readAsText(fichier);
}

function marquer(id, statut){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  r.statut = statut;
  sauver();
  rendre();
  toast(statut === 'faite' ? 'Révision faite.' : 'Révision annulée.');
}

/* Annule toute la série encore en attente d'un cours (aFaire ou
   reportée) — les révisions déjà faites ne sont jamais touchées. */
function annulerSerie(id){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  const n = DB.revisions.filter(x =>
    x.cours === r.cours && (x.statut === 'aFaire' || x.statut === 'reportee')).length;
  DB.revisions.forEach(x => {
    if (x.cours === r.cours && (x.statut === 'aFaire' || x.statut === 'reportee')) x.statut = 'annulee';
  });
  sauver();
  rendre();
  toast(n + ' révision' + (n > 1 ? 's' : '') + ' annulée' + (n > 1 ? 's' : '') + '.');
}

/* Gestion des matières : le code identifie les cours existants et
   n'est donc modifiable qu'à la création, jamais en édition. */
function ajouterMatiere(code, nom, couleur){
  code = code.toUpperCase().trim();
  nom = nom.trim();
  if (!code || !nom) { toast('Code et nom requis.'); return; }
  if (DB.matieres.some(m => m.code === code)) { toast('Ce code existe déjà.'); return; }
  DB.matieres.push({code: code, nom: nom, c: couleur});
  sauver();
  rendre();
  toast(code + ' ajoutée.');
}

function modifierMatiere(code, nom, couleur){
  const m = DB.matieres.find(x => x.code === code);
  if (!m) return;
  nom = nom.trim();
  if (!nom) { toast('Le nom ne peut pas être vide.'); return; }
  m.nom = nom;
  m.c = couleur;
  matiereEnEdition = null;
  sauver();
  rendre();
  toast('Matière modifiée.');
}

function supprimerMatiere(code){
  const nb = DB.cours.filter(c => c.code === code).length;
  const msg = nb
    ? 'Supprimer ' + code + ' ? ' + nb + ' cours l\u2019utilisent encore et garderont ce code.'
    : 'Supprimer la matière ' + code + ' ?';
  if (!confirm(msg)) return;
  DB.matieres = DB.matieres.filter(m => m.code !== code);
  sauver();
  rendre();
  toast('Matière supprimée.');
}

let reportEnCours = null;
const voile = document.getElementById('voile');

function ouvrirReport(id){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  const c = trouverCours(r.cours);
  reportEnCours = id;
  document.getElementById('voile-info').textContent =
    (c ? refCours(c) + ' · ' : '') + libelleRang(r.rang) + ' · prévue le ' + libelleCourt(r.date);
  document.getElementById('voile-date').value = isoDe(plus(dDe(r.date), 7));
  voile.classList.add('on');
}
function fermerReport(){ voile.classList.remove('on'); reportEnCours = null; }

document.getElementById('voile-annuler').addEventListener('click', fermerReport);
voile.addEventListener('click', e => { if (e.target === voile) fermerReport(); });
document.getElementById('voile-ok').addEventListener('click', () => {
  const d = document.getElementById('voile-date').value;
  if (!d || !reportEnCours) return;
  const r = DB.revisions.find(x => x.id === reportEnCours);
  if (r) { r.date = d; r.statut = 'reportee'; sauver(); }
  fermerReport();
  rendre();
  toast('Reportée au ' + libelleCourt(d) + '.');
});

/* Note de difficulté, rattachée au cours (pas à une révision précise) :
   modifiable depuis n'importe quelle révision de ce cours, passée ou
   à venir, puisqu'elle porte sur la matière elle-même. */
let noteEnCours = null;
const noteVoile = document.getElementById('note-voile');

function ouvrirNote(coursId){
  const c = trouverCours(coursId);
  if (!c) return;
  noteEnCours = coursId;
  document.getElementById('note-info').textContent = refCours(c) + ' · ' + matiereDe(c.code).nom;
  document.getElementById('note-texte').value = c.commentaire || '';
  noteVoile.classList.add('on');
}
function fermerNote(){ noteVoile.classList.remove('on'); noteEnCours = null; }

document.getElementById('note-annuler').addEventListener('click', fermerNote);
noteVoile.addEventListener('click', e => { if (e.target === noteVoile) fermerNote(); });
document.getElementById('note-ok').addEventListener('click', () => {
  if (!noteEnCours) return;
  const c = trouverCours(noteEnCours);
  if (c) { c.commentaire = document.getElementById('note-texte').value.trim(); sauver(); rendre(); toast('Note enregistrée.'); }
  fermerNote();
});

/* Confirmation, requise avant de marquer une révision faite ou
   annulée. Pour une annulation, deux issues possibles : cette seule
   révision, ou toute la série encore en attente pour ce cours. */
let actionEnCours = null;
const confirmVoile = document.getElementById('confirm-voile');

function demanderConfirmation(id, statut){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  const c = trouverCours(r.cours);
  actionEnCours = {id: id};
  const actions = document.getElementById('confirm-actions');
  const zoneNote = document.getElementById('confirm-note-zone');
  if (statut === 'faite') {
    document.getElementById('confirm-titre').textContent = 'Marquer comme faite ?';
    zoneNote.style.display = '';
    document.getElementById('confirm-note').value = (c && c.commentaire) || '';
    actions.innerHTML = '<button class="bouton principal" data-confirm="faite">Confirmer</button>';
  } else {
    document.getElementById('confirm-titre').textContent = 'Annuler cette révision ?';
    zoneNote.style.display = 'none';
    actions.innerHTML =
      '<button class="bouton discret" data-confirm="annulee-une">Cette révision seule</button>' +
      '<button class="bouton principal" style="background:var(--annulee);box-shadow:none" ' +
      'data-confirm="annulee-serie">Toute la série ' + (c ? ech(refCours(c)) : '') + '</button>';
  }
  document.getElementById('confirm-info').textContent =
    (c ? refCours(c) + ' · ' : '') + libelleRang(r.rang) + ' · ' + libelleJour(r.date);
  confirmVoile.classList.add('on');
}
function fermerConfirmation(){ confirmVoile.classList.remove('on'); actionEnCours = null; }

document.getElementById('confirm-non').addEventListener('click', fermerConfirmation);
confirmVoile.addEventListener('click', e => {
  if (e.target === confirmVoile) { fermerConfirmation(); return; }
  const b = e.target.closest('button[data-confirm]');
  if (!b || !actionEnCours) return;
  const type = b.dataset.confirm;
  if (type === 'faite') {
    const r = DB.revisions.find(x => x.id === actionEnCours.id);
    const c = r && trouverCours(r.cours);
    if (c) c.commentaire = document.getElementById('confirm-note').value.trim();
    marquer(actionEnCours.id, 'faite');
  }
  else if (type === 'annulee-une')   marquer(actionEnCours.id, 'annulee');
  else if (type === 'annulee-serie') annulerSerie(actionEnCours.id);
  fermerConfirmation();
});

vue.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'faite')         demanderConfirmation(id, 'faite');
  else if (act === 'annuler')  demanderConfirmation(id, 'annulee');
  else if (act === 'reporter') ouvrirReport(id);
  else if (act === 'note') { if (!modeLecture()) ouvrirNote(id); }
  else if (act === 'reactiver') {
    const r = DB.revisions.find(x => x.id === id);
    if (r) { r.statut = 'aFaire'; sauver(); rendre(); toast('Révision remise en attente.'); }
  }
  else if (act === 'suppr-revision') {
    if (confirm('Supprimer définitivement cette révision ? Cette action est irréversible.')) supprimerRevision(id);
  }
  else if (act === 'suppr-serie-hist') {
    const c = trouverCours(id);
    if (c && confirm('Supprimer définitivement toute la série ' + refCours(c) +
        ' (y compris les révisions encore à venir) ? Cette action est irréversible.')) {
      supprimerCours(id); rendre(); toast('Série ' + refCours(c) + ' supprimée.');
    }
  }
  else if (act === 'export') exporterSauvegarde();
  else if (act === 'importDeclencheur') {
    const f = document.getElementById('fichier-import');
    if (f) f.click();
  }
  else if (act === 'maj') {
    if (confirm('Forcer la mise à jour ? L\'application va se recharger.')) forcerMiseAJour();
  }
  else if (act === 'parametres-deverrouiller') ouvrirMotDePasse();
  else if (act === 'chat-nom') ouvrirChatNom();
  else if (act === 'chat-envoyer') envoyerMessageChat();
  else if (act === 'sync-source') {
    if (confirm('Faire de ce téléphone la source qui encode et partage les cours ?')) activerPartage();
  }
  else if (act === 'sync-suivre') {
    const champ = document.getElementById('sync-code-entree');
    activerSuivi(champ ? champ.value : '');
  }
  else if (act === 'sync-copier') {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DB.reglages.codePartage)
        .then(() => toast('Code copié.'))
        .catch(() => toast('Copie impossible : sélectionne le texte manuellement.'));
    } else {
      toast('Copie indisponible : sélectionne le texte manuellement.');
    }
  }
  else if (act === 'sync-desactiver') {
    if (confirm('Désactiver la synchronisation sur cet appareil ?')) desactiverSync();
  }
  else if (act === 'matiere-editer') { matiereEnEdition = id; rendre(); }
  else if (act === 'matiere-annuler-edition') { matiereEnEdition = null; rendre(); }
  else if (act === 'matiere-enregistrer') {
    const nom = document.getElementById('me-nom').value;
    const couleur = document.getElementById('me-couleur').value;
    modifierMatiere(id, nom, couleur);
  }
  else if (act === 'matiere-suppr') supprimerMatiere(id);
  else if (act === 'matiere-ajouter') {
    const code = document.getElementById('nm-code').value;
    const nom = document.getElementById('nm-nom').value;
    const couleur = document.getElementById('nm-couleur').value;
    ajouterMatiere(code, nom, couleur);
  }
  else if (act === 'suppr') {
    const c = trouverCours(id);
    if (c && confirm('Supprimer ' + refCours(c) + ' et toutes ses révisions ?')) {
      supprimerCours(id); rendre(); toast('Cours supprimé.');
    }
  }
});

vue.addEventListener('input', e => {
  if (e.target.id === 'f-date') majApercu();
  if (e.target.id === 'f-num') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
});

vue.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'chat-texte' && e.key === 'Enter') {
    e.preventDefault();
    envoyerMessageChat();
  }
});

vue.addEventListener('change', e => {
  if (e.target.id === 'f-ancrage') {
    DB.reglages.afficherAncrage = e.target.checked;
    sauver();
    majApercu();
    return;
  }
  if (e.target.id === 'f-prenom') {
    DB.reglages.prenom = e.target.value;
    sauver();
    return;
  }
  if (e.target.id === 'fichier-import' && e.target.files && e.target.files[0]) {
    importerSauvegarde(e.target.files[0]);
    e.target.value = '';
  }
});

vue.addEventListener('click', e => {
  if (e.target.id !== 'f-ok') return;
  const code = document.getElementById('f-mat').value;
  let num = document.getElementById('f-num').value.replace(/\D/g, '');
  const date = document.getElementById('f-date').value;
  if (!code) { toast('Choisis une matière.'); return; }
  if (!num)  { toast('Indique le numéro du cours.'); return; }
  if (!date) { toast('Indique la date du cours.'); return; }
  num = num.padStart(3, '0');
  if (!ajouterCours(code, num, date)) { toast('Ce cours est déjà enregistré.'); return; }
  vueActive = 'agenda';
  rendre();
  toast(code + '-' + num + ' planifié.');
});

document.getElementById('barre').addEventListener('click', e => {
  const b = e.target.closest('button[data-vue]');
  if (!b) return;
  vueActive = b.dataset.vue;
  rendre();
});

document.getElementById('bascule-profil').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  DB.reglages.affichage = (b.dataset.act === 'profil-suivi') ? 'suivi' : 'personnel';
  sauver();
  rendre();
});

rendre();

/* Le module de synchronisation se charge après ce script (il est
   différé) : on attend son signal avant de démarrer l'écoute ou de
   pousser l'état actuel, plutôt que de dépendre de l'ordre de chargement. */
window.addEventListener('sabosse-sync-pret', () => {
  if (DB.reglages.role === 'suivi') demarrerEcouteSuivi();
  else if (DB.reglages.role === 'source' && DB.reglages.codePartage) {
    window.SabosseSync.envoyer(DB.reglages.codePartage, {
      cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres,
      reglages: {afficherAncrage: DB.reglages.afficherAncrage, prenom: DB.reglages.prenom}
    });
  }
  demarrerEcouteChat();
  rendre(); // met à jour le bloc Synchronisation si Paramètres avancés est ouvert
});

/* Retour de connexion : si la dernière action a poussé dans le vide
   (téléphone hors réseau), on rattrape avec l'état complet actuel
   plutôt que d'attendre la prochaine action de l'utilisateur. */
window.addEventListener('online', () => {
  if (DB.reglages.role === 'source') sauver();
  else if (DB.reglages.role === 'suivi') demarrerEcouteSuivi();
  demarrerEcouteChat();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
