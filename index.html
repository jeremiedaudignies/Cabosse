<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#094639">
<meta name="color-scheme" content="light only">
<title>Cabosse</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Cabosse">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ============================================================
   Cabosse — jetons de conception
   Mêmes règles que RHABDO : fond clair, cartes blanches, une
   seule couleur de signal. Le logo et la barre de statut sont en
   terracotta (couleur cabosse) ; --accent reste indigo pour les
   boutons et liens, hérité de la base commune avec RHABDO.
   ============================================================ */
:root{
  --fond:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEFF3; --filet:#E1E5EA;
  --texte:#14171C; --texte-2:#5F6A7B; --texte-3:#9AA3B2;
  --accent:#3A56D4; --accent-doux:#E7EBFC;
  --faite:#00A08C; --reportee:#F2A104; --annulee:#D14343; --retard:#D14343;
  --ombre:0 1px 2px rgba(20,23,28,.06), 0 4px 14px rgba(20,23,28,.05);
  --corps:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.emo{font-size:1.5em}
html,body{margin:0;padding:0;height:100%}
body{background:var(--fond);color-scheme:light;color:var(--texte);font-family:var(--corps);
  font-size:16px;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#entete,#entete *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--texte);background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-s);padding:11px 12px;width:100%;appearance:none}
textarea{resize:vertical;min-height:64px;line-height:1.4}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' stroke='%235F6A7B' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' d='M4 6.5l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-doux)}
input[type="checkbox"]{width:22px;height:22px;flex:0 0 auto;padding:0;border-radius:7px;
  border:1.5px solid var(--filet);background:var(--surface);cursor:pointer;appearance:none;
  transition:background-color .15s,border-color .15s}
input[type="checkbox"]:checked{border-color:var(--accent);background-color:var(--accent);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' d='M3.2 8.4l3.4 3.4L12.8 5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center;background-size:14px 14px}
.check-ligne{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.check-ligne span{font-size:13px;color:var(--texte-2);font-weight:600}

#app{display:flex;flex-direction:column;height:100dvh}
#entete{flex:0 0 auto;padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;
  gap:12px;background:var(--surface);border-bottom:1px solid var(--filet)}
#entete .glyphe{width:38px;height:38px;flex:0 0 auto;border-radius:var(--r-s);
  object-fit:cover;display:block}
#entete .titres{flex:1;min-width:0}
#entete .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600}
#entete h1{margin:0;font-weight:800;font-size:19px;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btn-imprimer{flex:0 0 auto;width:44px;height:44px;border-radius:var(--r-s);
  background:var(--surface-2);font-size:28.5px;display:flex;align-items:center;justify-content:center}
#impression{display:none}
#bascule-profil{flex:0 0 auto;display:flex;gap:4px;padding:8px 16px;background:var(--surface);
  border-bottom:1px solid var(--filet);overflow-x:auto}
#bascule-profil .seg{flex:1 0 auto;min-width:88px;padding:8px 10px;border-radius:99px;background:var(--surface-2);
  font-size:12.5px;font-weight:700;color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bascule-profil .seg.actif{background:var(--accent);color:#fff}
#vue{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
#barre{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);
  border-top:1px solid var(--filet);padding-bottom:var(--safe-b)}
#barre button{position:relative;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--texte-3);transition:color .15s}
#barre button .ic{font-size:30px;line-height:1;filter:grayscale(1) opacity(.55);
  display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%}
#barre button .lb{font-size:10px;font-weight:600;text-align:center;line-height:1.15;padding:0 2px}
#barre button[aria-current="page"]{color:var(--accent)}
#barre button[aria-current="page"] .ic{filter:none}
#barre button .ic.ic-rouge{filter:none;background:#FBDCDA}
#barre button .ic.ic-verte{filter:none;background:#D6F0E1}
.badge-non-lu{position:absolute;top:4px;left:calc(50% + 12px);width:9px;height:9px;border-radius:50%;
  background:var(--annulee);display:none}
.badge-non-lu.on{display:block;animation:clignoter 1.1s ease-in-out infinite}
@keyframes clignoter{0%,100%{opacity:1}50%{opacity:.2}}

.etiquette{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--texte-3);font-weight:600;margin:0 0 8px}
.carte{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:15px;
  box-shadow:var(--ombre)}
.champ{margin-bottom:12px}
.champ label{display:block;font-size:12.5px;font-weight:600;color:var(--texte-2);margin-bottom:6px}
.aide-champ{display:block;font-size:11px;color:var(--texte-3);margin-top:5px;line-height:1.35}
.bouton{display:block;width:100%;padding:16px;border-radius:99px;background:var(--surface-2);
  font-weight:700;font-size:16px;letter-spacing:-.01em;transition:transform .08s}
.bouton:active{transform:scale(.98)}
.bouton.principal{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(58,86,212,.28)}
.bouton.discret{background:transparent;border:1.5px solid var(--filet);color:var(--texte-2);
  font-weight:600;font-size:14.5px;padding:13px}
.vide{text-align:center;padding:52px 20px;color:var(--texte-2)}
.vide .gros{font-size:57px;margin-bottom:12px}
.vide p{margin:0 0 4px}
.suivi-banniere{background:var(--accent-doux);color:var(--accent);font-size:12px;font-weight:700;
  text-align:center;padding:9px 12px;border-radius:var(--r-m);margin-bottom:14px}

/* --- agenda --- */
.jour{margin-bottom:16px}
.jour > h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--texte-2);
  display:flex;align-items:baseline;gap:8px}
.compte{font-family:var(--mono);font-size:11px;color:var(--texte-3);font-weight:500}
.jour.retard > h2{color:var(--retard)}
.rev{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:13px 15px;
  margin-bottom:8px;box-shadow:var(--ombre)}
.rev.rev-jour{background:rgba(179,58,30,.3);border-color:rgba(179,58,30,.35)}
.rev .haut{display:flex;align-items:center;gap:10px}
.rev .code{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.01em}
.rev .matiere{font-size:12.5px;color:var(--texte-2);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.puce{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.rev .rang{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--texte-3);
  background:var(--surface-2);border-radius:99px;padding:3px 8px;flex:0 0 auto}
.rev .rang.ancrage{color:var(--accent);background:var(--accent-doux)}
.rev .note{font-size:11.5px;color:var(--reportee);font-weight:600;margin-top:6px}
.rev .cmds{display:flex;gap:6px;margin-top:11px}
.rev .cmds button{flex:1;padding:9px 4px;border-radius:99px;background:var(--surface-2);
  font-size:11.5px;font-weight:600;color:var(--texte-2);white-space:nowrap}
.rev .cmds button.ok{background:var(--faite);color:#fff}
.rev .cmds button.verrou{opacity:.4;cursor:not-allowed}

/* --- carte de repos du dimanche --- */
.rev.repos{display:flex;align-items:center;justify-content:center;padding:16px 15px}
.repos-corps{display:flex;flex-direction:column;align-items:center;gap:6px}
.repos-ic{font-size:39px;line-height:1}
.repos-txt{font-size:13.5px;font-weight:700;color:var(--texte-2)}
.repos-detail{font-size:11.5px;color:var(--texte-3);font-weight:600;text-align:center;max-width:220px}
.repos-barre{width:100%;max-width:210px;height:8px;border-radius:99px;background:var(--surface-2);
  overflow:hidden;margin-top:9px}
.repos-barre-remplie{height:100%;border-radius:99px;transition:width .3s ease,background-color .3s ease}
.repos-pct{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--texte-2);margin-top:4px}
.repos-scores{display:flex;gap:6px;width:100%;max-width:260px;margin-top:12px}
.repos-score{flex:1;background:var(--surface-2);border-radius:var(--r-s);padding:8px 4px;
  text-align:center;position:relative}
.repos-score-titre{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;color:var(--texte-3)}
.repos-score b{display:block;font-family:var(--mono);font-size:17px;font-weight:800;
  margin-top:2px;color:var(--texte)}
.repos-score.record{background:var(--accent-doux)}
.repos-score.record b{color:var(--accent)}
.repos-record{display:block;font-size:8.5px;font-weight:800;color:var(--accent);margin-top:2px;
  white-space:nowrap}
.rev.repos.succes .repos-txt{color:var(--faite)}
.rev.repos.succes .repos-ic{animation:repos-pop .5s ease}
@keyframes repos-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}

/* --- section pliable (semaines suivantes, historique) --- */
details.pliable{margin:4px 0 16px;border:1px solid var(--filet);border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--ombre);overflow:hidden}
details.pliable summary{padding:14px 15px;font-size:13px;font-weight:700;color:var(--texte-2);
  list-style:none;position:relative;padding-right:34px;cursor:pointer}
details.pliable summary::-webkit-details-marker{display:none}
details.pliable summary::after{content:"+";font-size:18px;color:var(--texte-3);
  position:absolute;right:15px;top:50%;transform:translateY(-50%)}
details.pliable[open] summary::after{content:"\2013"}
details.pliable summary .compte{margin-left:6px}
details.pliable .contenu-pliable{padding:0 15px 15px}
details.pliable .contenu-pliable .jour{margin-bottom:14px}
.hist-l{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--filet)}
.hist-l:last-child{border-bottom:0}
.hist-l .txt{flex:1;min-width:0}
.hist-l .txt b{display:block;font-family:var(--mono);font-size:13px;font-weight:700}
.hist-l .txt span{display:block;font-size:11.5px;color:var(--texte-2)}
.hist-l button{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--surface-2);
  font-size:11.5px;font-weight:600;color:var(--texte-2)}
.hist-l button.sup{color:var(--annulee);padding:7px 10px;font-size:17.25px}
.hist-groupe{margin-bottom:14px}
.hist-groupe:last-child{margin-bottom:0}
.hist-entete{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hist-entete span{flex:1;min-width:0;font-size:12.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-suppr-serie{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--annulee)}
.sync-code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:var(--r-s);
  padding:10px 12px;word-break:break-all}
.qr-bloc{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:var(--r-m);
  margin-bottom:10px}
.qr-bloc svg{width:150px;height:150px}
.suivi-ligne{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--filet)}
.suivi-ligne:last-of-type{border-bottom:0}
.suivi-ligne .txt{flex:1;min-width:0}
.suivi-ligne .txt b{display:block;font-size:13px;font-weight:700}
.suivi-ligne .txt span{display:block;font-size:11px;color:var(--texte-3);font-family:var(--mono)}
.suivi-ligne button{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--annulee)}
#scan-voile{position:fixed;inset:0;background:#000;display:none;z-index:25;flex-direction:column}
#scan-voile.on{display:flex}
.scan-entete{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;
  font-size:15px;padding:calc(var(--safe-t) + 14px) 16px 14px}
.scan-entete button{color:#fff;font-size:20px;width:32px;height:32px}
.scan-corps{display:flex;flex-direction:column;height:100%}
#scan-video{flex:1;width:100%;object-fit:cover;background:#000}
#scan-statut{color:#fff;text-align:center;font-size:13px;padding:16px 24px calc(20px + var(--safe-b));
  background:#000}
.parametres-verrou{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:20px}
.parametres-verrou .ic{font-size:30px;flex:0 0 auto}
.parametres-verrou .txt{flex:1;min-width:0}
.parametres-verrou .txt b{display:block;font-size:13px;font-weight:700}
.parametres-verrou .txt span{font-size:11.5px;color:var(--texte-2)}
.aide-bloc{margin-bottom:10px}
.aide-bloc:last-child{margin-bottom:0}
.aide-bloc b{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.aide-bloc p{margin:0;font-size:12.5px;color:var(--texte-2);line-height:1.5}

/* --- chat --- */
#chat-fil{display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 320px)}
.vide-chat{text-align:center;color:var(--texte-3);font-size:13px;padding:24px 0;margin:auto}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:82%}
.msg.moi{align-self:flex-end;align-items:flex-end}
.msg-auteur{font-size:10.5px;font-weight:700;color:var(--texte-3);margin:0 0 2px 3px}
.msg-bulle{background:var(--surface);border:1px solid var(--filet);border-radius:16px 16px 16px 4px;
  padding:9px 13px;font-size:14px;line-height:1.4;box-shadow:var(--ombre);word-break:break-word;white-space:pre-wrap}
.msg.moi .msg-bulle{background:var(--accent);color:#fff;border-color:var(--accent);
  border-radius:16px 16px 4px 16px}
.msg-heure{font-size:10px;color:var(--texte-3);margin:3px 4px 0}
.chat-bas{position:sticky;bottom:0;background:var(--fond);padding-top:10px;margin-top:14px}
.chat-nom{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px}
.chat-saisie{display:flex;gap:8px;align-items:flex-end}
.chat-saisie input{flex:1}
.chat-saisie button{flex:0 0 auto;width:44px;height:44px;border-radius:99px;background:var(--accent);
  color:#fff;font-size:25.5px;display:flex;align-items:center;justify-content:center}
.notif-banniere{display:block;width:100%;background:var(--accent-doux);color:var(--accent);
  font-size:12.5px;font-weight:700;text-align:center;padding:9px 12px;border-radius:var(--r-m);margin-bottom:12px}

/* --- aperçu de l'échéancier --- */
.apercu{margin-top:12px}
.apercu .l{display:flex;align-items:baseline;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--filet);font-size:13px}
.apercu .l:last-child{border-bottom:0}
.apercu .l .r{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--texte-3);
  min-width:56px}
.apercu .l .r.ancrage{color:var(--accent)}
.apercu .l .d{font-variant-numeric:tabular-nums}

/* --- liste des cours --- */
.ligne{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-m);margin-bottom:8px;box-shadow:var(--ombre)}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-family:var(--mono);font-size:14px;font-weight:700}
.ligne .txt span{display:block;font-size:12px;color:var(--texte-2)}
.ligne .sup{flex:0 0 auto;width:34px;height:34px;border-radius:var(--r-s);
  background:var(--surface-2);color:var(--texte-3);font-size:22.5px}

/* --- gestion des matières --- */
.mat-l{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--filet)}
.mat-l:last-child{border-bottom:0}
.mat-nom{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat-nom b{font-family:var(--mono)}
.mini{flex:0 0 auto;width:30px;height:30px;border-radius:var(--r-s);background:var(--surface-2);
  color:var(--texte-2);font-size:21px}
.mini.sup{color:var(--annulee)}
.mini.ok{color:#fff;background:var(--faite)}
.mat-edit input[type="text"]{flex:1;padding:8px 10px;font-size:13px}
input[type="color"]{width:34px;height:34px;flex:0 0 auto;padding:2px;border-radius:var(--r-s);
  border:1.5px solid var(--filet);background:var(--surface);cursor:pointer}

/* --- statistiques --- */
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.tuile{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);
  padding:13px 15px;box-shadow:var(--ombre)}
.tuile b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.tuile span{display:block;font-size:11.5px;font-weight:600;color:var(--texte-2);margin-top:2px}
.tuile.faite b{color:var(--faite)} .tuile.reportee b{color:var(--reportee)}
.tuile.annulee b{color:var(--annulee)} .tuile.venir b{color:var(--accent)}
.carte.graf{margin-bottom:12px;padding:13px 14px 6px}
.graf-titre{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--texte-2)}
.mat-stats{margin-bottom:10px}
.mat-stats-entete{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13.5px;font-weight:700}
.mat-stats-ligne{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;
  border-bottom:1px solid var(--filet);font-size:12.5px;color:var(--texte-2)}
.mat-stats-ligne:last-child{border-bottom:0}
.mat-stats-ligne b{font-variant-numeric:tabular-nums;color:var(--texte);font-weight:700}
.note-ligne{padding:7px 0;border-bottom:1px solid var(--filet);font-size:12.5px}
.note-ligne:last-child{border-bottom:0}
.note-ligne b{display:block;font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:2px}
.note-ligne span{color:var(--texte-2);line-height:1.4}

/* --- report, confirmation et note --- */
#voile,#confirm-voile,#note-voile,#motdepasse-voile,#chatnom-voile{position:fixed;inset:0;background:rgba(20,23,28,.45);display:none;
  align-items:flex-end;z-index:20}
#voile.on,#confirm-voile.on,#note-voile.on,#motdepasse-voile.on,#chatnom-voile.on{display:flex}
#voile .feuille,#confirm-voile .feuille,#note-voile .feuille,#motdepasse-voile .feuille,#chatnom-voile .feuille{width:100%;background:var(--surface);

<!-- ============================================================
     Synchronisation Firebase (optionnelle)
     Coller ci-dessous la configuration du projet Firebase créé pour
     Cabosse (Console Firebase → Paramètres du projet → Vos
     applications → icône </> « application Web »). Tant que ces
     valeurs ne sont pas remplacées, la synchronisation reste
     désactivée sans faire planter le reste de l'app.

     Nécessite aussi, dans la console Firebase :
     Authentication → Sign-in method → activer « Anonymous ».
     Voir les règles Firestore fournies séparément — l'écriture y
     est vérifiée via un identifiant anonyme stocké dans un document
     jamais lisible par un client, distinct du code de lecture.
     ============================================================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, limitToLast, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDL1Du9jLAD13gHQI1Y_4LQ1SsWGRSQJAc",
  authDomain: "cabosse-famille.firebaseapp.com",
  projectId: "cabosse-famille",
  storageBucket: "cabosse-famille.firebasestorage.app",
  messagingSenderId: "779388589101",
  appId: "1:779388589101:web:f6cac26a448e2f25d4d4a4"
};

const configure = Object.values(FIREBASE_CONFIG).every(v => typeof v === 'string' && !v.startsWith('COLLE_'));
let bdd = null, auth = null, arreterEcouteChat = null;
const ecoutesSuivi = {}; // une désinscription par code suivi, plusieurs enfants possibles à la fois
if (configure) {
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    bdd = getFirestore(app);
    auth = getAuth(app);
  } catch (e) { console.error('SABOSSE sync : configuration Firebase invalide', e); }
}

/* Authentifie l'appareil auprès de Firebase à la demande : requis
   pour pousser les données de révision (mode source) et pour
   envoyer un message dans le chat, quel que soit le rôle. La lecture
   des données de révision, elle, ne demande aucune identité. */
function assurerAuth(){
  return new Promise((resolve, reject) => {
    if (auth.currentUser) { resolve(auth.currentUser); return; }
    const arret = onAuthStateChanged(auth, u => { if (u) { arret(); resolve(u); } });
    signInAnonymously(auth).catch(e => { arret(); reject(e); });
  });
}

window.SabosseSync = {
  disponible: configure && !!bdd,
  async envoyer(code, donnees){
    if (!this.disponible || !code) return false;
    try {
      const u = await assurerAuth();
      /* Tentative d'enregistrement comme écrivain autorisé — n'a
         d'effet réel que la toute première fois (le document est
         ensuite verrouillé par les règles Firestore) ; les tentatives
         suivantes échouent silencieusement, sans conséquence. */
      try { await setDoc(doc(bdd, 'sabosse_writers', code), {uid: u.uid}); } catch (e) { /* déjà pris, sans effet */ }
      await setDoc(doc(bdd, 'sabosse', code), Object.assign({}, donnees, {misAJour: Date.now()}));
      return true;
    } catch (e) { console.error('SABOSSE sync : envoi impossible', e); return false; }
  },
  suivre(code, callback){
    if (!this.disponible || !code) return;
    if (ecoutesSuivi[code]) ecoutesSuivi[code](); // ré-écoute propre du même code, sans dupliquer
    ecoutesSuivi[code] = onSnapshot(
      doc(bdd, 'sabosse', code),
      snap => { if (snap.exists()) callback(snap.data()); },
      err => { console.error('SABOSSE sync : écoute interrompue', err); callback(null, err); }
    );
  },
  arreter(code){
    if (code) {
      if (ecoutesSuivi[code]) { ecoutesSuivi[code](); delete ecoutesSuivi[code]; }
      return;
    }
    Object.keys(ecoutesSuivi).forEach(c => { ecoutesSuivi[c](); delete ecoutesSuivi[c]; });
  },
  /* Chat familial : contrairement aux données de révision, n'importe
     quel appareil authentifié (source ou suivi) peut y écrire — ce
     n'est plus une donnée à sens unique. */
  async envoyerMessage(code, message){
    if (!this.disponible || !code) return false;
    try {
      await assurerAuth();
      await addDoc(collection(bdd, 'sabosse_chat', code, 'messages'), message);
      return true;
    } catch (e) { console.error('SABOSSE sync : message impossible', e); return false; }
  },
  /* Purge côté serveur : les messages restent sinon indéfiniment dans
     Firestore. Nécessite que les règles autorisent la suppression
     pour un utilisateur authentifié (voir les instructions fournies). */
  async purgerMessages(code, ids){
    if (!this.disponible || !code || !ids.length) return;
    try {
      await assurerAuth();
      await Promise.all(ids.map(id =>
        deleteDoc(doc(bdd, 'sabosse_chat', code, 'messages', id)).catch(() => {})));
    } catch (e) { console.error('SABOSSE sync : purge du chat impossible', e); }
  },
  suivreChat(code, callback){
    if (!this.disponible || !code) return;
    if (arreterEcouteChat) arreterEcouteChat();
    const q = query(collection(bdd, 'sabosse_chat', code, 'messages'), orderBy('quand', 'asc'), limitToLast(200));
    arreterEcouteChat = onSnapshot(q,
      snap => {
        const msgs = [];
        snap.forEach(d => msgs.push(Object.assign({id: d.id}, d.data())));
        callback(msgs);
      },
      err => { console.error('SABOSSE sync : chat interrompu', err); callback(null, err); }
    );
  },
  arreterChat(){
    if (arreterEcouteChat) { arreterEcouteChat(); arreterEcouteChat = null; }
  }
};

/* Signale au script principal que SabosseSync est prêt à l'emploi
   (ce module se charge après le script classique, jamais avant). */
window.dispatchEvent(new Event('sabosse-sync-pret'));
</script>

<!-- Génération et lecture de QR code, en JS pur : Safari iOS n'implémente
     pas l'API native de détection de codes-barres, ces deux bibliothèques
     ne s'appuient donc dessus ni l'une ni l'autre. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
'use strict';
const VERSION = 'v24 · 5 septembre 2026';

/* ============================================================
   Matières — liste par défaut au premier lancement, éditable
   ensuite depuis la vue Ajout (DB.matieres fait foi une fois créé).
   ============================================================ */
/* ============================================================
   Années scolaires — de l'école primaire au parcours pro.
   ============================================================ */
const ANNEES = (function(){
  const a = ['CM1', 'CM2', '6ème', '5ème', '4ème', '3ème', '2nde', '1ère', 'Terminale'];
  for (let i = 1; i <= 10; i++) a.push('BAC+' + i);
  for (let i = 1; i <= 40; i++) a.push('PRO' + i);
  return a;
})();

/* ============================================================
   Rappels à long terme
   Une fois l'échéancier de l'année scolaire épuisé, le cours
   revient à la date anniversaire de sa création : une fois par an
   s'il n'a pas de note de difficulté, une fois par trimestre s'il
   en a une, et cela pendant 60 ans.

   Ces rappels ne sont PAS tous générés d'avance : 60 ans de rappels
   trimestriels feraient 240 lignes par cours, ce qui saturerait le
   stockage local et dépasserait la limite de 1 Mo d'un document
   Firestore. On génère donc jusqu'à un horizon glissant, complété
   automatiquement à chaque ouverture de l'application.
   ============================================================ */
const RAPPEL_ANNEES = 60;
const HORIZON_MOIS = 36;

function plusMois(d, n){
  const r = new Date(d.getTime());
  const jour = r.getDate();
  r.setMonth(r.getMonth() + n);
  if (r.getDate() < jour) r.setDate(0); // 31 janvier + 1 mois → 28/29 février
  return r;
}

function aUneNote(c){ return !!(c.commentaire || '').trim(); }

/* Dates de rappel attendues pour un cours, jusqu'à l'horizon. */
function rappelsAttendus(c){
  const creation = dDe(c.date);
  const fin = finAnnee(creation);            // 1er juillet : fin du cycle scolaire
  const butoir = plusMois(creation, RAPPEL_ANNEES * 12);
  const horizon = plusMois(aujourdhui(), HORIZON_MOIS);
  const pas = aUneNote(c) ? 3 : 12;          // mois entre deux rappels

  const sortie = [];
  // Premier anniversaire strictement après la fin de l'année scolaire
  let n = 12;
  while (plusMois(creation, n) <= fin) n += 12;
  for (; ; n += pas) {
    const q = plusMois(creation, n);
    if (q > butoir || q > horizon) break;
    sortie.push(isoDe(q));
  }
  return sortie;
}

/* Aligne les rappels stockés sur ce qui est attendu : ajoute les
   manquants, retire ceux devenus caducs (cadence changée par l'ajout
   ou le retrait d'une note) — sans jamais toucher au passé ni à une
   révision déjà traitée. */
function completerRappels(){
  const ajISO = isoDe(aujourdhui());
  let change = false;
  DB.cours.forEach(c => {
    const attendus = rappelsAttendus(c);
    const existants = DB.revisions.filter(r => r.cours === c.id && r.rappel);

    attendus.forEach(iso => {
      if (!existants.some(r => r.date === iso)) {
        DB.revisions.push({
          id: c.id + '@' + iso, cours: c.id, rang: 'Rappel', ancrage: false,
          rappel: true, prevue: iso, date: iso, statut: 'aFaire'
        });
        change = true;
      }
    });

    existants.forEach(r => {
      if (r.statut === 'aFaire' && r.date > ajISO && attendus.indexOf(r.date) === -1) {
        DB.revisions = DB.revisions.filter(x => x.id !== r.id);
        change = true;
      }
    });
  });
  if (change) sauver();
  return change;
}

const MATIERES_DEFAUT = [
  {code:'ANG', nom:'Anglais',                        c:'#3A56D4'},
  {code:'MAT', nom:'Mathématiques',                  c:'#D14343'},
  {code:'HIS', nom:'Histoire',                       c:'#8B4FD6'},
  {code:'GEO', nom:'Géographie',                     c:'#00A08C'},
  {code:'FRA', nom:'Français',                       c:'#E07B00'},
  {code:'PHY', nom:'Physique Chimie',                c:'#0088A8'},
  {code:'MUS', nom:'Musique',                        c:'#C2185B'},
  {code:'ART', nom:'Arts plastiques',                c:'#6D8B00'},
  {code:'SVT', nom:'Sciences de la vie et de la Terre', c:'#2E7D32'}
];
function matiereDe(code){
  return donneesLecture().matieres.find(m => m.code === code) || {nom: code, c: '#9AA3B2'};
}

/* ============================================================
   Dates — tout se calcule sur des dates locales à midi, pour
   qu'un changement d'heure ne décale jamais une échéance.
   ============================================================ */
function dDe(iso){
  const p = iso.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0, 0);
}
function isoDe(d){
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const j = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + j;
}
function plus(d, n){
  const r = new Date(d.getTime());
  r.setDate(r.getDate() + n);
  return r;
}
function aujourdhui(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12, 0, 0, 0);
}
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS  = ['janvier','février','mars','avril','mai','juin',
               'juillet','août','septembre','octobre','novembre','décembre'];
function libelleJour(iso){
  const d = dDe(iso);
  return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] +
         (d.getFullYear() !== aujourdhui().getFullYear() ? ' ' + d.getFullYear() : '');
}
function libelleCourt(iso){
  const d = dDe(iso);
  return String(d.getDate()).padStart(2,'0') + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

/* Semaine du lundi au dimanche, quel que soit le jour de départ. */
function lundiDe(d){
  const jsem = d.getDay();
  return plus(d, jsem === 0 ? -6 : 1 - jsem);
}
function dimancheDe(d){ return plus(lundiDe(d), 6); }

/* Une révision n'est validable que si son échéance est dépassée,
   ou à sept jours au plus. Au-delà, le bouton « Faite » est verrouillé
   pour éviter une validation par anticipation excessive. */
function joursAvant(iso){ return Math.round((dDe(iso) - aujourdhui()) / 86400000); }
function estValidable(iso){ return joursAvant(iso) <= 7; }

/* Fin de l'année scolaire : le 1er juillet qui suit la date du cours. */
function finAnnee(d){
  const juillet = new Date(d.getFullYear(), 6, 1, 12, 0, 0, 0);
  return d < juillet ? juillet : new Date(d.getFullYear() + 1, 6, 1, 12, 0, 0, 0);
}

/* ============================================================
   Échéancier
   Un ancrage : le premier samedi qui suit la date du cours.
   Puis une rampe d'intervalles croissants (voir RAMPE_INTERVALLES
   ci-dessous), jusqu'au 1er juillet.
   ============================================================ */
/* La rampe donne l'écart, en jours, entre chaque révision et la
   précédente (pas depuis la date du cours) : 7, 7, 14, 14, 21, 21,
   21, puis un rythme fixe de 28 jours jusqu'à la fin de l'année. */
const RAMPE_INTERVALLES = [7, 7, 14, 14, 21, 21, 21, 28];

function echeancier(dateISO){
  const d = dDe(dateISO);
  const fin = finAnnee(d);
  const sortie = [];

  let samedi = plus(d, 1);
  while (samedi.getDay() !== 6) samedi = plus(samedi, 1);
  if (samedi <= fin) sortie.push({rang:'Ancrage', ancrage:true, date:isoDe(samedi)});

  const deltas = [];
  let cumul = 0;
  RAMPE_INTERVALLES.forEach(ecart => { cumul += ecart; deltas.push(cumul); });
  for (let x = cumul + 28; plus(d, x) <= fin; x += 28) deltas.push(x);

  deltas.forEach(x => {
    const q = plus(d, x);
    if (q > fin) return;
    const jour = isoDe(q);
    const deja = sortie.find(e => e.date === jour);
    if (deja) { deja.rang = deja.rang + ' · J+' + x; return; }
    sortie.push({rang:'J+' + x, ancrage:false, date:jour});
  });

  sortie.sort((a, b) => a.date < b.date ? -1 : 1);
  return sortie;
}

/* ============================================================
   Stockage
   ============================================================ */
const CLE = 'sabosse';
const Store = {
  dispo: true,
  lire(){
    const defaut = {cours:[], revisions:[], matieres: MATIERES_DEFAUT.slice(), suivis: [],
                    reglages:{afficherAncrage:true, prenom:'', role:'aucun', codePartage:'', affichage:'personnel', tolerance:3, derniereAnnee:''}};
    try {
      const brut = localStorage.getItem(CLE);
      if (!brut) return defaut;
      const o = JSON.parse(brut);
      const reglages = Object.assign({afficherAncrage:true, prenom:'', role:'aucun', codePartage:'', affichage:'personnel', tolerance:3, derniereAnnee:''}, o.reglages || {});
      /* L'option de masquage de l'ancrage a été retirée de l'interface :
         on force la valeur, sinon un appareil l'ayant désactivée autrefois
         resterait bloqué sans aucun moyen de la réactiver. */
      reglages.afficherAncrage = true;
      /* Le nom du chat et le prénom de l'agenda ont fusionné en un seul
         champ : si un ancien nomChat existait mais pas de prénom, on le
         récupère pour ne rien perdre. */
      if (!reglages.prenom && o.reglages && o.reglages.nomChat) reglages.prenom = o.reglages.nomChat;
      delete reglages.nomChat;

      /* Migration : DB.suivi (un seul enfant) devient DB.suivis (plusieurs).
         L'ancien reglages.codeSuivi devient le code du premier élément. */
      let suivis = Array.isArray(o.suivis) ? o.suivis : [];
      if (!suivis.length && o.suivi && o.reglages && o.reglages.codeSuivi) {
        suivis = [Object.assign({code: o.reglages.codeSuivi}, o.suivi)];
      }
      if (reglages.affichage === 'suivi' && suivis[0]) reglages.affichage = suivis[0].code;

      return {
        cours: o.cours || [],
        revisions: o.revisions || [],
        matieres: (o.matieres && o.matieres.length) ? o.matieres : MATIERES_DEFAUT.slice(),
        suivis: suivis,
        reglages: reglages
      };
    } catch (e) { this.dispo = false; return defaut; }
  },
  ecrire(db){
    try { localStorage.setItem(CLE, JSON.stringify(db)); }
    catch (e) { this.dispo = false; toast('Stockage indisponible.'); }
  }
};
let DB = Store.lire();

/* Deux jeux de données ou plus peuvent coexister sur un même appareil :
   le « personnel » (celui que l'appareil encode lui-même) et un miroir
   en lecture seule par enfant suivi (reçu par Firebase, un par code).
   reglages.affichage vaut 'personnel', ou le code de l'enfant actif.
   Les écritures ne touchent jamais un jeu affiché en mode suivi,
   puisque toute la partie édition de l'interface reste masquée par
   modeLecture() dans ce cas. */
function suiviActif(){
  if (DB.reglages.affichage === 'personnel') return null;
  return DB.suivis.find(s => s.code === DB.reglages.affichage) || null;
}

function donneesLecture(){
  const s = suiviActif();
  if (s) {
    return {
      cours: s.cours || [],
      revisions: s.revisions || [],
      matieres: (s.matieres && s.matieres.length) ? s.matieres : MATIERES_DEFAUT,
      afficherAncrage: (s.reglages && typeof s.reglages.afficherAncrage === 'boolean')
        ? s.reglages.afficherAncrage : true,
      prenom: (s.reglages && s.reglages.prenom) || ''
    };
  }
  return {
    cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres,
    afficherAncrage: DB.reglages.afficherAncrage, prenom: DB.reglages.prenom
  };
}

/* modeLecture() : l'écran affiche actuellement le miroir d'un autre
   appareil, donc rien n'est modifiable ici — toute édition se fait
   sur l'appareil source. Indépendant du rôle de synchronisation :
   un appareil « suivi » peut très bien être en train d'afficher son
   propre profil personnel, pleinement éditable, à un instant donné. */
function modeLecture(){ return DB.reglages.affichage !== 'personnel'; }

let derniereSyncEnvoi = null, echecsSyncConsecutifs = 0;

function sauver(){
  Store.ecrire(DB);
  if (!modeLecture()) enregistrerInstantane(); // jamais pour un profil suivi : ce n'est pas nos données
  if (DB.reglages.role === 'source' && DB.reglages.codePartage &&
      window.SabosseSync && window.SabosseSync.disponible) {
    window.SabosseSync.envoyer(DB.reglages.codePartage, {
      cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres,
      reglages: {afficherAncrage: DB.reglages.afficherAncrage, prenom: DB.reglages.prenom}
    }).then(ok => {
      /* Un échec d'envoi était jusque-là totalement silencieux — c'est
         très probablement ce qui a causé le bug de suivi rapporté :
         rien n'avertissait qu'une mise à jour n'était pas partie. */
      if (ok) { derniereSyncEnvoi = Date.now(); echecsSyncConsecutifs = 0; }
      else if (++echecsSyncConsecutifs === 3) {
        toast('Le partage ne se synchronise plus — vérifie ta connexion.');
      }
      if (vueActive === 'reglages') rendre();
    });
  }
}

/* ============================================================
   Instantanés locaux, pour la restauration à H-1 / H-24 / J-7.
   Un seul par heure au maximum ; au-delà de 24 h, un seul par jour ;
   rien au-delà de 7 jours — pour ne pas saturer le stockage du
   téléphone avec l'historique complet des cours et révisions.
   ============================================================ */
const CLE_INSTANTANES = 'cabosse-instantanes';

function enregistrerInstantane(){
  try {
    const maintenant = Date.now();
    let liste = JSON.parse(localStorage.getItem(CLE_INSTANTANES) || '[]');
    const dernier = liste[liste.length - 1];
    if (dernier && maintenant - dernier.quand < 3600000) return; // au plus un par heure
    liste.push({quand: maintenant, cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres});

    const limite24h = maintenant - 24 * 3600000;
    const limite7j = maintenant - 7 * 24 * 3600000;
    const recents = liste.filter(s => s.quand >= limite24h);
    const anciens = liste.filter(s => s.quand < limite24h && s.quand >= limite7j);
    const parJour = {};
    anciens.forEach(s => {
      const j = new Date(s.quand).toDateString();
      if (!parJour[j] || s.quand > parJour[j].quand) parJour[j] = s;
    });
    liste = Object.values(parJour).concat(recents).sort((a, b) => a.quand - b.quand);
    localStorage.setItem(CLE_INSTANTANES, JSON.stringify(liste));
  } catch (e) { /* ce n'est qu'une sécurité : une erreur ici ne doit rien bloquer */ }
}

function listeInstantanes(){
  try { return JSON.parse(localStorage.getItem(CLE_INSTANTANES) || '[]'); }
  catch (e) { return []; }
}

function restaurerInstantane(decalageMs){
  const liste = listeInstantanes();
  if (!liste.length) { toast('Aucun instantané disponible pour l\u2019instant.'); return; }
  const cible = Date.now() - decalageMs;
  let meilleur = liste[0];
  liste.forEach(s => { if (Math.abs(s.quand - cible) < Math.abs(meilleur.quand - cible)) meilleur = s; });
  const quand = new Date(meilleur.quand).toLocaleString('fr-FR', {
    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
  if (!confirm('Restaurer l\u2019état du ' + quand + ' ? Cela remplace tes cours et révisions actuels.')) return;
  DB.cours = meilleur.cours;
  DB.revisions = meilleur.revisions;
  DB.matieres = meilleur.matieres;
  sauver();
  rendre();
  toast('Restauré à l\u2019état du ' + quand + '.');
}

function idCours(code, num, date){ return code + '-' + num + '-' + date; }
function refCours(c){ return c.code + '-' + c.numero; }
function trouverCours(id){ return donneesLecture().cours.find(c => c.id === id); }

function ajouterCours(code, numero, dateISO, annee){
  const id = idCours(code, numero, dateISO);
  if (DB.cours.some(c => c.id === id)) return false;
  DB.cours.push({id, code, numero, date: dateISO, annee: annee || '', commentaire: ''});
  echeancier(dateISO).forEach((e, i) => {
    DB.revisions.push({
      id: id + '#' + i,
      cours: id,
      rang: e.rang,
      ancrage: e.ancrage,
      prevue: e.date,
      date: e.date,
      statut: 'aFaire'
    });
  });
  if (annee) DB.reglages.derniereAnnee = annee;
  completerRappels();
  sauver();
  return true;
}

function supprimerCours(id){
  DB.cours = DB.cours.filter(c => c.id !== id);
  DB.revisions = DB.revisions.filter(r => r.cours !== id);
  sauver();
}

/* Suppression définitive d'une seule révision de l'historique —
   distincte de « Réactiver », qui ne fait que changer son statut.
   Les statistiques, calculées à chaque rendu depuis DB.revisions,
   ignorent automatiquement ce qui a été supprimé. */
function supprimerRevision(id){
  DB.revisions = DB.revisions.filter(r => r.id !== id);
  sauver();
  rendre();
  toast('Révision supprimée définitivement.');
}

/* Verrou des Paramètres avancés : un mot de passe simple, côté

/* Icône de l'onglet Agenda : rouge s'il reste des révisions prévues
   aujourd'hui, verte avec un pouce levé si tout est fait. Reflète

/* Icône de l'onglet Agenda : rouge s'il reste des révisions prévues
   aujourd'hui, verte avec un pouce levé si tout est fait. Le libellé
   sous l'icône reprend le même calcul : « X à faire » ou « Tout est
   ok ». Reflète le profil actuellement affiché (personnel ou suivi),
   comme le reste de l'interface. */
function majIconeAgenda(){
  const el = document.getElementById('ic-agenda');

  el.classList.remove('ic-rouge', 'ic-verte');

/* L'ancrage du samedi s'affiche sous un nom plus engageant que
   « Ancrage », y compris quand il coïncide avec une échéance J+x. */
function libelleRang(rang){
  return rang.replace(/^Ancrage/, 'Nouveau !');
}

/* Une carte de révision, réutilisée pour les retards, la semaine
   en cours, la semaine prochaine et le repli « Semaines suivantes ». */
function carteRevision(r, aujourdhuiCarte){
  const c = trouverCours(r.cours);
  if (!c) return '';
  const m = matiereDe(c.code);
  const validable = estValidable(r.date);
  const boutonFaite = validable
    ? '<button class="ok" data-act="faite" data-id="' + r.id + '">J\u2019ai révisé <span class="emo">😎</span></button>'
    : '<button class="verrou" disabled>J\u2019ai révisé <span class="emo">😎</span></button>';
  const cmds = modeLecture() ? '' :
    '<div class="cmds">' + boutonFaite +
      '<button data-act="reporter" data-id="' + r.id + '">Reporter <span class="emo">😳</span></button>' +
      '<button data-act="annuler" data-id="' + r.id + '">Annuler <span class="emo">🫣</span></button>' +
    '</div>';
  const commentaire = (c.commentaire || '').trim();
  const texteNote = ech(commentaire.length > 90 ? commentaire.slice(0, 90) + '…' : commentaire);
  const attrsNote = modeLecture() ? ' style="cursor:default"' : (' data-act="note" data-id="' + c.id + '"');
  const zoneNote = commentaire
    ? '<button type="button" class="note-apercu"' + attrsNote + '><span class="emo">📝</span> ' + texteNote + '</button>'
    : (modeLecture() ? '' : '<button class="note-ajouter" data-act="note" data-id="' + c.id + '">+ Ajouter une note</button>');
  return '<article class="rev' + (aujourdhuiCarte ? ' rev-jour' : '') + '">' +
    '<div class="haut">' +
      '<i class="puce" style="background:' + m.c + '"></i>' +
      '<b class="code">' + ech(refCours(c)) + '</b>' +
      '<span class="matiere">' + ech(m.nom) + '</span>' +
      '<span class="rang' + (r.ancrage ? ' ancrage' : '') + '">' + ech(libelleRang(r.rang)) + '</span>' +
    '</div>' +
    (r.statut === 'reportee'
      ? '<div class="note">Reportée du ' + libelleCourt(r.prevue) + '</div>' : '') +
    (!validable && !modeLecture()
      ? '<div class="note" style="color:var(--texte-3)">Validable à partir du ' +
        libelleCourt(isoDe(plus(dDe(r.date), -7))) + '</div>' : '') +
    zoneNote + cmds + '</article>';
}

/* La carte du dimanche : un bilan de la semaine écoulée (lundi à
   samedi), pas une révision. Succès si plus aucune n'est en attente.
   N'apparaît que pour le dimanche de la semaine en cours : l'afficher
   aussi pour la semaine prochaine doublonnerait le même message. */

/* Interpole du rouge (0 %) au vert foncé (100 %) pour la barre
   d'avancement — mêmes teintes que les autres signaux de l'app. */
function couleurProgression(pct){
  const t = Math.max(0, Math.min(1, pct / 100));
  const depart = [209, 67, 67];   // rouge (--annulee)
  const arrivee = [11, 107, 63];  // vert foncé
  const c = depart.map((v, i) => Math.round(v + (arrivee[i] - v) * t));
  return 'rgb(' + c.join(',') + ')';
}

function carteRepos(dimancheISO){
  const dl = donneesLecture();
  const lundi = isoDe(plus(dDe(dimancheISO), -6));
  let semaine = dl.revisions.filter(r => r.date >= lundi && r.date < dimancheISO);
  if (!dl.afficherAncrage) semaine = semaine.filter(r => !r.ancrage);
  const total = semaine.length;
  const reste = semaine.filter(r => r.statut === 'aFaire' || r.statut === 'reportee').length;
  const succes = reste === 0;
  const pct = total ? Math.round((total - reste) / total * 100) : 100;

  let detail = '';
  if (!succes) {
    const prenom = (dl.prenom || '').trim();
    detail = '<div class="repos-detail">Il reste ' + reste + ' cours sur ' + total + '</div>' +
      (prenom ? '<div class="repos-detail">Courage ' + ech(prenom) + ' <span class="emo">💪</span></div>' : '');
  }

  const barre = total
    ? '<div class="repos-barre"><div class="repos-barre-remplie" style="width:' + pct +
      '%;background:' + couleurProgression(pct) + '"></div></div>' +
      '<span class="repos-pct">' + pct + '&nbsp;%</span>'
    : '';

  /* Trois scores affichés côte à côte, chacun comparé à son propre
     historique récent pour détecter un éventuel record. */
  const histoSem = historiqueScores(dl, 'semaine', 8);
  const histoMois = historiqueScores(dl, 'mois', 6);
  const histoAn = historiqueScores(dl, 'annee', 4);
  const scoreSem = histoSem[histoSem.length - 1];
  const scoreMois = histoMois[histoMois.length - 1];
  const scoreAn = histoAn[histoAn.length - 1];

  function carteScore(titre, s, record){
    return '<div class="repos-score' + (record ? ' record' : '') + '">' +
      '<span class="repos-score-titre">' + titre + '</span>' +
      '<b>' + (s.score > 0 ? '+' : '') + s.score + '</b>' +
      (record ? '<span class="repos-record">🏅 RECORD !</span>' : '') +
    '</div>';
  }
  const scores = '<div class="repos-scores">' +
    carteScore('Semaine', scoreSem, estRecord(histoSem)) +
    carteScore('Mois', scoreMois, estRecord(histoMois)) +
    carteScore('Année', scoreAn, estRecord(histoAn)) +
  '</div>';

  return '<article class="rev repos' + (succes ? ' succes' : '') + '">' +
    '<div class="repos-corps">' +
      '<span class="repos-ic">' + (succes ? '🏆' : '📚') + '</span>' +
      '<span class="repos-txt">' + (succes ? 'Repos du champion' : 'Encore un peu de boulot') + '</span>' +
      detail + barre + scores +
    '</div></article>';
}

function grouperParDate(liste){
  const g = [];
  liste.forEach(r => {
    let e = g.find(x => x.date === r.date);
    if (!e) { e = {date: r.date, items: []}; g.push(e); }
    e.items.push(r);
  });
  g.sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  return g;
}

function vueAgenda(){
  const dl = donneesLecture();
  const banniere = modeLecture()
    ? '<div class="suivi-banniere"><span class="emo">👀</span> Lecture seule · suivi d\u2019un autre appareil</div>' : '';
  if (!dl.cours.length) {
    return banniere + '<div class="vide"><div class="gros">📅</div>' +
      '<p><b>Aucune révision planifiée.</b></p>' +
      '<p>' + (modeLecture()
        ? 'Rien n\u2019a encore été encodé sur l\u2019appareil suivi.'
        : 'Ajoute un cours pour lancer son échéancier.') + '</p></div>';
  }

  const auj = aujourdhui();
  const ajISO = isoDe(auj);
  const dimActuel = isoDe(dimancheDe(auj));
  const dimSuivant = isoDe(plus(dimancheDe(auj), 7));

  const enAttente = dl.revisions.filter(r =>
    (r.statut === 'aFaire' || r.statut === 'reportee') &&
    (dl.afficherAncrage || !r.ancrage));

  const retard   = enAttente.filter(r => r.date < ajISO);
  const proches  = enAttente.filter(r => r.date >= ajISO && r.date <= dimSuivant);
  const plusTard = enAttente.filter(r => r.date > dimSuivant);

  let html = banniere;

  if (retard.length) {
    grouperParDate(retard).forEach(g => {
      html += '<section class="jour retard"><h2>En retard · ' + libelleJour(g.date) +
        '<span class="compte">' + g.items.length + '</span></h2>';
      g.items.forEach(r => html += carteRevision(r));
      html += '</section>';
    });
  }

  const grProches = grouperParDate(proches);
  if (!grProches.find(g => g.date === dimActuel)) grProches.push({date: dimActuel, items: []});
  grProches.sort((a, b) => a.date < b.date ? -1 : 1);

  grProches.forEach(g => {
    const estAujourdhui = g.date === ajISO;
    const titre = estAujourdhui ? "Aujourd'hui" : libelleJour(g.date);
    html += '<section class="jour"><h2>' + titre +
      (g.items.length ? '<span class="compte">' + g.items.length + '</span>' : '') + '</h2>';
    g.items.forEach(r => html += carteRevision(r, estAujourdhui));
    if (g.date === dimActuel) html += carteRepos(g.date);
    html += '</section>';
  });

  if (plusTard.length) {
    html += '<details class="pliable" data-cle="semaines"' + ouvert('semaines') + '>' +
      '<summary>Semaines suivantes<span class="compte">' + plusTard.length + '</span></summary>' +
      '<div class="contenu-pliable">';
    grouperParDate(plusTard).forEach(g => {
      html += '<section class="jour"><h2>' + libelleJour(g.date) +
        '<span class="compte">' + g.items.length + '</span></h2>';
      g.items.forEach(r => html += carteRevision(r));
      html += '</section>';
    });
    html += '</div></details>';
  }

  return html;
}

/* Adresse encodée dans le QR : un simple lien vers l'app, avec le
   code en fragment. Fonctionne aussi bien scanné par l'appareil
   photo natif de l'iPhone (qui ouvre Safari) que par le scanner
   intégré de Cabosse. */
function urlSuivi(code){
  return location.origin + location.pathname + '#suivre=' + encodeURIComponent(code);
}

function genererQR(texte){
  try {
    const qr = qrcode(0, 'M');
    qr.addData(texte);
    qr.make();
    return qr.createSvgTag({cellSize: 4, margin: 2});
  } catch (e) { return '<p style="font-size:11px;color:var(--texte-3)">QR indisponible.</p>'; }
}

/* Semaine du lundi au dimanche, courte : « DD/MM » pour l'axe des graphiques. */
function libelleAxe(iso){
  const d = dDe(iso);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

/* Cinq paliers, du plus favorable au moins favorable — évalués dans
   cet ordre pour que « inférieur à 30 % » prenne le dessus sur
   « inférieur à 50 % » quand les deux s'appliquent. */
function smileyTaux(pct){
  if (pct > 90) return '😍';
  if (pct >= 80) return '🙂';
  if (pct >= 50) return '😐';
  if (pct >= 30) return '🙁';
  return '🤮';
}

/* Quatre indicateurs, semaine par semaine, calés sur la date de
   révision (r.date) — celle qui compte aujourd'hui, y compris après
   un report. Fenêtre bornée à 12 semaines pour rester lisible. */
/* ============================================================
   Score de motivation — semaine / mois / année scolaire.

   Formule (choix à discuter avec l'utilisateur, voir la réponse) :
     + 1 point par nouveau cours encodé dans la période
     + (révisions validées dans la période)²
     - 1 point par cours reporté (compté sur sa date prévue d'origine)
     - (cours annulés OU encore non validés 3 jours après leur date
        prévue)²

   Tout est recalculé en direct depuis les données actuelles, jamais
   figé : une révision faite en retard peut encore améliorer le score
   d'une semaine passée si on la consulte à nouveau plus tard.
   ============================================================ */
const MALUS_RETARD_JOURS = 3; // fixe, indépendant de la tolérance réglable ailleurs

function calculerScore(dl, debutISO, finISO){
  const nouveauxCours = dl.cours.filter(c => c.date >= debutISO && c.date <= finISO).length;

  const revisionsPeriode = dl.revisions.filter(r => r.date >= debutISO && r.date <= finISO);
  const validees = revisionsPeriode.filter(r => r.statut === 'faite').length;

  const reportees = dl.revisions.filter(r =>
    r.statut === 'reportee' && r.prevue >= debutISO && r.prevue <= finISO).length;

  const ajISO = isoDe(aujourdhui());
  const malusEligibles = revisionsPeriode.filter(r => {
    if (r.statut === 'annulee') return true;
    if (r.statut === 'aFaire' || r.statut === 'reportee') {
      return Math.round((dDe(ajISO) - dDe(r.date)) / 86400000) > MALUS_RETARD_JOURS;
    }
    return false;
  }).length;

  const score = nouveauxCours + validees * validees - reportees - malusEligibles * malusEligibles;
  return {score, nouveauxCours, validees, reportees, malusEligibles};
}

function limitesSemaine(decalage){
  const debut = plus(lundiDe(aujourdhui()), -7 * decalage);
  return {debut: isoDe(debut), fin: isoDe(plus(debut, 6)), label: libelleAxe(isoDe(debut))};
}
function limitesMois(decalage){
  const auj = aujourdhui();
  const debut = new Date(auj.getFullYear(), auj.getMonth() - decalage, 1, 12, 0, 0, 0);
  const fin = new Date(debut.getFullYear(), debut.getMonth() + 1, 0, 12, 0, 0, 0);
  return {debut: isoDe(debut), fin: isoDe(fin), label: MOIS[debut.getMonth()].slice(0, 3)};
}
function limitesAnneeScolaire(decalage){
  const auj = aujourdhui();
  const sept1 = new Date(auj.getFullYear(), 8, 1, 12, 0, 0, 0);
  const debutCourante = auj >= sept1 ? sept1 : new Date(auj.getFullYear() - 1, 8, 1, 12, 0, 0, 0);
  const debut = new Date(debutCourante.getFullYear() - decalage, 8, 1, 12, 0, 0, 0);
  const fin = finAnnee(debut);
  return {debut: isoDe(debut), fin: isoDe(fin), label: debut.getFullYear() + '-' + (debut.getFullYear() + 1 - 2000)};
}
const LIMITES_PAR_UNITE = {semaine: limitesSemaine, mois: limitesMois, annee: limitesAnneeScolaire};

/* Historique des scores d'une unité de temps donnée, du plus ancien
   au plus récent — sert à la fois aux graphiques et à la détection
   de record. */
function historiqueScores(dl, unite, nbPeriodes){
  const limites = LIMITES_PAR_UNITE[unite];
  const sortie = [];
  for (let i = nbPeriodes - 1; i >= 0; i--) {
    const p = limites(i);
    sortie.push(Object.assign({}, p, calculerScore(dl, p.debut, p.fin)));
  }
  return sortie;
}

/* Record : le score de la période en cours égale-t-il ou dépasse-t-il
   tout ce qu'on peut voir dans la fenêtre affichée par les graphiques ?
   Une vraie mémoire de tous les temps demanderait de stocker chaque
   score au fil des semaines, ce que l'app ne fait pas — cette
   comparaison reste donc bornée à l'historique visible. */
function estRecord(historique){
  if (historique.length < 2) return false;
  const actuel = historique[historique.length - 1].score;
  if (actuel <= 0) return false;
  return historique.slice(0, -1).every(p => actuel > p.score);
}

function calculerSemaines(){
  const dl = donneesLecture();
  if (!dl.cours.length) return {semaines:[], nouveaux:[], revises:[], pourcentages:[], annules:[]};
  const lundiCourant = lundiDe(aujourdhui());
  const premiereISO = dl.cours.map(c => isoDe(lundiDe(dDe(c.date))))
    .reduce((a, b) => a < b ? a : b);
  let debut = dDe(premiereISO);
  const limite = plus(lundiCourant, -11 * 7);
  if (debut < limite) debut = limite;

  const semaines = [];
  for (let d = debut; d <= lundiCourant; d = plus(d, 7)) semaines.push(isoDe(d));

  const nouveaux = [], revises = [], pourcentages = [], annules = [];
  semaines.forEach(lundiISO => {
    const dimISO = isoDe(plus(dDe(lundiISO), 6));
    const nC = dl.cours.filter(c => c.date >= lundiISO && c.date <= dimISO).length;
    const revsSemaine = dl.revisions.filter(r => r.date >= lundiISO && r.date <= dimISO);
    const nRevisees = revsSemaine.filter(r => r.statut === 'faite').length;
    const nAnnulees = revsSemaine.filter(r => r.statut === 'annulee').length;
    const planifiees = revsSemaine.length;
    nouveaux.push(nC);
    revises.push(nRevisees);
    annules.push(nAnnulees);
    pourcentages.push(planifiees ? Math.round(nRevisees / planifiees * 100) : 0);
  });
  return {semaines: semaines, nouveaux: nouveaux, revises: revises,
          pourcentages: pourcentages, annules: annules};
}

/* Petit histogramme SVG autonome, sans bibliothèque : une barre par
   semaine, sa valeur au-dessus, l'étiquette de semaine en dessous. */
function graphiqueBarres(labels, valeurs, options){
  options = options || {};
  const larg = 640, haut = 132, margeHaut = 22, margeBas = 28;
  const zoneH = haut - margeHaut - margeBas;
  const n = Math.max(valeurs.length, 1);
  const pas = larg / n;
  const largBarre = Math.min(30, pas * 0.55);
  const maxVal = options.max || Math.max(1, Math.max.apply(null, valeurs));
  const couleur = options.couleur || 'var(--accent)';
  let barres = '';
  valeurs.forEach((v, i) => {
    const h = (v / maxVal) * zoneH;
    const x = i * pas + (pas - largBarre) / 2;
    const y = margeHaut + (zoneH - h);
    barres += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + largBarre.toFixed(1) +
      '" height="' + Math.max(h, 0).toFixed(1) + '" rx="3" fill="' + couleur + '"></rect>';
    if (v > 0) {
      barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) +
        '" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--mono)" fill="var(--texte-2)">' +
        v + (options.suffixe || '') + '</text>';
    }
    barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (haut - 8) +
      '" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--texte-3)">' +
      ech(labels[i]) + '</text>';
  });
  return '<svg viewBox="0 0 ' + larg + ' ' + haut + '" style="width:100%;height:auto;display:block">' +
    '<line x1="0" y1="' + (margeHaut + zoneH) + '" x2="' + larg + '" y2="' + (margeHaut + zoneH) +
    '" stroke="var(--filet)" stroke-width="1"></line>' + barres + '</svg>';
}

/* Variante pour des valeurs qui peuvent être négatives (le score peut
   descendre sous zéro) : une ligne de zéro au milieu, les barres
   montent au-dessus en vert, descendent en dessous en rouge. */
function graphiqueScores(labels, valeurs){
  const larg = 640, haut = 140, margeHaut = 20, margeBas = 26;
  const zoneH = haut - margeHaut - margeBas;
  const n = Math.max(valeurs.length, 1);
  const pas = larg / n;
  const largBarre = Math.min(30, pas * 0.55);
  const maxV = Math.max(1, Math.max.apply(null, valeurs));
  const minV = Math.min(0, Math.min.apply(null, valeurs));
  const etendue = (maxV - minV) || 1;
  const yZero = margeHaut + zoneH * (maxV / etendue);
  let barres = '';
  valeurs.forEach((v, i) => {
    const x = i * pas + (pas - largBarre) / 2;
    const yValeur = margeHaut + zoneH * (maxV - v) / etendue;
    const y = v >= 0 ? yValeur : yZero;
    const h = Math.abs(yZero - yValeur);
    const couleur = v > 0 ? 'var(--faite)' : (v < 0 ? 'var(--annulee)' : 'var(--texte-3)');
    barres += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + largBarre.toFixed(1) +
      '" height="' + h.toFixed(1) + '" rx="3" fill="' + couleur + '"></rect>';
    const yTexte = v >= 0 ? y - 6 : y + h + 13;
    barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + yTexte.toFixed(1) +
      '" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--mono)" fill="var(--texte-2)">' +
      v + '</text>';
    barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (haut - 6) +
      '" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--texte-3)">' +
      ech(labels[i]) + '</text>';
  });
  return '<svg viewBox="0 0 ' + larg + ' ' + haut + '" style="width:100%;height:auto;display:block">' +
    '<line x1="0" y1="' + yZero.toFixed(1) + '" x2="' + larg + '" y2="' + yZero.toFixed(1) +
    '" stroke="var(--filet)" stroke-width="1"></line>' + barres + '</svg>';
}

/* Notifications système : ne fonctionnent que pendant que l'app est
   ouverte (ou récemment ouverte). Sans serveur, impossible de
   réveiller le téléphone quand Cabosse est complètement fermée —
   ni pour le chat, ni pour le rappel du jour. C'est un choix
   assumé pour rester sur l'offre gratuite de Firebase. */
function etatNotifications(){
  if (!('Notification' in window)) return 'indisponible';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}

async function demanderNotifications(){
  if (!('Notification' in window)) { toast('Notifications non disponibles sur cet appareil.'); return; }
  const res = await Notification.requestPermission();
  if (res === 'granted') { toast('Notifications activées.'); verifierRappelJournalier(); rendre(); }
  else if (res === 'denied') { toast('Refusé — modifiable dans Réglages iPhone → Cabosse.'); rendre(); }
}

function notifier(titre, corps, options){
  if (etatNotifications() !== 'granted') return;
  const opts = Object.assign({body: corps, icon: 'icone-180.png'}, options || {});
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(titre, opts));
    } else {
      new Notification(titre, opts);
    }
  } catch (e) { /* silencieux : une notification manquée n'est pas bloquante */ }
}

/* Rappel du jour, au mieux : une seule fois par date calendaire, à
   l'ouverture de l'app — pas une alarme programmée, juste un coup
   d'œil si jamais on ouvre Cabosse ce jour-là. */
function verifierRappelJournalier(){
  if (etatNotifications() !== 'granted') return;
  try {
    const cle = 'cabosse-rappel-' + isoDe(aujourdhui());
    if (localStorage.getItem(cle)) return;
    localStorage.setItem(cle, '1');
    const dl = donneesLecture();
    const ajISO = isoDe(aujourdhui());
    const duJour = dl.revisions.filter(r => r.date === ajISO &&
      (r.statut === 'aFaire' || r.statut === 'reportee') && (dl.afficherAncrage || !r.ancrage));
    if (duJour.length) {
      notifier('Cabosse', duJour.length + ' révision' + (duJour.length > 1 ? 's' : '') +
        ' prévue' + (duJour.length > 1 ? 's' : '') + ' aujourd\u2019hui.', {tag: 'rappel-jour'});
    }
  } catch (e) { /* localStorage indisponible : on passe simplement */ }
}

/* Le chat utilise le même code que la synchronisation : pas de canal
   séparé à gérer. Contextuel au profil affiché — en suivant Clément,
   on discute dans le canal de Clément ; en suivant Léa, dans celui de
   Léa ; sur son propre profil, dans celui qu'on partage soi-même. */
function codeFamille(){
  const s = suiviActif();
  if (s) return s.code;
  return DB.reglages.role === 'source' ? DB.reglages.codePartage : '';
}

let messagesChat = [];

function libelleHeure(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const auj = new Date();
  const meme = d.getFullYear() === auj.getFullYear() && d.getMonth() === auj.getMonth() && d.getDate() === auj.getDate();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return meme ? (hh + ':' + mm) : (String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + hh + ':' + mm);
}

/* « il y a X » relatif — sert d'indicateur de fraîcheur pour la
   synchronisation, pour qu'un blocage redevienne visible au lieu
   d'être silencieux. */
function libelleDepuis(ts){
  if (!ts) return 'jamais';
  const ecartMin = Math.round((Date.now() - ts) / 60000);
  if (ecartMin < 1) return 'à l\u2019instant';
  if (ecartMin < 60) return 'il y a ' + ecartMin + ' min';
  const ecartH = Math.round(ecartMin / 60);
  if (ecartH < 24) return 'il y a ' + ecartH + ' h';
  return 'il y a ' + Math.round(ecartH / 24) + ' j';
}

function demarrerEcouteChat(){
  const code = codeFamille();
  if (!window.SabosseSync || !window.SabosseSync.disponible || !code) return;
  window.SabosseSync.suivreChat(code, (msgs, erreur) => {
    if (erreur) { toast('Connexion au chat interrompue.'); return; }
    if (!msgs) return;
    /* Ne notifie que les messages réellement nouveaux depuis le
       dernier instantané — jamais tout l'historique à la première
       connexion — et jamais mes propres messages. */
    const monNom = (DB.reglages.prenom || '').trim();
    const nouveaux = messagesChat.length ? msgs.filter(m => !messagesChat.some(x => x.id === m.id)) : [];
    messagesChat = msgs;
    nouveaux.forEach(m => {
      if (m.auteur !== monNom) {
        notifier(m.auteur || 'Cabosse', m.texte || '', {tag: 'chat-' + m.id});
        if (vueActive !== 'chat') { chatNonLu = true; majBadgeChat(); }
      }
    });
    if (vueActive === 'chat') rendre();
    purgerChatAncien(code);
  });
}

/* Purge les messages de plus de 30 jours, et — au cas où quelqu'un
   discuterait beaucoup — tout ce qui dépasse un volant de 150
   messages, même plus récents. N'importe quel appareil ouvrant le
   chat participe au ménage ; supprimer un message déjà supprimé ne
   pose aucun problème. */
const CHAT_AGE_MAX_MS = 30 * 24 * 3600000;
const CHAT_VOLUME_MAX = 150;

function purgerChatAncien(code){
  if (!messagesChat.length) return;
  const limiteAge = Date.now() - CHAT_AGE_MAX_MS;
  const aSupprimer = new Set(messagesChat.filter(m => m.quand < limiteAge).map(m => m.id));
  if (messagesChat.length > CHAT_VOLUME_MAX) {
    messagesChat.slice(0, messagesChat.length - CHAT_VOLUME_MAX).forEach(m => aSupprimer.add(m.id));
  }
  if (aSupprimer.size) window.SabosseSync.purgerMessages(code, Array.from(aSupprimer));
}

function vueChat(){
  if (!window.SabosseSync || !window.SabosseSync.disponible) {
    return '<div class="vide"><div class="gros">💬</div><p><b>Chat indisponible.</b></p>' +
      '<p>La configuration Firebase n\u2019est pas active sur cet appareil.</p></div>';
  }
  const code = codeFamille();
  if (!code) {
    return '<div class="vide"><div class="gros">💬</div><p><b>Chat indisponible.</b></p>' +
      '<p>Configure d\u2019abord la synchronisation, dans Statistiques → Paramètres avancés.</p></div>';
  }
  const nom = (DB.reglages.prenom || '').trim();
  const banniereNotif = (etatNotifications() === 'default')
    ? '<button type="button" class="notif-banniere" data-act="notif-activer">' +
        '<span class="emo">🔔</span> Activer le son des notifications</button>'
    : '';
  let html = banniereNotif + '<div id="chat-fil">';
  if (!messagesChat.length) {
    html += '<p class="vide-chat">Aucun message pour l\u2019instant.</p>';
  } else {
    messagesChat.forEach(m => {
      const moi = nom && m.auteur === nom;
      html += '<div class="msg' + (moi ? ' moi' : '') + '">' +
        (moi ? '' : '<b class="msg-auteur">' + ech(m.auteur || '?') + '</b>') +
        '<div class="msg-bulle">' + ech(m.texte || '') + '</div>' +
        '<span class="msg-heure">' + libelleHeure(m.quand) + '</span>' +
      '</div>';
    });
  }
  html += '</div>' +
    '<div class="chat-bas">' +
      '<button type="button" class="chat-nom" data-act="chat-nom">' +
        (nom ? ech(nom) : 'Choisir mon nom') + ' <span class="emo">✎</span></button>' +
      '<div class="chat-saisie">' +
        '<input type="text" id="chat-texte" placeholder="Message…" maxlength="300">' +
        '<button data-act="chat-envoyer">➤</button>' +
      '</div>' +
    '</div>';
  return html;
}

async function envoyerMessageChat(){
  const nom = (DB.reglages.prenom || '').trim();
  if (!nom) { ouvrirChatNom(); return; }
  const champ = document.getElementById('chat-texte');
  if (!champ) return;
  const texte = champ.value.trim();
  if (!texte) return;
  const code = codeFamille();
  if (!code) return;
  champ.value = '';
  champ.disabled = true;
  const ok = await window.SabosseSync.envoyerMessage(code, {
    texte: texte.slice(0, 300), auteur: nom, quand: Date.now()
  });
  champ.disabled = false;
  champ.focus();
  if (!ok) toast('Message non envoyé, réessaie.');
}

const chatnomVoile = document.getElementById('chatnom-voile');
function ouvrirChatNom(){
  document.getElementById('chatnom-champ').value = DB.reglages.prenom || '';
  chatnomVoile.classList.add('on');
  setTimeout(() => document.getElementById('chatnom-champ').focus(), 60);
}
function fermerChatNom(){ chatnomVoile.classList.remove('on'); }
document.getElementById('chatnom-annuler').addEventListener('click', fermerChatNom);
chatnomVoile.addEventListener('click', e => { if (e.target === chatnomVoile) fermerChatNom(); });
document.getElementById('chatnom-ok').addEventListener('click', () => {
  const val = document.getElementById('chatnom-champ').value.trim();
  if (!val) { toast('Choisis un nom.'); return; }
  DB.reglages.prenom = val;
  sauver();
  fermerChatNom();
  rendre();
});

/* --- Statistiques ------------------------------------------ */
function vueStats(){
  const dl = donneesLecture();
  if (!dl.revisions.length) {
    return '<div class="vide"><div class="gros">📊</div>' +
      '<p><b>Rien à mesurer pour l\'instant.</b></p>' +
      '<p>Les statistiques arrivent avec le premier cours.</p></div>';
  }
  const n = s => dl.revisions.filter(r => r.statut === s).length;
  const faites = n('faite'), reportees = n('reportee'),
        annulees = n('annulee'), venir = n('aFaire');

  /* Réalisation : bornée à la semaine en cours (lundi-dimanche),
     rien au-delà du dimanche. Le dénominateur compte tout ce qui est
     prévu cette semaine, fait ou non — pas seulement le traité. */
  const lundiSemaine = lundiDe(aujourdhui());
  const dimancheISO = isoDe(plus(lundiSemaine, 6));
  const lundiISO = isoDe(lundiSemaine);
  const semaineActuelle = dl.revisions.filter(r => r.date >= lundiISO && r.date <= dimancheISO);
  const planifieesSemaine = semaineActuelle.length;
  const aLheureSemaine = semaineActuelle.filter(dansLesTemps).length;
  const tauxSemaine = planifieesSemaine ? Math.round(aLheureSemaine / planifieesSemaine * 100) : 0;
  const tol = toleranceJours();

  const blocRealisation = !planifieesSemaine
    ? '<div class="carte" style="margin-bottom:20px">' +
        '<p style="margin:0;font-size:13px;color:var(--texte-2)">Aucune révision prévue cette semaine.</p></div>'
    : '<div class="carte" style="margin-bottom:20px">' +
        '<div style="display:flex;align-items:baseline;gap:10px">' +
        '<b style="font-size:30px;font-weight:800;letter-spacing:-.03em;' +
        'font-variant-numeric:tabular-nums;color:var(--faite)">' + tauxSemaine + '&nbsp;%</b>' +
        '<span style="font-size:13px;color:var(--texte-2)">des révisions prévues cette semaine ont été ' +
        'réalisées à \u00b1 ' + tol + ' jour' + (tol > 1 ? 's' : '') + ' <span class="emo">' +
        smileyTaux(tauxSemaine) + '</span></span></div></div>';

  let html =
    '<div class="tuiles">' +
      '<div class="tuile faite"><b>' + faites + '</b><span>Cours révisés <span class="emo">😎</span></span></div>' +
      '<div class="tuile reportee"><b>' + reportees + '</b><span>Cours reportés <span class="emo">😳</span></span></div>' +
      '<div class="tuile annulee"><b>' + annulees + '</b><span>Cours annulés <span class="emo">🫣</span></span></div>' +
      '<div class="tuile venir"><b>' + venir + '</b><span>À venir <span class="emo">🗓️</span></span></div>' +
    '</div>' +
    '<p class="etiquette">Réalisation</p>' + blocRealisation;

  const s7 = calculerSemaines();
  if (s7.semaines.length) {
    const labels = s7.semaines.map(libelleAxe);
    html += '<p class="etiquette">Évolution hebdomadaire</p>' +
      '<div class="carte graf"><p class="graf-titre">Nombre de nouveaux cours enregistrés</p>' +
        graphiqueBarres(labels, s7.nouveaux, {couleur: 'var(--accent)'}) + '</div>' +
      '<div class="carte graf"><p class="graf-titre">Cours révisés</p>' +
        graphiqueBarres(labels, s7.revises, {couleur: 'var(--faite)'}) + '</div>' +
      '<div class="carte graf"><p class="graf-titre">Taux de cours révisés sur le planifié</p>' +
        graphiqueBarres(labels, s7.pourcentages, {couleur: 'var(--faite)', suffixe: '%', max: 100}) + '</div>' +
      '<div class="carte graf" style="margin-bottom:20px"><p class="graf-titre">Nombre de cours annulés</p>' +
        graphiqueBarres(labels, s7.annules, {couleur: 'var(--annulee)'}) + '</div>';
  }

  const histoSemStats = historiqueScores(dl, 'semaine', 8);
  const histoMoisStats = historiqueScores(dl, 'mois', 6);
  const histoAnStats = historiqueScores(dl, 'annee', 4);
  html += '<p class="etiquette" style="margin-top:20px">Score</p>' +
    '<div class="carte graf"><p class="graf-titre">Score hebdomadaire</p>' +
      graphiqueScores(histoSemStats.map(p => p.label), histoSemStats.map(p => p.score)) + '</div>' +
    '<div class="carte graf"><p class="graf-titre">Score mensuel</p>' +
      graphiqueScores(histoMoisStats.map(p => p.label), histoMoisStats.map(p => p.score)) + '</div>' +
    '<div class="carte graf" style="margin-bottom:20px"><p class="graf-titre">Score par année scolaire</p>' +
      graphiqueScores(histoAnStats.map(p => p.label), histoAnStats.map(p => p.score)) + '</div>';

  const lignes = [];
  dl.matieres.forEach(m => {
    const ids = dl.cours.filter(c => c.code === m.code).map(c => c.id);
    if (!ids.length) return;
    const revs = dl.revisions.filter(r => ids.indexOf(r.cours) !== -1);
    lignes.push({
      m: m,
      cours: ids.length,
      faites: revs.filter(r => r.statut === 'faite').length,
      reportees: revs.filter(r => r.statut === 'reportee').length,
      annulees: revs.filter(r => r.statut === 'annulee').length
    });
  });

  /* Fiches empilées plutôt qu'un tableau : les intitulés demandés
     sont trop longs pour tenir en colonnes sur un écran de téléphone. */
  html += '<p class="etiquette">Par matière</p>';
  lignes.forEach(l => {
    html += '<div class="carte mat-stats">' +
      '<div class="mat-stats-entete"><i class="puce" style="background:' + l.m.c + '"></i>' +
      '<b>' + ech(l.m.nom) + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de cours</span><b>' + l.cours + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de révisions réalisées</span><b>' + l.faites + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de cours reportés</span><b>' + l.reportees + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de cours annulés</span><b>' + l.annulees + '</b></div>' +
    '</div>';
  });

  const notesParMatiere = [];
  dl.matieres.forEach(m => {
    const coursAvecNote = dl.cours.filter(c => c.code === m.code && (c.commentaire || '').trim());
    if (coursAvecNote.length) notesParMatiere.push({m: m, cours: coursAvecNote});
  });
  if (notesParMatiere.length) {
    html += '<p class="etiquette" style="margin-top:20px">Notes par matière</p>';
    notesParMatiere.forEach(g => {
      html += '<div class="carte mat-stats">' +
        '<div class="mat-stats-entete"><i class="puce" style="background:' + g.m.c + '"></i>' +
        '<b>' + ech(g.m.nom) + '</b></div>';
      g.cours.forEach(c => {
        html += '<div class="note-ligne"><b>' + ech(refCours(c)) + '</b>' +
          '<span>' + ech(c.commentaire.trim()) + '</span></div>';
      });
      html += '</div>';
    });
  }

  const historique = dl.revisions
    .filter(r => r.statut === 'faite' || r.statut === 'annulee')
    .sort((a, b) => a.date < b.date ? 1 : -1);
  if (historique.length) {
    const groupes = [];
    historique.forEach(r => {
      const c = trouverCours(r.cours);
      if (!c) return;
      let g = groupes.find(x => x.cours.id === c.id);
      if (!g) { g = {cours: c, items: []}; groupes.push(g); }
      g.items.push(r);
    });

    html += '<details class="pliable" data-cle="historique"' + ouvert('historique') + ' style="margin-top:20px">' +
      '<summary>Historique<span class="compte">' + historique.length + '</span></summary>' +
      '<div class="contenu-pliable">';
    groupes.forEach(g => {
      const m = matiereDe(g.cours.code);
      html += '<div class="hist-groupe"><div class="hist-entete">' +
        '<i class="puce" style="background:' + m.c + '"></i>' +
        '<span>' + ech(refCours(g.cours)) + ' · ' + ech(m.nom) + '</span>' +
        (modeLecture() ? '' :
          '<button class="hist-suppr-serie" data-act="suppr-serie-hist" data-id="' + g.cours.id + '">Supprimer la série</button>') +
        '</div><div class="carte" style="padding:5px 15px">';
      g.items.forEach(r => {
        html += '<div class="hist-l">' +
          '<div class="txt"><b>' + ech(libelleRang(r.rang)) + '</b>' +
          '<span>' + libelleCourt(r.date) + ' · ' + (r.statut === 'faite' ? 'Faite' : 'Annulée') + '</span></div>' +
          (modeLecture() ? '' :
            '<button data-act="reactiver" data-id="' + r.id + '">Réactiver</button>' +
            '<button class="sup" data-act="suppr-revision" data-id="' + r.id + '">✕</button>') +
          '</div>';
      });
      html += '</div></div>';
    });
    html += '</div></details>';
  }

  return html;
}
