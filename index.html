/* --- Impression du planning à 2 semaines -------------------- */

/* Une colonne par semaine, du lundi au dimanche, en partant du
   lundi de la semaine en cours — y compris les jours déjà passés
   cette semaine, puisqu'une révision en retard reste à cocher. */
function planningImpression(){
  const dl = donneesLecture();
  const debut = lundiDe(aujourdhui());
  const jours = [];
  for (let i = 0; i < 14; i++) jours.push(isoDe(plus(debut, i)));

  const revs = dl.revisions.filter(r =>
    (r.statut === 'aFaire' || r.statut === 'reportee') &&
    jours.indexOf(r.date) !== -1 &&
    (dl.afficherAncrage || !r.ancrage));

  function colonne(liste){
    let lignes = '';
    liste.forEach(iso => {
      const d = dDe(iso);
      const nomJour = JOURS[d.getDay()].charAt(0).toUpperCase() + JOURS[d.getDay()].slice(1);
      // Filtré avant de compter les lignes : un cours introuvable (donnée
      // orpheline) ne doit jamais fausser le rowspan de la cellule jour.
      const items = revs.filter(r => r.date === iso && trouverCours(r.cours));
      const nRangees = Math.max(items.length, 1) + 1; // + la ligne « Nouveau à encoder »
      if (!items.length) {
        lignes += '<tr><td class="pr-jour-cel" rowspan="' + nRangees + '">' + nomJour + '<br>' +
          libelleCourt(iso) + '</td><td class="pr-vide-cel" colspan="4">—</td></tr>';
      } else {
        items.forEach((r, i) => {
          const c = trouverCours(r.cours);
          const m = matiereDe(c.code);
          lignes += '<tr>' +
            (i === 0 ? '<td class="pr-jour-cel" rowspan="' + nRangees + '">' + nomJour + '<br>' +
              libelleCourt(iso) + '</td>' : '') +
            '<td class="pr-cours-cel">' + ech(refCours(c)) +
              '<span class="pr-mat">' + ech(m.nom) + '</span>' +
              '<span class="pr-rang">' + ech(libelleRang(r.rang)) + '</span></td>' +
            '<td class="pr-case-cel"><i class="pr-case"></i></td>' +
            '<td class="pr-case-cel"><i class="pr-case"></i></td>' +
            '<td class="pr-report-cel"><i class="pr-case"></i><span class="pr-ligne-date"></span></td>' +
          '</tr>';
        });
      }
      lignes += '<tr><td class="pr-nouveau-cel" colspan="4">Nouveau à encoder</td></tr>';
    });
    return '<table class="pr-table"><thead><tr>' +
      '<th>Jour</th><th>Cours</th><th>Fait</th><th>Annulé</th><th>Reporté au</th>' +
      '</tr></thead><tbody>' + lignes + '</tbody></table>';
  }

  const titre = 'Cabosse' + (modeLecture() && dl.prenom ? ' · ' + ech(dl.prenom) : '');
  return '<div class="pr-page">' +
    '<div class="pr-entete">' +
      '<img class="pr-logo" src="icone-180.png" alt="">' +
      '<div class="pr-titres">' +
        '<div class="pr-nom">' + titre + '</div>' +
        '<div class="pr-periode">Planning de révision du ' + libelleCourt(jours[0]) +
        ' au ' + libelleCourt(jours[13]) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="pr-grille">' +
      '<div class="pr-col">' + colonne(jours.slice(0, 7)) + '</div>' +
      '<div class="pr-col">' + colonne(jours.slice(7, 14)) + '</div>' +
    '</div>' +
    '<div class="pr-pied"><span>Cabosse · réactivation mémorielle</span>' +
    '<span>Imprimé le ' + libelleCourt(isoDe(aujourdhui())) + '</span></div>' +
  '</div>';
}

/* window.print() bloque le fil d'exécution jusqu'à l'ouverture de la
   feuille d'impression iOS : on repeint l'icône en sablier AVANT,
   via un double requestAnimationFrame qui garantit que le navigateur
   a réellement affiché le changement avant de se figer. */
function imprimerPlanning(){
  const btn = document.getElementById('btn-imprimer');
  document.getElementById('impression').innerHTML = planningImpression();
  btn.textContent = '⏳';
  btn.disabled = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try { window.print(); }
    finally { btn.textContent = '🖨️'; btn.disabled = false; }
  }));
}

document.getElementById('btn-imprimer').addEventListener('click', imprimerPlanning);

/* Ce téléphone devient la « source » : il génère un code (une fois)
   et pousse désormais chaque modification vers Firestore. */
function activerPartage(){
  if (!DB.reglages.codePartage) {
    DB.reglages.codePartage = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : (Math.random().toString(36).slice(2) + Date.now().toString(36));
  }
  DB.reglages.role = 'source';
  sauver();
  demarrerEcouteChat();
  rendre();
  toast('Partage activé.');
}

/* Ce téléphone devient « suivi » d'un enfant supplémentaire : lecture
   seule, alimentée par le flux temps réel de l'appareil source
   identifié par ce code. Plusieurs enfants peuvent être suivis à la
   fois, chacun avec son propre miroir et sa propre écoute. */
function ajouterSuivi(code){
  code = (code || '').trim();
  if (!code) { toast('Code manquant.'); return; }
  if (DB.suivis.some(s => s.code === code)) { toast('Cet enfant est déjà suivi.'); return; }
  if (DB.suivis.length >= 6) { toast('Trop d\u2019enfants suivis sur un même appareil.'); return; }
  DB.reglages.role = 'suivi';
  DB.suivis.push({code: code, cours: [], revisions: [], matieres: [], reglages: {}});
  DB.reglages.affichage = code; // on bascule directement dessus : c'est ce qu'on vient de demander à voir
  sauver();
  demarrerEcouteSuivi(code);
  demarrerEcouteChat();
  rendre();
  toast('Connecté au suivi.');
}

function demarrerEcouteSuivi(code){
  if (!window.SabosseSync || !window.SabosseSync.disponible || !code) return;
  window.SabosseSync.suivre(code, (donnees, erreur) => {
    if (erreur) { toast('Connexion au suivi interrompue.'); return; }
    if (!donnees) return;
    const s = DB.suivis.find(x => x.code === code);
    if (!s) return; // suivi retiré entre-temps
    /* Écrit dans le miroir séparé de cet enfant, jamais dans les
       données personnelles de cet appareil ni dans celles d'un autre
       enfant : un arrivage Firestore ne doit jamais rien écraser
       d'autre que ce qu'il concerne. */
    s.cours = donnees.cours || [];
    s.revisions = donnees.revisions || [];
    s.matieres = (donnees.matieres && donnees.matieres.length) ? donnees.matieres : MATIERES_DEFAUT.slice();
    s.reglages = donnees.reglages || {};
    s.recuLe = Date.now(); // horodatage visible, pour repérer un suivi qui ne bouge plus
    Store.ecrire(DB); // mise en cache locale pour la lecture hors-ligne, sans repousser vers Firestore
    rendre();
  });
}

/* Relance toutes les écoutes suivi enregistrées — au démarrage de
   l'app, ou après un retour de connexion. */
function demarrerToutesLesEcoutesSuivi(){
  DB.suivis.forEach(s => demarrerEcouteSuivi(s.code));
}

/* --- Scan de QR code -----------------------------------------
   jsQR décode une image, pas un flux vidéo : on capture une image de
   la caméra sur un <canvas> à chaque frame et on la lui soumet. Pas
   besoin de l'API native de détection, absente de Safari iOS. */
let scanFlux = null, scanBoucle = null;

function extraireCode(texte){
  const m = /[?#&]suivre=([^&]+)/.exec(texte || '');
  return m ? decodeURIComponent(m[1]) : (texte || '').trim();
}

async function ouvrirScanner(){
  const voile = document.getElementById('scan-voile');
  const statut = document.getElementById('scan-statut');
  const video = document.getElementById('scan-video');
  if (!('jsQR' in window)) { toast('Lecteur de QR indisponible hors ligne.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Caméra indisponible sur cet appareil.'); return;
  }
  voile.classList.add('on');
  statut.textContent = 'Vise le QR code affiché sur l\u2019autre téléphone.';
  try {
    scanFlux = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
    video.srcObject = scanFlux;
    await video.play();
    const canevas = document.createElement('canvas');
    const ctx = canevas.getContext('2d', {willReadFrequently: true});
    const tick = () => {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canevas.width = video.videoWidth; canevas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canevas.width, canevas.height);
        const image = ctx.getImageData(0, 0, canevas.width, canevas.height);
        const resultat = jsQR(image.data, image.width, image.height);
        if (resultat && resultat.data) { traiterCodeScanne(resultat.data); return; }
      }
      scanBoucle = requestAnimationFrame(tick);
    };
    scanBoucle = requestAnimationFrame(tick);
  } catch (e) {
    statut.textContent = 'Caméra refusée ou indisponible — utilise le code à coller.';
  }
}

function traiterCodeScanne(texte){
  fermerScanner();
  const code = extraireCode(texte);
  if (!code) { toast('QR code illisible.'); return; }
  ajouterSuivi(code);
}

function fermerScanner(){
  document.getElementById('scan-voile').classList.remove('on');
  if (scanBoucle) cancelAnimationFrame(scanBoucle);
  scanBoucle = null;
  if (scanFlux) { scanFlux.getTracks().forEach(t => t.stop()); scanFlux = null; }
}

document.getElementById('scan-fermer').addEventListener('click', fermerScanner);

/* Un QR scanné par l'appareil photo natif de l'iPhone (plutôt que
   par le scanner intégré) ouvre Safari sur ce lien : on y réagit de
   la même façon, une fois l'app chargée. */
function traiterLienSuivi(){
  const m = /suivre=([^&]+)/.exec(location.hash);
  if (!m) return;
  const code = decodeURIComponent(m[1]);
  history.replaceState(null, '', location.pathname + location.search);
  if (DB.suivis.some(s => s.code === code)) return;
  if (confirm('Suivre cet enfant avec le code reçu ?')) ajouterSuivi(code);
}

function retirerSuivi(code){
  if (window.SabosseSync) window.SabosseSync.arreter(code);
  DB.suivis = DB.suivis.filter(s => s.code !== code);
  if (DB.reglages.affichage === code) DB.reglages.affichage = 'personnel';
  if (!DB.suivis.length && DB.reglages.role === 'suivi') DB.reglages.role = 'aucun';
  messagesChat = [];
  sauver();
  demarrerEcouteChat();
  rendre();
  toast('Suivi retiré.');
}

/* Vide le cache du service worker puis recharge : utile quand
   l'app affiche encore une version périmée sur l'écran d'accueil. */
async function forcerMiseAJour(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
    }
    if ('caches' in window) {
      const cles = await caches.keys();
      for (const c of cles) await caches.delete(c);
    }
  } catch (e) { /* on recharge quand même */ }
  location.reload();
}

function exporterSauvegarde(){
  try {
    const blob = new Blob([JSON.stringify(DB)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'cabosse-' + isoDe(aujourdhui()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Sauvegarde exportée.');
  } catch (e) { toast('Export impossible.'); }
}

function importerSauvegarde(fichier){
  const lecteur = new FileReader();
  lecteur.onload = () => {
    let o;
    try { o = JSON.parse(lecteur.result); }
    catch (e) { toast('Fichier illisible.'); return; }
    if (!o || !Array.isArray(o.cours) || !Array.isArray(o.revisions)) {
      toast('Fichier invalide.'); return;
    }
    if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
    let suivis = Array.isArray(o.suivis) ? o.suivis : [];
    if (!suivis.length && o.suivi && o.reglages && o.reglages.codeSuivi) {
      suivis = [Object.assign({code: o.reglages.codeSuivi}, o.suivi)];
    }
    DB = {
      cours: o.cours,
      revisions: o.revisions,
      matieres: (o.matieres && o.matieres.length) ? o.matieres : MATIERES_DEFAUT.slice(),
      suivis: suivis,
      reglages: Object.assign({afficherAncrage: true, prenom: '', role: 'aucun', codePartage: '', affichage: 'personnel', tolerance: 3, derniereAnnee: ''}, o.reglages || {})
    };
    if (DB.reglages.affichage === 'suivi' && suivis[0]) DB.reglages.affichage = suivis[0].code;
    sauver();
    demarrerToutesLesEcoutesSuivi();
    demarrerEcouteChat();
    rendre();
    toast('Sauvegarde restaurée.');
  };
  lecteur.readAsText(fichier);
}

function marquer(id, statut){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  r.statut = statut;
  /* Date réelle du clic, distincte de la date prévue : c'est elle qui
     permet de savoir si la révision a été faite dans les temps. */
  if (statut === 'faite') r.faitLe = isoDe(aujourdhui());
  sauver();
  rendre();
  toast(statut === 'faite' ? 'Révision faite.' : 'Révision annulée.');
}

/* Une révision compte « dans les temps » si l'écart entre le jour du
   clic et la date prévue tient dans la tolérance réglée (± N jours).
   Les révisions cochées avant l'introduction de faitLe n'ont pas cette
   date : elles sont comptées comme dans les temps, pour ne pas
   dégrader rétroactivement l'historique. */
function dansLesTemps(r){
  if (r.statut !== 'faite') return false;
  if (!r.faitLe) return true;
  const tol = toleranceJours();
  const ecart = Math.abs(Math.round((dDe(r.faitLe) - dDe(r.date)) / 86400000));
  return ecart <= tol;
}

function toleranceJours(){
  const t = parseInt(DB.reglages.tolerance, 10);
  return (isNaN(t) || t < 0) ? 3 : t;
}

/* Annule toute la série encore en attente d'un cours (aFaire ou
   reportée) — les révisions déjà faites ne sont jamais touchées. */
/* Annule toute la série encore en attente d'un cours (aFaire ou
   reportée) — les révisions déjà faites ne sont jamais touchées.
   Accepte indifféremment l'id d'une révision de ce cours (Agenda,
   historique) ou l'id du cours lui-même (Paramètres avancés). */
function annulerSerie(id){
  const r = DB.revisions.find(x => x.id === id);
  const coursId = r ? r.cours : id;
  const n = DB.revisions.filter(x =>
    x.cours === coursId && (x.statut === 'aFaire' || x.statut === 'reportee')).length;
  DB.revisions.forEach(x => {
    if (x.cours === coursId && (x.statut === 'aFaire' || x.statut === 'reportee')) x.statut = 'annulee';
  });
  sauver();
  rendre();
  toast(n + ' révision' + (n > 1 ? 's' : '') + ' annulée' + (n > 1 ? 's' : '') + '.');
}

/* Gestion des matières : le code identifie les cours existants et
   n'est donc modifiable qu'à la création, jamais en édition. */
function ajouterMatiere(code, nom, couleur){
  code = code.toUpperCase().trim();
  nom = nom.trim();
  if (!code || !nom) { toast('Code et nom requis.'); return; }
  if (DB.matieres.some(m => m.code === code)) { toast('Ce code existe déjà.'); return; }
  DB.matieres.push({code: code, nom: nom, c: couleur});
  sauver();
  rendre();
  toast(code + ' ajoutée.');
}

function modifierMatiere(code, nom, couleur){
  const m = DB.matieres.find(x => x.code === code);
  if (!m) return;
  nom = nom.trim();
  if (!nom) { toast('Le nom ne peut pas être vide.'); return; }
  const idsCours = DB.cours.filter(c => c.code === code).map(c => c.id);
  const nbRevisions = DB.revisions.filter(r => idsCours.indexOf(r.cours) !== -1).length;
  if (nbRevisions > 0 && !confirm('ATTENTION : vous allez modifier ' + nbRevisions +
      ' révision' + (nbRevisions > 1 ? 's' : '') + ', confirmez-vous ?')) return;
  m.nom = nom;
  m.c = couleur;
  matiereEnEdition = null;
  sauver();
  rendre();
  toast('Matière modifiée.');
}

function supprimerMatiere(code){
  const nb = DB.cours.filter(c => c.code === code).length;
  const msg = nb
    ? 'Supprimer ' + code + ' ? ' + nb + ' cours l\u2019utilisent encore et garderont ce code.'
    : 'Supprimer la matière ' + code + ' ?';
  if (!confirm(msg)) return;
  DB.matieres = DB.matieres.filter(m => m.code !== code);
  sauver();
  rendre();
  toast('Matière supprimée.');
}

let reportEnCours = null;
const voile = document.getElementById('voile');

function ouvrirReport(id){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  const c = trouverCours(r.cours);
  reportEnCours = id;
  document.getElementById('voile-info').textContent =

function fermerReport(){ voile.classList.remove('on'); reportEnCours = null; }

document.getElementById('voile-annuler').addEventListener('click', fermerReport);
voile.addEventListener('click', e => { if (e.target === voile) fermerReport(); });
document.getElementById('voile-ok').addEventListener('click', () => {

  if (!d || !reportEnCours) return;

/* Note de difficulté, rattachée au cours (pas à une révision précise) :
   modifiable depuis n'importe quelle révision de ce cours, passée ou
   à venir, puisqu'elle porte sur la matière elle-même. */
let noteEnCours = null;
const noteVoile = document.getElementById('note-voile');

function ouvrirNote(coursId){
  const c = trouverCours(coursId);
  if (!c) return;
  noteEnCours = coursId;
  document.getElementById('note-info').textContent = refCours(c) + ' · ' + matiereDe(c.code).nom;
  document.getElementById('note-texte').value = c.commentaire || '';
  noteVoile.classList.add('on');
}
function fermerNote(){ noteVoile.classList.remove('on'); noteEnCours = null; }

document.getElementById('note-annuler').addEventListener('click', fermerNote);
noteVoile.addEventListener('click', e => { if (e.target === noteVoile) fermerNote(); });
document.getElementById('note-ok').addEventListener('click', () => {
  if (!noteEnCours) return;
  const c = trouverCours(noteEnCours);
  if (c) {
    c.commentaire = document.getElementById('note-texte').value.trim();
    completerRappels(); // la note change la cadence des rappels : annuelle ↔ trimestrielle
    sauver(); rendre(); toast('Note enregistrée.');
  }
  fermerNote();
});

/* Confirmation, requise avant de marquer une révision faite ou
   annulée. Pour une annulation, deux issues possibles : cette seule
   révision, ou toute la série encore en attente pour ce cours. */
let actionEnCours = null;
const confirmVoile = document.getElementById('confirm-voile');

function demanderConfirmation(id, statut){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  const c = trouverCours(r.cours);
  actionEnCours = {id: id};
  const actions = document.getElementById('confirm-actions');
  const zoneNote = document.getElementById('confirm-note-zone');
  if (statut === 'faite') {
    document.getElementById('confirm-titre').textContent = 'Marquer comme faite ?';
    zoneNote.style.display = '';
    document.getElementById('confirm-note').value = (c && c.commentaire) || '';
    actions.innerHTML = '<button class="bouton principal" data-confirm="faite">Confirmer</button>';
  } else {
    document.getElementById('confirm-titre').textContent = 'Annuler cette révision ?';
    zoneNote.style.display = 'none';
    /* Annuler toute la série reste possible, mais uniquement depuis
       les Paramètres avancés (protégés par mot de passe) : ici, on ne
       propose que la révision seule, pour éviter un geste accidentel. */
    actions.innerHTML = '<button class="bouton principal" style="background:var(--annulee);box-shadow:none" ' +
      'data-confirm="annulee-une">Confirmer</button>';
  }
  document.getElementById('confirm-info').textContent =
    (c ? refCours(c) + ' · ' : '') + libelleRang(r.rang) + ' · ' + libelleJour(r.date);
  confirmVoile.classList.add('on');
}
function fermerConfirmation(){ confirmVoile.classList.remove('on'); actionEnCours = null; }

document.getElementById('confirm-non').addEventListener('click', fermerConfirmation);
confirmVoile.addEventListener('click', e => {
  if (e.target === confirmVoile) { fermerConfirmation(); return; }
  const b = e.target.closest('button[data-confirm]');
  if (!b || !actionEnCours) return;
  const type = b.dataset.confirm;
  if (type === 'faite') {
    const r = DB.revisions.find(x => x.id === actionEnCours.id);
    const c = r && trouverCours(r.cours);
    if (c) { c.commentaire = document.getElementById('confirm-note').value.trim(); completerRappels(); }
    marquer(actionEnCours.id, 'faite');
  }
  else if (type === 'annulee-une')   marquer(actionEnCours.id, 'annulee');
  fermerConfirmation();
});

vue.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'faite')         demanderConfirmation(id, 'faite');
  else if (act === 'annuler')  demanderConfirmation(id, 'annulee');
  else if (act === 'reporter') ouvrirReport(id);
  else if (act === 'note') { if (!modeLecture()) ouvrirNote(id); }
  else if (act === 'reactiver') {
    const r = DB.revisions.find(x => x.id === id);
    if (r) { r.statut = 'aFaire'; sauver(); rendre(); toast('Révision remise en attente.'); }
  }
  else if (act === 'suppr-revision') {
    if (confirm('Supprimer définitivement cette révision ? Cette action est irréversible.')) supprimerRevision(id);
  }
  else if (act === 'suppr-serie-hist') {
    const c = trouverCours(id);
    if (c && confirm('Supprimer définitivement toute la série ' + refCours(c) +
        ' (y compris les révisions encore à venir) ? Cette action est irréversible.')) {
      supprimerCours(id); rendre(); toast('Série ' + refCours(c) + ' supprimée.');
    }
  }
  else if (act === 'export') exporterSauvegarde();
  else if (act === 'importDeclencheur') {
    const f = document.getElementById('fichier-import');
    if (f) f.click();
  }
  else if (act === 'maj') {
    if (confirm('Forcer la mise à jour ? L\'application va se recharger.')) forcerMiseAJour();
  }
  else if (act === 'parametres-deverrouiller') ouvrirMotDePasse();
  else if (act === 'chat-nom') ouvrirChatNom();
  else if (act === 'chat-envoyer') envoyerMessageChat();
  else if (act === 'notif-activer') demanderNotifications();
  else if (act === 'sync-source') {
    if (confirm('Faire de ce téléphone la source qui encode et partage les cours ?')) activerPartage();
  }
  else if (act === 'sync-suivre') {
    const champ = document.getElementById('sync-code-entree');
    ajouterSuivi(champ ? champ.value : '');
  }
  else if (act === 'sync-scanner') ouvrirScanner();
  else if (act === 'sync-copier') {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DB.reglages.codePartage)
        .then(() => toast('Code copié.'))
        .catch(() => toast('Copie impossible : sélectionne le texte manuellement.'));
    } else {
      toast('Copie indisponible : sélectionne le texte manuellement.');
    }
  }
  else if (act === 'sync-actualiser') {
    if (DB.reglages.role === 'source') sauver();
    else demarrerToutesLesEcoutesSuivi();
    demarrerEcouteChat();
    toast('Actualisation demandée.');
  }
  else if (act === 'sync-desactiver') {
    if (confirm('Désactiver le partage sur cet appareil ?')) {
      if (window.SabosseSync) { window.SabosseSync.arreter(); window.SabosseSync.arreterChat(); }
      DB.reglages.role = 'aucun';
      DB.reglages.affichage = 'personnel';
      messagesChat = [];
      sauver();
      rendre();
      toast('Partage désactivé.');
    }
  }
  else if (act === 'sync-retirer') {
    const s = DB.suivis.find(x => x.code === id);
    const nom = (s && s.reglages && s.reglages.prenom) || 'cet enfant';
    if (confirm('Ne plus suivre ' + nom + ' ?')) retirerSuivi(id);
  }
  else if (act === 'restaurer-1h') restaurerInstantane(3600000);
  else if (act === 'restaurer-24h') restaurerInstantane(24 * 3600000);
  else if (act === 'restaurer-7j') restaurerInstantane(7 * 24 * 3600000);
  else if (act === 'matiere-editer') { matiereEnEdition = id; rendre(); }
  else if (act === 'matiere-annuler-edition') { matiereEnEdition = null; rendre(); }
  else if (act === 'matiere-enregistrer') {
    const nom = document.getElementById('me-nom').value;
    const couleur = document.getElementById('me-couleur').value;
    modifierMatiere(id, nom, couleur);
  }
  else if (act === 'matiere-suppr') supprimerMatiere(id);
  else if (act === 'matiere-ajouter') {
    const code = document.getElementById('nm-code').value;
    const nom = document.getElementById('nm-nom').value;
    const couleur = document.getElementById('nm-couleur').value;
    ajouterMatiere(code, nom, couleur);
  }
  else if (act === 'cours-annuler-serie') {
    const c = trouverCours(id);
    if (c && confirm('Annuler toute la série ' + refCours(c) + ' encore en attente ? ' +
        'Réversible depuis l\u2019historique.')) {
      annulerSerie(id);
    }
  }
  else if (act === 'suppr') {
    const c = trouverCours(id);
    if (c && confirm('Supprimer ' + refCours(c) + ' et toutes ses révisions ?')) {
      supprimerCours(id); rendre(); toast('Cours supprimé.');
    }
  }
});

vue.addEventListener('input', e => {
  if (e.target.id === 'f-date') majApercu();
  if (e.target.id === 'f-num') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
});

vue.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'chat-texte' && e.key === 'Enter') {
    e.preventDefault();
    envoyerMessageChat();
  }
});

vue.addEventListener('change', e => {
  if (e.target.id === 'f-prenom') {
    DB.reglages.prenom = e.target.value;
    sauver();
    return;
  }
  if (e.target.id === 'f-tolerance') {
    const v = parseInt(e.target.value, 10);
    DB.reglages.tolerance = (isNaN(v) || v < 0) ? 3 : Math.min(v, 30);
    sauver();
    rendre();
    return;
  }
  if (e.target.id === 'fichier-import' && e.target.files && e.target.files[0]) {
    importerSauvegarde(e.target.files[0]);
    e.target.value = '';
  }
});

vue.addEventListener('click', e => {
  if (e.target.id !== 'f-ok') return;
  const annee = document.getElementById('f-annee').value;
  const code = document.getElementById('f-mat').value;
  let num = document.getElementById('f-num').value.replace(/\D/g, '');
  const date = document.getElementById('f-date').value;
  if (!annee) { toast('Choisis une année scolaire.'); return; }
  if (!code) { toast('Choisis une matière.'); return; }
  if (!num)  { toast('Indique le numéro du cours.'); return; }
  if (!date) { toast('Indique la date du cours.'); return; }
  num = num.padStart(3, '0');
  if (!ajouterCours(code, num, date, annee)) { toast('Ce cours est déjà enregistré.'); return; }
  vueActive = 'agenda';
  rendre();
  toast(code + '-' + num + ' planifié.');
});

document.getElementById('barre').addEventListener('click', e => {
  const b = e.target.closest('button[data-vue]');
  if (!b) return;
  vueActive = b.dataset.vue;
  rendre();
});

document.getElementById('bascule-profil').addEventListener('click', e => {
  const b = e.target.closest('button[data-act="profil"]');
  if (!b) return;
  if (b.dataset.code === DB.reglages.affichage) return;
  DB.reglages.affichage = b.dataset.code;
  sauver();
  messagesChat = []; // le chat change de canal avec le profil affiché
  demarrerEcouteChat();
  rendre();
});

completerRappels(); // étend l'horizon des rappels à long terme
rendre();
verifierRappelJournalier();

/* Le module de synchronisation se charge après ce script (il est
   différé) : on attend son signal avant de démarrer l'écoute ou de
   pousser l'état actuel, plutôt que de dépendre de l'ordre de chargement. */
window.addEventListener('sabosse-sync-pret', () => {
  if (DB.reglages.role === 'suivi') demarrerToutesLesEcoutesSuivi();
  else if (DB.reglages.role === 'source' && DB.reglages.codePartage) {
    window.SabosseSync.envoyer(DB.reglages.codePartage, {
      cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres,
      reglages: {afficherAncrage: DB.reglages.afficherAncrage, prenom: DB.reglages.prenom}
    });
  }
  demarrerEcouteChat();
  traiterLienSuivi(); // un QR scanné par l'appareil photo natif arrive ici via location.hash
  rendre(); // met à jour le bloc Synchronisation si Paramètres avancés est ouvert
});

/* Retour de connexion : si la dernière action a poussé dans le vide
   (téléphone hors réseau), on rattrape avec l'état complet actuel
   plutôt que d'attendre la prochaine action de l'utilisateur. */
window.addEventListener('online', () => {
  if (DB.reglages.role === 'source') sauver();
  else if (DB.reglages.role === 'suivi') demarrerToutesLesEcoutesSuivi();
  demarrerEcouteChat();
});

/* Bug rapporté : l'affichage ne reflétait pas les changements distants
   après une mise en arrière-plan prolongée. Sur iOS, l'app peut être
   suspendue pendant que l'écran est verrouillé ou qu'on change d'app,
   ce qui peut figer la connexion temps réel à Firestore sans qu'elle
   ne se relance seule au retour. On force une re-souscription complète
   chaque fois que l'app redevient visible, plutôt que de dépendre
   uniquement de la reconnexion interne du SDK. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (DB.reglages.role === 'source') sauver();
  else if (DB.reglages.role === 'suivi') demarrerToutesLesEcoutesSuivi();
  demarrerEcouteChat();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
