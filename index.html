/* Adresse encodée dans le QR : un simple lien vers l'app, avec le
   code en fragment. Fonctionne aussi bien scanné par l'appareil
   photo natif de l'iPhone (qui ouvre Safari) que par le scanner
   intégré de Cabosse. */
function urlSuivi(code){
  return location.origin + location.pathname + '#suivre=' + encodeURIComponent(code);
}

function genererQR(texte){
  try {
    const qr = qrcode(0, 'M');
    qr.addData(texte);
    qr.make();
    return qr.createSvgTag({cellSize: 4, margin: 2});
  } catch (e) { return '<p style="font-size:11px;color:var(--texte-3)">QR indisponible.</p>'; }
}

/* Semaine du lundi au dimanche, courte : « DD/MM » pour l'axe des graphiques. */
function libelleAxe(iso){
  const d = dDe(iso);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

/* Cinq paliers, du plus favorable au moins favorable — évalués dans
   cet ordre pour que « inférieur à 30 % » prenne le dessus sur
   « inférieur à 50 % » quand les deux s'appliquent. */
function smileyTaux(pct){
  if (pct > 90) return '😍';
  if (pct >= 80) return '🙂';
  if (pct >= 50) return '😐';
  if (pct >= 30) return '🙁';
  return '🤮';
}

/* Quatre indicateurs, semaine par semaine, calés sur la date de
   révision (r.date) — celle qui compte aujourd'hui, y compris après
   un report. Fenêtre bornée à 12 semaines pour rester lisible. */
/* ============================================================
   Score de motivation — semaine / mois / année scolaire.

   Formule (choix à discuter avec l'utilisateur, voir la réponse) :
     + 1 point par nouveau cours encodé dans la période
     + (révisions validées dans la période)²
     - 1 point par cours reporté (compté sur sa date prévue d'origine)
     - (cours annulés OU encore non validés 3 jours après leur date
        prévue)²

   Tout est recalculé en direct depuis les données actuelles, jamais
   figé : une révision faite en retard peut encore améliorer le score
   d'une semaine passée si on la consulte à nouveau plus tard.
   ============================================================ */
const MALUS_RETARD_JOURS = 3; // fixe, indépendant de la tolérance réglable ailleurs

function calculerScore(dl, debutISO, finISO){
  const nouveauxCours = dl.cours.filter(c => c.date >= debutISO && c.date <= finISO).length;

  const revisionsPeriode = dl.revisions.filter(r => r.date >= debutISO && r.date <= finISO);
  const validees = revisionsPeriode.filter(r => r.statut === 'faite').length;

  const reportees = dl.revisions.filter(r =>
    r.statut === 'reportee' && r.prevue >= debutISO && r.prevue <= finISO).length;

  const ajISO = isoDe(aujourdhui());
  const malusEligibles = revisionsPeriode.filter(r => {
    if (r.statut === 'annulee') return true;
    if (r.statut === 'aFaire' || r.statut === 'reportee') {
      return Math.round((dDe(ajISO) - dDe(r.date)) / 86400000) > MALUS_RETARD_JOURS;
    }
    return false;
  }).length;

  const score = nouveauxCours + validees * validees - reportees - malusEligibles * malusEligibles;
  return {score, nouveauxCours, validees, reportees, malusEligibles};
}

/* ============================================================
   Score des tâches bonus — compteur séparé de celui des révisions.
     + 1 point si la tâche est réalisée le jour prévu
     - 1 point si elle ne l'est pas (annulée, ou passée sans être faite)
   Une tâche soumise à contrôle parental ne rapporte son point qu'une
   fois la coche « Contrôle fait » validée par un parent.
   ============================================================ */
function scoreTaches(dl, debutISO, finISO){
  const ajISO = isoDe(aujourdhui());
  let gagnes = 0, perdus = 0;
  dl.occurrences.forEach(o => {
    if (o.date < debutISO || o.date > finISO) return;
    const t = (dl.taches || []).find(x => x.id === o.tache);
    if (!t) return;
    if (o.statut === 'faite') {
      const aLHeure = o.date === o.prevue;
      const validee = !t.controleParent || o.controleFait;
      if (aLHeure && validee) gagnes++;
      else if (!aLHeure) perdus++;
      return;
    }
    if (o.statut === 'annulee') { perdus++; return; }
    /* Encore à faire alors que la date est passée : point perdu. */
    if (o.date < ajISO) perdus++;
  });
  return {score: gagnes - perdus, gagnes: gagnes, perdus: perdus};
}

/* Semaine de tâches : lundi → samedi, le samedi clôturant la semaine
   comme demandé (le dimanche reste la carte « repos »). */
function semaineTaches(decalage){
  const lundi = plus(lundiDe(aujourdhui()), -7 * (decalage || 0));
  return {debut: isoDe(lundi), fin: isoDe(plus(lundi, 5)), cle: isoDe(lundi)};
}

/* Une semaine de tâches est-elle « débloquée » ?
   Le solde de tâches n'est encaissé que si le programme de révisions
   de la semaine a bien été mené à son terme : plus aucune révision
   du lundi au samedi ne reste en attente. C'est le geste de cocher la
   dernière révision du samedi qui fait basculer la cagnotte — les
   tâches bonus récompensent une semaine de révisions tenue, pas le
   simple écoulement du temps.
   Une semaine sans aucune révision programmée est considérée comme
   tenue d'office : sinon ses points bonus seraient perdus sans qu'il
   y ait eu quoi que ce soit à réviser. */
function semaineDebloquee(dl, debutISO, finISO){
  const revs = dl.revisions.filter(r => r.date >= debutISO && r.date <= finISO &&
    (dl.afficherAncrage || !r.ancrage));
  if (!revs.length) return true;
  return !revs.some(r => r.statut === 'aFaire' || r.statut === 'reportee');
}

/* Encaissement : dès qu'une semaine close a vu son programme de
   révisions bouclé, son solde de points bascule une fois pour toutes
   dans la cagnotte, qui alimentera le singe Cabosse. Idempotent : une
   semaine déjà encaissée n'est jamais recomptée. Rattrapage possible :
   une semaine terminée en retard est encaissée au moment où la
   dernière révision manquante est enfin cochée. */
function encaisserSemaines(){
  if (modeLecture()) return false;
  const ajISO = isoDe(aujourdhui());
  const dl = donneesLecture();
  let change = false, gagnees = 0;
  for (let i = 0; i <= 12; i++) {
    const s = semaineTaches(i);
    /* Le samedi lui-même compte : cocher la dernière révision ce
       jour-là doit verser la cagnotte immédiatement, sans attendre
       le lendemain. */
    if (s.fin > ajISO) continue;
    if (DB.reglages.semainesEncaissees[s.cle] !== undefined) continue;
    if (!semaineDebloquee(dl, s.debut, s.fin)) continue; // programme non tenu : rien n'est versé
    const pts = scoreTaches(dl, s.debut, s.fin).score;
    DB.reglages.semainesEncaissees[s.cle] = pts;
    DB.reglages.cagnotte = (DB.reglages.cagnotte || 0) + pts;
    gagnees += pts;
    change = true;
  }
  if (change) {
    sauver();
    if (gagnees > 0) toast('Semaine bouclée ! ' + gagnees + ' point' +
      (gagnees > 1 ? 's' : '') + ' versé' + (gagnees > 1 ? 's' : '') + ' à la cagnotte 🐒');
  }
  return change;
}

/* ============================================================
   Minuteur d'une tâche
   ============================================================ */
let minuteurActif = null;

function formatChrono(s){
  const neg = s < 0;
  const abs = Math.abs(s);
  const m = Math.floor(abs / 60), r = abs % 60;
  return (neg ? '+' : '') + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function lancerMinuteur(idOcc){
  const o = DB.occurrences.find(x => x.id === idOcc);
  if (!o) return;
  const t = trouverTache(o.tache);
  if (!t) return;
  arreterMinuteur(false);
  minuteurActif = {
    occurrence: idOcc,
    restant: Math.max(1, parseInt(t.duree, 10) || 1) * 60,
    tick: null
  };
  minuteurActif.tick = setInterval(() => {
    minuteurActif.restant--;
    const el = document.getElementById('minuteur-affichage');
    if (el) {
      el.textContent = formatChrono(minuteurActif.restant);
      el.classList.toggle('fini', minuteurActif.restant <= 0);
    }
    if (minuteurActif.restant === 0) {
      notifier('Cabosse', 'Tâche terminée : ' + t.intitule, {tag: 'tache-' + idOcc});
      toast('Temps écoulé — ' + t.intitule);
    }
  }, 1000);
  rendre();
}

function arreterMinuteur(rafraichir){
  if (minuteurActif && minuteurActif.tick) clearInterval(minuteurActif.tick);
  minuteurActif = null;
  if (rafraichir !== false) rendre();
}

function limitesSemaine(decalage){
  const debut = plus(lundiDe(aujourdhui()), -7 * decalage);
  return {debut: isoDe(debut), fin: isoDe(plus(debut, 6)), label: libelleAxe(isoDe(debut))};
}
function limitesMois(decalage){
  const auj = aujourdhui();
  const debut = new Date(auj.getFullYear(), auj.getMonth() - decalage, 1, 12, 0, 0, 0);
  const fin = new Date(debut.getFullYear(), debut.getMonth() + 1, 0, 12, 0, 0, 0);
  return {debut: isoDe(debut), fin: isoDe(fin), label: MOIS[debut.getMonth()].slice(0, 3)};
}
function limitesAnneeScolaire(decalage){
  const auj = aujourdhui();
  const sept1 = new Date(auj.getFullYear(), 8, 1, 12, 0, 0, 0);
  const debutCourante = auj >= sept1 ? sept1 : new Date(auj.getFullYear() - 1, 8, 1, 12, 0, 0, 0);
  const debut = new Date(debutCourante.getFullYear() - decalage, 8, 1, 12, 0, 0, 0);
  const fin = finAnnee(debut);
  return {debut: isoDe(debut), fin: isoDe(fin), label: debut.getFullYear() + '-' + (debut.getFullYear() + 1 - 2000)};
}
const LIMITES_PAR_UNITE = {semaine: limitesSemaine, mois: limitesMois, annee: limitesAnneeScolaire};

/* Historique des scores d'une unité de temps donnée, du plus ancien
   au plus récent — sert à la fois aux graphiques et à la détection
   de record. */
function historiqueScores(dl, unite, nbPeriodes){
  const limites = LIMITES_PAR_UNITE[unite];
  const sortie = [];
  for (let i = nbPeriodes - 1; i >= 0; i--) {
    const p = limites(i);
    sortie.push(Object.assign({}, p, calculerScore(dl, p.debut, p.fin)));
  }
  return sortie;
}

/* Record : le score de la période en cours égale-t-il ou dépasse-t-il
   tout ce qu'on peut voir dans la fenêtre affichée par les graphiques ?
   Une vraie mémoire de tous les temps demanderait de stocker chaque
   score au fil des semaines, ce que l'app ne fait pas — cette
   comparaison reste donc bornée à l'historique visible. */
function estRecord(historique){
  if (historique.length < 2) return false;
  const actuel = historique[historique.length - 1].score;
  if (actuel <= 0) return false;
  return historique.slice(0, -1).every(p => actuel > p.score);
}

function calculerSemaines(){
  const dl = donneesLecture();
  if (!dl.cours.length) return {semaines:[], nouveaux:[], revises:[], pourcentages:[], annules:[]};
  const lundiCourant = lundiDe(aujourdhui());
  const premiereISO = dl.cours.map(c => isoDe(lundiDe(dDe(c.date))))
    .reduce((a, b) => a < b ? a : b);
  let debut = dDe(premiereISO);
  const limite = plus(lundiCourant, -11 * 7);
  if (debut < limite) debut = limite;

  const semaines = [];
  for (let d = debut; d <= lundiCourant; d = plus(d, 7)) semaines.push(isoDe(d));

  const nouveaux = [], revises = [], pourcentages = [], annules = [];
  semaines.forEach(lundiISO => {
    const dimISO = isoDe(plus(dDe(lundiISO), 6));
    const nC = dl.cours.filter(c => c.date >= lundiISO && c.date <= dimISO).length;
    const revsSemaine = dl.revisions.filter(r => r.date >= lundiISO && r.date <= dimISO);
    const nRevisees = revsSemaine.filter(r => r.statut === 'faite').length;
    const nAnnulees = revsSemaine.filter(r => r.statut === 'annulee').length;
    const planifiees = revsSemaine.length;
    nouveaux.push(nC);
    revises.push(nRevisees);
    annules.push(nAnnulees);
    pourcentages.push(planifiees ? Math.round(nRevisees / planifiees * 100) : 0);
  });
  return {semaines: semaines, nouveaux: nouveaux, revises: revises,
          pourcentages: pourcentages, annules: annules};
}

/* Petit histogramme SVG autonome, sans bibliothèque : une barre par
   semaine, sa valeur au-dessus, l'étiquette de semaine en dessous. */
function graphiqueBarres(labels, valeurs, options){
  options = options || {};
  const larg = 640, haut = 132, margeHaut = 22, margeBas = 28;
  const zoneH = haut - margeHaut - margeBas;
  const n = Math.max(valeurs.length, 1);
  const pas = larg / n;
  const largBarre = Math.min(30, pas * 0.55);
  const maxVal = options.max || Math.max(1, Math.max.apply(null, valeurs));
  const couleur = options.couleur || 'var(--accent)';
  let barres = '';
  valeurs.forEach((v, i) => {
    const h = (v / maxVal) * zoneH;
    const x = i * pas + (pas - largBarre) / 2;
    const y = margeHaut + (zoneH - h);
    barres += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + largBarre.toFixed(1) +
      '" height="' + Math.max(h, 0).toFixed(1) + '" rx="3" fill="' + couleur + '"></rect>';
    if (v > 0) {
      barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) +
        '" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--mono)" fill="var(--texte-2)">' +
        v + (options.suffixe || '') + '</text>';
    }
    barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (haut - 8) +
      '" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--texte-3)">' +
      ech(labels[i]) + '</text>';
  });
  return '<svg viewBox="0 0 ' + larg + ' ' + haut + '" style="width:100%;height:auto;display:block">' +
    '<line x1="0" y1="' + (margeHaut + zoneH) + '" x2="' + larg + '" y2="' + (margeHaut + zoneH) +
    '" stroke="var(--filet)" stroke-width="1"></line>' + barres + '</svg>';
}

/* Variante pour des valeurs qui peuvent être négatives (le score peut
   descendre sous zéro) : une ligne de zéro au milieu, les barres
   montent au-dessus en vert, descendent en dessous en rouge. */
function graphiqueScores(labels, valeurs){
  const larg = 640, haut = 140, margeHaut = 20, margeBas = 26;
  const zoneH = haut - margeHaut - margeBas;
  const n = Math.max(valeurs.length, 1);
  const pas = larg / n;
  const largBarre = Math.min(30, pas * 0.55);
  const maxV = Math.max(1, Math.max.apply(null, valeurs));
  const minV = Math.min(0, Math.min.apply(null, valeurs));
  const etendue = (maxV - minV) || 1;
  const yZero = margeHaut + zoneH * (maxV / etendue);
  let barres = '';
  valeurs.forEach((v, i) => {
    const x = i * pas + (pas - largBarre) / 2;
    const yValeur = margeHaut + zoneH * (maxV - v) / etendue;
    const y = v >= 0 ? yValeur : yZero;
    const h = Math.abs(yZero - yValeur);
    const couleur = v > 0 ? 'var(--faite)' : (v < 0 ? 'var(--annulee)' : 'var(--texte-3)');
    barres += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + largBarre.toFixed(1) +
      '" height="' + h.toFixed(1) + '" rx="3" fill="' + couleur + '"></rect>';
    const yTexte = v >= 0 ? y - 6 : y + h + 13;
    barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + yTexte.toFixed(1) +
      '" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--mono)" fill="var(--texte-2)">' +
      v + '</text>';
    barres += '<text x="' + (x + largBarre / 2).toFixed(1) + '" y="' + (haut - 6) +
      '" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--texte-3)">' +
      ech(labels[i]) + '</text>';
  });
  return '<svg viewBox="0 0 ' + larg + ' ' + haut + '" style="width:100%;height:auto;display:block">' +
    '<line x1="0" y1="' + yZero.toFixed(1) + '" x2="' + larg + '" y2="' + yZero.toFixed(1) +
    '" stroke="var(--filet)" stroke-width="1"></line>' + barres + '</svg>';
}

/* --- Chat ---------------------------------------------------- */

/* Notifications système : ne fonctionnent que pendant que l'app est
   ouverte (ou récemment ouverte). Sans serveur, impossible de
   réveiller le téléphone quand Cabosse est complètement fermée —
   ni pour le chat, ni pour le rappel du jour. C'est un choix
   assumé pour rester sur l'offre gratuite de Firebase. */
function etatNotifications(){
  if (!('Notification' in window)) return 'indisponible';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}

async function demanderNotifications(){
  if (!('Notification' in window)) { toast('Notifications non disponibles sur cet appareil.'); return; }
  const res = await Notification.requestPermission();
  if (res === 'granted') { toast('Notifications activées.'); verifierRappelJournalier(); rendre(); }
  else if (res === 'denied') { toast('Refusé — modifiable dans Réglages iPhone → Cabosse.'); rendre(); }
}

function notifier(titre, corps, options){
  if (etatNotifications() !== 'granted') return;
  const opts = Object.assign({body: corps, icon: 'icone-180.png'}, options || {});
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(titre, opts));
    } else {
      new Notification(titre, opts);
    }
  } catch (e) { /* silencieux : une notification manquée n'est pas bloquante */ }
}

/* Rappel du jour, au mieux : une seule fois par date calendaire, à
   l'ouverture de l'app — pas une alarme programmée, juste un coup
   d'œil si jamais on ouvre Cabosse ce jour-là. */
function verifierRappelJournalier(){
  if (etatNotifications() !== 'granted') return;
  try {
    const cle = 'cabosse-rappel-' + isoDe(aujourdhui());
    if (localStorage.getItem(cle)) return;
    localStorage.setItem(cle, '1');
    const dl = donneesLecture();
    const ajISO = isoDe(aujourdhui());
    const duJour = dl.revisions.filter(r => r.date === ajISO &&
      (r.statut === 'aFaire' || r.statut === 'reportee') && (dl.afficherAncrage || !r.ancrage));
    if (duJour.length) {
      notifier('Cabosse', duJour.length + ' révision' + (duJour.length > 1 ? 's' : '') +
        ' prévue' + (duJour.length > 1 ? 's' : '') + ' aujourd\u2019hui.', {tag: 'rappel-jour'});
    }
  } catch (e) { /* localStorage indisponible : on passe simplement */ }
}

/* Le chat utilise le même code que la synchronisation : pas de canal
   séparé à gérer. codeFamille() dit quel canal est à L'ÉCRAN (celui
   du profil actuellement affiché) ; canauxChat() dit lesquels sont
   ÉCOUTÉS — tous ceux auxquels cet appareil a accès, pour recevoir
   une notification quel que soit le profil affiché au moment où un
   message arrive. */
function codeFamille(){
  const s = suiviActif();
  if (s) return s.code;
  return DB.reglages.role === 'source' ? DB.reglages.codePartage : '';
}

function canauxChat(){
  const codes = DB.suivis.map(s => s.code);
  if (DB.reglages.role === 'source' && DB.reglages.codePartage) codes.push(DB.reglages.codePartage);
  return codes;
}

/* Un jeu de messages et un indicateur « non lu » par canal — pas une
   seule variable globale, sinon suivre deux enfants ne pouvait
   notifier que pour celui actuellement affiché à l'écran. */
let messagesChatPar = {};
let chatNonLuParCanal = {};

/* Messages du canal actuellement affiché — c'est ce que vueChat()
   doit montrer, peu importe combien de canaux tournent en tâche de
   fond. */
function messagesChatActuel(){
  return messagesChatPar[codeFamille()] || [];
}

function libelleHeure(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const auj = new Date();
  const meme = d.getFullYear() === auj.getFullYear() && d.getMonth() === auj.getMonth() && d.getDate() === auj.getDate();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return meme ? (hh + ':' + mm) : (String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + hh + ':' + mm);
}

/* « il y a X » relatif — sert d'indicateur de fraîcheur pour la
   synchronisation, pour qu'un blocage redevienne visible au lieu
   d'être silencieux. */
function libelleDepuis(ts){
  if (!ts) return 'jamais';
  const ecartMin = Math.round((Date.now() - ts) / 60000);
  if (ecartMin < 1) return 'à l\u2019instant';
  if (ecartMin < 60) return 'il y a ' + ecartMin + ' min';
  const ecartH = Math.round(ecartMin / 60);
  if (ecartH < 24) return 'il y a ' + ecartH + ' h';
  return 'il y a ' + Math.round(ecartH / 24) + ' j';
}

/* Relance l'écoute de TOUS les canaux accessibles à cet appareil —
   pas seulement celui actuellement affiché — pour recevoir une
   notification même en étant sur « Mes révisions » ou sur le canal
   d'un autre enfant. */
function demarrerEcouteChat(){
  canauxChat().forEach(demarrerEcouteChatCanal);
}

function demarrerEcouteChatCanal(code){
  if (!window.SabosseSync || !window.SabosseSync.disponible || !code) return;
  window.SabosseSync.suivreChat(code, (msgs, erreur) => {
    if (erreur) { toast('Connexion au chat interrompue.'); return; }
    if (!msgs) return;
    const monNom = (DB.reglages.prenom || '').trim();
    const vuJusquePar = DB.reglages.chatVuJusquePar || {};
    const vuJusque = vuJusquePar[code] || 0;
    const surCeCanal = vueActive === 'chat' && codeFamille() === code;

    if (!vuJusque && msgs.length) {
      /* Toute première connexion à ce canal, jamais tout l'historique
         existant : on marque simplement tout comme déjà vu. */
      vuJusquePar[code] = Math.max.apply(null, msgs.map(m => m.quand || 0));
      DB.reglages.chatVuJusquePar = vuJusquePar;
      Store.ecrire(DB);
    } else if (!surCeCanal) {
      /* Repère persistant par canal plutôt qu'une simple variable en
         mémoire, qui repart à zéro à chaque rechargement de l'app —
         sur iPhone, où une PWA est régulièrement déchargée de la
         mémoire, cela empêchait toute notification pour un message
         reçu pendant que l'app n'était pas en cours d'exécution. */
      const nouveaux = msgs.filter(m => (m.quand || 0) > vuJusque && m.auteur !== monNom);
      nouveaux.forEach(m => notifier(m.auteur || 'Cabosse', m.texte || '', {tag: 'chat-' + m.id}));
      if (nouveaux.length) { chatNonLuParCanal[code] = true; majBadgeChat(); }
    }

    messagesChatPar[code] = msgs;
    if (surCeCanal) {
      rendre();
      marquerChatVu(code);
    }
    purgerChatAncien(code, msgs);
  });
}

/* Avance le repère « vu jusque » d'UN canal au dernier message qu'il
   contient — appelé chaque fois que l'utilisateur regarde réellement
   ce canal précis, pour que le prochain redémarrage de l'app sache ce
   qui a déjà été lu, canal par canal. */
function marquerChatVu(code){
  const msgs = messagesChatPar[code];
  if (!msgs || !msgs.length) return;
  const dernier = Math.max.apply(null, msgs.map(m => m.quand || 0));
  const vuJusquePar = DB.reglages.chatVuJusquePar || {};
  if (dernier > (vuJusquePar[code] || 0)) {
    vuJusquePar[code] = dernier;
    DB.reglages.chatVuJusquePar = vuJusquePar;
    Store.ecrire(DB);
  }
  chatNonLuParCanal[code] = false;
  majBadgeChat();
}

/* Purge les messages de plus de 30 jours, et — au cas où quelqu'un
   discuterait beaucoup — tout ce qui dépasse un volant de 150
   messages, même plus récents. N'importe quel appareil ouvrant le
   chat participe au ménage ; supprimer un message déjà supprimé ne
   pose aucun problème. */
const CHAT_AGE_MAX_MS = 30 * 24 * 3600000;
const CHAT_VOLUME_MAX = 150;

function purgerChatAncien(code, msgs){
  if (!msgs.length) return;
  const limiteAge = Date.now() - CHAT_AGE_MAX_MS;
  const aSupprimer = new Set(msgs.filter(m => m.quand < limiteAge).map(m => m.id));
  if (msgs.length > CHAT_VOLUME_MAX) {
    msgs.slice(0, msgs.length - CHAT_VOLUME_MAX).forEach(m => aSupprimer.add(m.id));
  }
  if (aSupprimer.size) window.SabosseSync.purgerMessages(code, Array.from(aSupprimer));
}

function vueChat(){
  if (!window.SabosseSync || !window.SabosseSync.disponible) {
    return '<div class="vide"><div class="gros">💬</div><p><b>Chat indisponible.</b></p>' +
      '<p>La configuration Firebase n\u2019est pas active sur cet appareil.</p></div>';
  }
  const code = codeFamille();
  if (!code) {
    return '<div class="vide"><div class="gros">💬</div><p><b>Chat indisponible.</b></p>' +
      '<p>Configure d\u2019abord la synchronisation, dans Statistiques → Paramètres avancés.</p></div>';
  }
  const nom = (DB.reglages.prenom || '').trim();
  const banniereNotif = (etatNotifications() === 'default')
    ? '<button type="button" class="notif-banniere" data-act="notif-activer">' +
        '<span class="emo">🔔</span> Activer le son des notifications</button>'
    : '';
  let html = banniereNotif + '<div id="chat-fil">';
  const msgsCanal = messagesChatActuel();
  if (!msgsCanal.length) {
    html += '<p class="vide-chat">Aucun message pour l\u2019instant.</p>';
  } else {
    msgsCanal.forEach(m => {
      const moi = nom && m.auteur === nom;
      html += '<div class="msg' + (moi ? ' moi' : '') + '">' +
        (moi ? '' : '<b class="msg-auteur">' + ech(m.auteur || '?') + '</b>') +
        '<div class="msg-bulle">' + ech(m.texte || '') + '</div>' +
        '<span class="msg-heure">' + libelleHeure(m.quand) + '</span>' +
      '</div>';
    });
  }
  html += '</div>' +
    '<div class="chat-bas">' +
      '<button type="button" class="chat-nom" data-act="chat-nom">' +
        (nom ? ech(nom) : 'Choisir mon nom') + ' <span class="emo">✎</span></button>' +
      '<div class="chat-saisie">' +
        '<input type="text" id="chat-texte" placeholder="Message…" maxlength="300">' +
        '<button data-act="chat-envoyer">➤</button>' +
      '</div>' +
    '</div>';
  return html;
}

async function envoyerMessageChat(){
  const nom = (DB.reglages.prenom || '').trim();
  if (!nom) { ouvrirChatNom(); return; }
  const champ = document.getElementById('chat-texte');
  if (!champ) return;
  const texte = champ.value.trim();
  if (!texte) return;
  const code = codeFamille();
  if (!code) return;
  champ.value = '';
  champ.disabled = true;
  const ok = await window.SabosseSync.envoyerMessage(code, {
    texte: texte.slice(0, 300), auteur: nom, quand: Date.now()
  });
  champ.disabled = false;
  champ.focus();
  if (!ok) toast('Message non envoyé, réessaie.');
}

const chatnomVoile = document.getElementById('chatnom-voile');
function ouvrirChatNom(){
  document.getElementById('chatnom-champ').value = DB.reglages.prenom || '';
  chatnomVoile.classList.add('on');
  setTimeout(() => document.getElementById('chatnom-champ').focus(), 60);
}
function fermerChatNom(){ chatnomVoile.classList.remove('on'); }
document.getElementById('chatnom-annuler').addEventListener('click', fermerChatNom);
chatnomVoile.addEventListener('click', e => { if (e.target === chatnomVoile) fermerChatNom(); });
document.getElementById('chatnom-ok').addEventListener('click', () => {
  const val = document.getElementById('chatnom-champ').value.trim();
  if (!val) { toast('Choisis un nom.'); return; }
  DB.reglages.prenom = val;
  sauver();
  fermerChatNom();
  rendre();
});

/* --- Statistiques ------------------------------------------ */
function vueStats(){
  const dl = donneesLecture();
  if (!dl.revisions.length) {
    return '<div class="vide"><div class="gros">📊</div>' +
      '<p><b>Rien à mesurer pour l\'instant.</b></p>' +
      '<p>Les statistiques arrivent avec le premier cours.</p></div>';
  }
  const n = s => dl.revisions.filter(r => r.statut === s).length;
  const faites = n('faite'), reportees = n('reportee'),
        annulees = n('annulee'), venir = n('aFaire');

  /* Réalisation : bornée à la semaine en cours (lundi-dimanche),
     rien au-delà du dimanche. Le dénominateur compte tout ce qui est
     prévu cette semaine, fait ou non — pas seulement le traité. */
  const lundiSemaine = lundiDe(aujourdhui());
  const dimancheISO = isoDe(plus(lundiSemaine, 6));
  const lundiISO = isoDe(lundiSemaine);
  const semaineActuelle = dl.revisions.filter(r => r.date >= lundiISO && r.date <= dimancheISO);
  const planifieesSemaine = semaineActuelle.length;
  const aLheureSemaine = semaineActuelle.filter(dansLesTemps).length;
  const tauxSemaine = planifieesSemaine ? Math.round(aLheureSemaine / planifieesSemaine * 100) : 0;
  const tol = toleranceJours();

  const blocRealisation = !planifieesSemaine
    ? '<div class="carte" style="margin-bottom:20px">' +
        '<p style="margin:0;font-size:13px;color:var(--texte-2)">Aucune révision prévue cette semaine.</p></div>'
    : '<div class="carte" style="margin-bottom:20px">' +
        '<div style="display:flex;align-items:baseline;gap:10px">' +
        '<b style="font-size:30px;font-weight:800;letter-spacing:-.03em;' +
        'font-variant-numeric:tabular-nums;color:var(--faite)">' + tauxSemaine + '&nbsp;%</b>' +
        '<span style="font-size:13px;color:var(--texte-2)">des révisions prévues cette semaine ont été ' +
        'réalisées à \u00b1 ' + tol + ' jour' + (tol > 1 ? 's' : '') + ' <span class="emo">' +
        smileyTaux(tauxSemaine) + '</span></span></div></div>';

  let html =
    '<div class="tuiles">' +
      '<div class="tuile faite"><b>' + faites + '</b><span>Cours révisés <span class="emo">😎</span></span></div>' +
      '<div class="tuile reportee"><b>' + reportees + '</b><span>Cours reportés <span class="emo">😳</span></span></div>' +
      '<div class="tuile annulee"><b>' + annulees + '</b><span>Cours annulés <span class="emo">🫣</span></span></div>' +
      '<div class="tuile venir"><b>' + venir + '</b><span>À venir <span class="emo">🗓️</span></span></div>' +
    '</div>' +
    '<p class="etiquette">Réalisation</p>' + blocRealisation;

  const s7 = calculerSemaines();
  if (s7.semaines.length) {
    const labels = s7.semaines.map(libelleAxe);
    html += '<p class="etiquette">Évolution hebdomadaire</p>' +
      '<div class="carte graf"><p class="graf-titre">Nombre de nouveaux cours enregistrés</p>' +
        graphiqueBarres(labels, s7.nouveaux, {couleur: 'var(--accent)'}) + '</div>' +
      '<div class="carte graf"><p class="graf-titre">Cours révisés</p>' +
        graphiqueBarres(labels, s7.revises, {couleur: 'var(--faite)'}) + '</div>' +
      '<div class="carte graf"><p class="graf-titre">Taux de cours révisés sur le planifié</p>' +
        graphiqueBarres(labels, s7.pourcentages, {couleur: 'var(--faite)', suffixe: '%', max: 100}) + '</div>' +
      '<div class="carte graf" style="margin-bottom:20px"><p class="graf-titre">Nombre de cours annulés</p>' +
        graphiqueBarres(labels, s7.annules, {couleur: 'var(--annulee)'}) + '</div>';
  }

  const histoSemStats = historiqueScores(dl, 'semaine', 8);
  const histoMoisStats = historiqueScores(dl, 'mois', 6);
  const histoAnStats = historiqueScores(dl, 'annee', 4);
  html += '<p class="etiquette" style="margin-top:20px">Score</p>' +
    '<div class="carte graf"><p class="graf-titre">Score hebdomadaire</p>' +
      graphiqueScores(histoSemStats.map(p => p.label), histoSemStats.map(p => p.score)) + '</div>' +
    '<div class="carte graf"><p class="graf-titre">Score mensuel</p>' +
      graphiqueScores(histoMoisStats.map(p => p.label), histoMoisStats.map(p => p.score)) + '</div>' +
    '<div class="carte graf" style="margin-bottom:20px"><p class="graf-titre">Score par année scolaire</p>' +
      graphiqueScores(histoAnStats.map(p => p.label), histoAnStats.map(p => p.score)) + '</div>';

  const lignes = [];
  dl.matieres.forEach(m => {
    const ids = dl.cours.filter(c => c.code === m.code).map(c => c.id);
    if (!ids.length) return;
    const revs = dl.revisions.filter(r => ids.indexOf(r.cours) !== -1);
    lignes.push({
      m: m,
      cours: ids.length,
      faites: revs.filter(r => r.statut === 'faite').length,
      reportees: revs.filter(r => r.statut === 'reportee').length,
      annulees: revs.filter(r => r.statut === 'annulee').length
    });
  });

  /* Fiches empilées plutôt qu'un tableau : les intitulés demandés
     sont trop longs pour tenir en colonnes sur un écran de téléphone. */
  html += '<p class="etiquette">Par matière</p>';
  lignes.forEach(l => {
    html += '<div class="carte mat-stats">' +
      '<div class="mat-stats-entete"><i class="puce" style="background:' + l.m.c + '"></i>' +
      '<b>' + ech(l.m.nom) + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de cours</span><b>' + l.cours + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de révisions réalisées</span><b>' + l.faites + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de cours reportés</span><b>' + l.reportees + '</b></div>' +
      '<div class="mat-stats-ligne"><span>Nb de cours annulés</span><b>' + l.annulees + '</b></div>' +
    '</div>';
  });

  const notesParMatiere = [];
  dl.matieres.forEach(m => {
    const coursAvecNote = dl.cours.filter(c => c.code === m.code && (c.commentaire || '').trim());
    if (coursAvecNote.length) notesParMatiere.push({m: m, cours: coursAvecNote});
  });
  if (notesParMatiere.length) {
    html += '<p class="etiquette" style="margin-top:20px">Notes par matière</p>';
    notesParMatiere.forEach(g => {
      html += '<div class="carte mat-stats">' +
        '<div class="mat-stats-entete"><i class="puce" style="background:' + g.m.c + '"></i>' +
        '<b>' + ech(g.m.nom) + '</b></div>';
      g.cours.forEach(c => {
        html += '<div class="note-ligne"><b>' + ech(refCours(c)) + '</b>' + pastilleAnnee(c) +
          '<span>' + ech(c.commentaire.trim()) + '</span></div>';
      });
      html += '</div>';
    });
  }

  const historique = dl.revisions
    .filter(r => r.statut === 'faite' || r.statut === 'annulee')
    .sort((a, b) => a.date < b.date ? 1 : -1);
  if (historique.length) {
    const groupes = [];
    historique.forEach(r => {
      const c = trouverCours(r.cours);
      if (!c) return;
      let g = groupes.find(x => x.cours.id === c.id);
      if (!g) { g = {cours: c, items: []}; groupes.push(g); }
      g.items.push(r);
    });

    html += '<details class="pliable" data-cle="historique"' + ouvert('historique') + ' style="margin-top:20px">' +
      '<summary>Historique<span class="compte">' + historique.length + '</span></summary>' +
      '<div class="contenu-pliable">';
    groupes.forEach(g => {
      const m = matiereDe(g.cours.code);
      html += '<div class="hist-groupe"><div class="hist-entete">' +
        '<i class="puce" style="background:' + m.c + '"></i>' +
        '<span>' + ech(refCours(g.cours)) + ' · ' + ech(m.nom) + '</span>' +
        (modeLecture() ? '' :
          '<button class="hist-suppr-serie" data-act="suppr-serie-hist" data-id="' + g.cours.id + '">Supprimer la série</button>') +
        '</div><div class="carte" style="padding:5px 15px">';
      g.items.forEach(r => {
        html += '<div class="hist-l">' +
          '<div class="txt"><b>' + ech(libelleRang(r.rang)) + '</b>' +
          '<span>' + libelleCourt(r.date) + ' · ' + (r.statut === 'faite' ? 'Faite' : 'Annulée') + '</span></div>' +
          (modeLecture() ? '' :
            '<button data-act="reactiver" data-id="' + r.id + '">Réactiver</button>' +
            '<button class="sup" data-act="suppr-revision" data-id="' + r.id + '">✕</button>') +
          '</div>';
      });
      html += '</div></div>';
    });
    html += '</div></details>';
  }

  return html;
}

  const t = document.getElementById('toast');
  t.textContent = txt;
  t.classList.add('on');
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.classList.remove('on'), 1900);

/* --- Impression du planning à 2 semaines -------------------- */

/* Une colonne par semaine, du lundi au dimanche, en partant du
   lundi de la semaine en cours — y compris les jours déjà passés
   cette semaine, puisqu'une révision en retard reste à cocher. */
function planningImpression(){
  const dl = donneesLecture();
  const debut = lundiDe(aujourdhui());
  const jours = [];
  for (let i = 0; i < 14; i++) jours.push(isoDe(plus(debut, i)));

  const revs = dl.revisions.filter(r =>
    (r.statut === 'aFaire' || r.statut === 'reportee') &&
    jours.indexOf(r.date) !== -1 &&
    (dl.afficherAncrage || !r.ancrage));

  function colonne(liste){
    let lignes = '';
    liste.forEach(iso => {
      const d = dDe(iso);
      const nomJour = JOURS[d.getDay()].charAt(0).toUpperCase() + JOURS[d.getDay()].slice(1);
      // Filtré avant de compter les lignes : un cours introuvable (donnée
      // orpheline) ne doit jamais fausser le rowspan de la cellule jour.
      const items = revs.filter(r => r.date === iso && trouverCours(r.cours));
      const nRangees = Math.max(items.length, 1) + 1; // + la ligne « Nouveau à encoder »
      if (!items.length) {
        lignes += '<tr><td class="pr-jour-cel" rowspan="' + nRangees + '">' + nomJour + '<br>' +
          libelleCourt(iso) + '</td><td class="pr-vide-cel" colspan="4">—</td></tr>';
      } else {
        items.forEach((r, i) => {
          const c = trouverCours(r.cours);
          const m = matiereDe(c.code);
          lignes += '<tr>' +
            (i === 0 ? '<td class="pr-jour-cel" rowspan="' + nRangees + '">' + nomJour + '<br>' +
              libelleCourt(iso) + '</td>' : '') +
            '<td class="pr-cours-cel">' + ech(refCours(c)) +
              '<span class="pr-mat">' + ech(m.nom) + (c.annee ? ' · ' + ech(c.annee) : '') + '</span>' +
              '<span class="pr-rang">' + ech(libelleRang(r.rang)) + '</span></td>' +
            '<td class="pr-case-cel"><i class="pr-case"></i></td>' +
            '<td class="pr-case-cel"><i class="pr-case"></i></td>' +
            '<td class="pr-report-cel"><i class="pr-case"></i><span class="pr-ligne-date"></span></td>' +
          '</tr>';
        });
      }
      lignes += '<tr><td class="pr-nouveau-cel" colspan="4">Nouveau à encoder</td></tr>';
    });
    return '<table class="pr-table"><thead><tr>' +
      '<th>Jour</th><th>Cours</th><th>Fait</th><th>Annulé</th><th>Reporté au</th>' +
      '</tr></thead><tbody>' + lignes + '</tbody></table>';
  }

  const titre = 'Cabosse' + (modeLecture() && dl.prenom ? ' · ' + ech(dl.prenom) : '');
  return '<div class="pr-page">' +
    '<div class="pr-entete">' +
      '<img class="pr-logo" src="icone-180.png" alt="">' +
      '<div class="pr-titres">' +
        '<div class="pr-nom">' + titre + '</div>' +
        '<div class="pr-periode">Planning de révision du ' + libelleCourt(jours[0]) +
        ' au ' + libelleCourt(jours[13]) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="pr-grille">' +
      '<div class="pr-col">' + colonne(jours.slice(0, 7)) + '</div>' +
      '<div class="pr-col">' + colonne(jours.slice(7, 14)) + '</div>' +
    '</div>' +
    '<div class="pr-pied"><span>Cabosse · réactivation mémorielle</span>' +
    '<span>Imprimé le ' + libelleCourt(isoDe(aujourdhui())) + '</span></div>' +
  '</div>';
}

/* window.print() bloque le fil d'exécution jusqu'à l'ouverture de la
   feuille d'impression iOS : on repeint l'icône en sablier AVANT,
   via un double requestAnimationFrame qui garantit que le navigateur
   a réellement affiché le changement avant de se figer. */
function imprimerPlanning(bouton){
  const btn = bouton || document.getElementById('btn-imprimer');
  document.getElementById('impression').innerHTML = planningImpression();
  const texteOriginal = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try { window.print(); }
    finally { if (btn) { btn.textContent = texteOriginal; btn.disabled = false; } }
  }));
}

document.getElementById('btn-imprimer').addEventListener('click', () => imprimerPlanning(document.getElementById('btn-imprimer')));

/* --- Synchronisation entre appareils ------------------------- */

/* Ce téléphone devient la « source » : il génère un code (une fois)
   et pousse désormais chaque modification vers Firestore. */
function nouveauCode(){
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : (Math.random().toString(36).slice(2) + Date.now().toString(36));
}

function activerPartage(){
  if (!DB.reglages.codePartage) DB.reglages.codePartage = nouveauCode();
  DB.reglages.role = 'source';
  sauver();
  demarrerEcouteChat();
  rendre();
  toast('Partage activé.');
}

/* Sortie de secours quand le code appartient à une autre identité
   d'appareil (code restauré depuis une sauvegarde, données du site
   effacées, réinstallation) : les règles Firestore verrouillent
   définitivement un code à son créateur, donc la seule issue est
   d'en générer un neuf — et de le repartager. */
function regenererCodePartage(){
  if (!confirm('Générer un nouveau code de partage ?\n\nCeux qui te suivent devront rescanner ton QR code.')) return;
  if (window.SabosseSync) { window.SabosseSync.arreterChat(); }
  DB.reglages.codePartage = nouveauCode();
  DB.reglages.role = 'source';
  echecsSyncConsecutifs = 0;
  derniereSyncEnvoi = null;
  messagesChatPar = {};
  chatNonLuParCanal = {};
  sauver();
  demarrerEcouteChat();
  rendre();
  toast('Nouveau code généré — fais-le rescanner.');
}

/* Ce téléphone devient « suivi » d'un enfant supplémentaire : lecture
   seule, alimentée par le flux temps réel de l'appareil source
   identifié par ce code. Plusieurs enfants peuvent être suivis à la
   fois, chacun avec son propre miroir et sa propre écoute. */
function ajouterSuivi(code){
  code = (code || '').trim();
  if (!code) { toast('Code manquant.'); return; }
  if (DB.suivis.some(s => s.code === code)) { toast('Cet enfant est déjà suivi.'); return; }
  if (DB.suivis.length >= 6) { toast('Trop d\u2019enfants suivis sur un même appareil.'); return; }
  DB.reglages.role = 'suivi';
  DB.suivis.push({code: code, cours: [], revisions: [], matieres: [], reglages: {}});
  DB.reglages.affichage = code; // on bascule directement dessus : c'est ce qu'on vient de demander à voir
  sauver();
  demarrerEcouteSuivi(code);
  demarrerEcouteChat();
  rendre();
  toast('Connecté au suivi.');
}

function demarrerEcouteSuivi(code){
  if (!window.SabosseSync || !window.SabosseSync.disponible || !code) return;
  window.SabosseSync.suivre(code, (donnees, erreur) => {
    if (erreur) { toast('Connexion au suivi interrompue.'); return; }
    if (!donnees) return;
    const s = DB.suivis.find(x => x.code === code);
    if (!s) return; // suivi retiré entre-temps
    /* Écrit dans le miroir séparé de cet enfant, jamais dans les
       données personnelles de cet appareil ni dans celles d'un autre
       enfant : un arrivage Firestore ne doit jamais rien écraser
       d'autre que ce qu'il concerne. */
    s.cours = donnees.cours || [];
    s.revisions = donnees.revisions || [];
    s.matieres = (donnees.matieres && donnees.matieres.length) ? donnees.matieres : MATIERES_DEFAUT.slice();
    s.reglages = donnees.reglages || {};
    s.recuLe = Date.now(); // horodatage visible, pour repérer un suivi qui ne bouge plus
    Store.ecrire(DB); // mise en cache locale pour la lecture hors-ligne, sans repousser vers Firestore
    rendre();
  });
}

/* Relance toutes les écoutes suivi enregistrées — au démarrage de
   l'app, ou après un retour de connexion. */
function demarrerToutesLesEcoutesSuivi(){
  DB.suivis.forEach(s => demarrerEcouteSuivi(s.code));
}

/* --- Scan de QR code -----------------------------------------
   jsQR décode une image, pas un flux vidéo : on capture une image de
   la caméra sur un <canvas> à chaque frame et on la lui soumet. Pas
   besoin de l'API native de détection, absente de Safari iOS. */
let scanFlux = null, scanBoucle = null;

function extraireCode(texte){
  const m = /[?#&]suivre=([^&]+)/.exec(texte || '');
  return m ? decodeURIComponent(m[1]) : (texte || '').trim();
}

async function ouvrirScanner(){
  const voile = document.getElementById('scan-voile');
  const statut = document.getElementById('scan-statut');
  const video = document.getElementById('scan-video');
  if (!('jsQR' in window)) { toast('Lecteur de QR indisponible hors ligne.'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Caméra indisponible sur cet appareil.'); return;
  }
  voile.classList.add('on');
  statut.textContent = 'Vise le QR code affiché sur l\u2019autre téléphone.';
  try {
    scanFlux = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
    video.srcObject = scanFlux;
    await video.play();
    const canevas = document.createElement('canvas');
    const ctx = canevas.getContext('2d', {willReadFrequently: true});
    const tick = () => {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canevas.width = video.videoWidth; canevas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canevas.width, canevas.height);
        const image = ctx.getImageData(0, 0, canevas.width, canevas.height);
        const resultat = jsQR(image.data, image.width, image.height);
        if (resultat && resultat.data) { traiterCodeScanne(resultat.data); return; }
      }
      scanBoucle = requestAnimationFrame(tick);
    };
    scanBoucle = requestAnimationFrame(tick);
  } catch (e) {
    statut.textContent = 'Caméra refusée ou indisponible — utilise le code à coller.';
  }
}

function traiterCodeScanne(texte){
  fermerScanner();
  const code = extraireCode(texte);
  if (!code) { toast('QR code illisible.'); return; }
  ajouterSuivi(code);
}

function fermerScanner(){
  document.getElementById('scan-voile').classList.remove('on');
  if (scanBoucle) cancelAnimationFrame(scanBoucle);
  scanBoucle = null;
  if (scanFlux) { scanFlux.getTracks().forEach(t => t.stop()); scanFlux = null; }
}

document.getElementById('scan-fermer').addEventListener('click', fermerScanner);

/* Un QR scanné par l'appareil photo natif de l'iPhone (plutôt que
   par le scanner intégré) ouvre Safari sur ce lien : on y réagit de
   la même façon, une fois l'app chargée. */
function traiterLienSuivi(){
  const m = /suivre=([^&]+)/.exec(location.hash);
  if (!m) return;
  const code = decodeURIComponent(m[1]);
  history.replaceState(null, '', location.pathname + location.search);
  if (DB.suivis.some(s => s.code === code)) return;
  if (confirm('Suivre cet enfant avec le code reçu ?')) ajouterSuivi(code);
}

function retirerSuivi(code){
  if (window.SabosseSync) { window.SabosseSync.arreter(code); window.SabosseSync.arreterChat(code); }
  DB.suivis = DB.suivis.filter(s => s.code !== code);
  if (DB.reglages.affichage === code) DB.reglages.affichage = 'personnel';
  if (!DB.suivis.length && DB.reglages.role === 'suivi') DB.reglages.role = 'aucun';
  delete messagesChatPar[code];
  delete chatNonLuParCanal[code];
  sauver();
  demarrerEcouteChat();
  rendre();
  toast('Suivi retiré.');
}

/* Vide le cache du service worker puis recharge : utile quand
   l'app affiche encore une version périmée sur l'écran d'accueil. */
async function forcerMiseAJour(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
    }
    if ('caches' in window) {
      const cles = await caches.keys();
      for (const c of cles) await caches.delete(c);
    }
  } catch (e) { /* on recharge quand même */ }
  location.reload();
}

function exporterSauvegarde(){
  try {
    const blob = new Blob([JSON.stringify(DB)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'cabosse-' + isoDe(aujourdhui()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Sauvegarde exportée.');
  } catch (e) { toast('Export impossible.'); }
}

/* ============================================================
   Proposition hebdomadaire : s'envoyer la sauvegarde par mail.

   Une page web ne peut pas expédier un mail toute seule — il n'y a
   pas de serveur derrière Cabosse. On prépare donc le fichier et on
   passe la main au téléphone : la feuille de partage iOS permet de
   choisir Mail avec la pièce jointe déjà attachée. En repli (partage
   de fichiers indisponible), le fichier est téléchargé et le brouillon
   ouvert, la pièce jointe restant à ajouter à la main.
   ============================================================ */
function fichierSauvegarde(){
  const nom = 'cabosse-' + isoDe(aujourdhui()) + '.json';
  return new File([JSON.stringify(DB)], nom, {type: 'application/json'});
}

function envoyerSauvegardeParMail(){
  const dest = (DB.reglages.email || '').trim();
  const sujet = 'Sauvegarde Cabosse du ' + libelleCourt(isoDe(aujourdhui()));
  try {
    const fichier = fichierSauvegarde();
    if (navigator.canShare && navigator.canShare({files: [fichier]})) {
      navigator.share({files: [fichier], title: sujet, text: sujet})
        .then(() => toast('Sauvegarde partagée.'))
        .catch(() => {});
      return;
    }
  } catch (e) { /* Constructeur File indisponible : on bascule sur le repli */ }

  exporterSauvegarde();
  if (dest) {
    const lien = 'mailto:' + encodeURIComponent(dest) +
      '?subject=' + encodeURIComponent(sujet) +
      '&body=' + encodeURIComponent(
        'Sauvegarde Cabosse en pièce jointe.\n\n' +
        'Le fichier vient d\u2019être téléchargé sur l\u2019appareil : ' +
        'ajoute-le en pièce jointe avant d\u2019envoyer.');
    setTimeout(() => { location.href = lien; }, 600);
  } else {
    toast('Renseigne ton adresse e-mail dans les réglages.');
  }
}

/* Une fois par semaine au plus, et seulement si une adresse est
   configurée : on propose, on n'impose jamais. */
function proposerExportHebdo(){
  if (modeLecture()) return;
  if (DB.reglages.exportHebdo === false) return;
  if (!(DB.reglages.email || '').trim()) return;
  const ajISO = isoDe(aujourdhui());
  const derniere = DB.reglages.dernierePropositionExport || '';
  if (derniere && Math.round((dDe(ajISO) - dDe(derniere)) / 86400000) < 7) return;

  DB.reglages.dernierePropositionExport = ajISO;
  sauver();
  setTimeout(() => {
    if (confirm('Sauvegarde hebdomadaire\n\nT\u2019envoyer une copie de tes données par mail ' +
        'à ' + DB.reglages.email + ' ?')) {
      envoyerSauvegardeParMail();
    }
  }, 1200);
}

function importerSauvegarde(fichier){
  const lecteur = new FileReader();
  lecteur.onload = () => {
    let o;
    try { o = JSON.parse(lecteur.result); }
    catch (e) { toast('Fichier illisible.'); return; }
    if (!o || !Array.isArray(o.cours) || !Array.isArray(o.revisions)) {
      toast('Fichier invalide.'); return;
    }
    if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
    /* On ne restaure JAMAIS l'identité de synchronisation depuis un
       fichier : le code de partage est verrouillé côté Firestore à
       l'appareil qui l'a créé. Restaurer le code d'un autre appareil
       (ou d'une ancienne installation) rendait toutes les écritures
       silencieusement refusées — c'était la cause du suivi figé.
       Les réglages de synchro de CET appareil sont donc préservés. */
    const syncActuelle = {
      role: DB.reglages.role,
      codePartage: DB.reglages.codePartage,
      affichage: DB.reglages.affichage
    };
    const suivisActuels = DB.suivis;
    DB = {
      cours: o.cours,
      revisions: o.revisions,
      matieres: (o.matieres && o.matieres.length) ? o.matieres : MATIERES_DEFAUT.slice(),
      suivis: suivisActuels,
      reglages: Object.assign(
        {afficherAncrage: true, prenom: '', tolerance: 3, derniereAnnee: '', chatVuJusquePar: {}},
        o.reglages || {},
        syncActuelle,          // écrase toute valeur de synchro venue du fichier
        {afficherAncrage: true}
      )
    };
    sauver();
    demarrerToutesLesEcoutesSuivi();
    demarrerEcouteChat();
    rendre();
    toast('Sauvegarde restaurée.');
  };
  lecteur.readAsText(fichier);
}

function marquer(id, statut){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  r.statut = statut;
  /* Date réelle du clic, distincte de la date prévue : c'est elle qui
     permet de savoir si la révision a été faite dans les temps. */
  if (statut === 'faite') r.faitLe = isoDe(aujourdhui());
  sauver();
  /* C'est ici que la cagnotte se joue : si cette validation était la
     dernière révision en attente de la semaine, le solde des tâches
     bonus bascule dans la cagnotte (voir encaisserSemaines). */
  encaisserSemaines();
  rendre();
  toast(statut === 'faite' ? 'Révision faite.' : 'Révision annulée.');
}

/* Une révision compte « dans les temps » si l'écart entre le jour du
   clic et la date prévue tient dans la tolérance réglée (± N jours).
   Les révisions cochées avant l'introduction de faitLe n'ont pas cette
   date : elles sont comptées comme dans les temps, pour ne pas
   dégrader rétroactivement l'historique. */
function dansLesTemps(r){
  if (r.statut !== 'faite') return false;
  if (!r.faitLe) return true;
  const tol = toleranceJours();
  const ecart = Math.abs(Math.round((dDe(r.faitLe) - dDe(r.date)) / 86400000));
  return ecart <= tol;
}

function toleranceJours(){
  const t = parseInt(DB.reglages.tolerance, 10);
  return (isNaN(t) || t < 0) ? 3 : t;
}

/* Annule toute la série encore en attente d'un cours (aFaire ou
   reportée) — les révisions déjà faites ne sont jamais touchées. */
/* Annule toute la série encore en attente d'un cours (aFaire ou
   reportée) — les révisions déjà faites ne sont jamais touchées.
   Accepte indifféremment l'id d'une révision de ce cours (Agenda,
   historique) ou l'id du cours lui-même (Paramètres avancés). */
function annulerSerie(id){
  const r = DB.revisions.find(x => x.id === id);
  const coursId = r ? r.cours : id;
  const n = DB.revisions.filter(x =>
    x.cours === coursId && (x.statut === 'aFaire' || x.statut === 'reportee')).length;
  DB.revisions.forEach(x => {
    if (x.cours === coursId && (x.statut === 'aFaire' || x.statut === 'reportee')) x.statut = 'annulee';
  });
  sauver();
  rendre();
  toast(n + ' révision' + (n > 1 ? 's' : '') + ' annulée' + (n > 1 ? 's' : '') + '.');
}

/* Gestion des matières : le code identifie les cours existants et
   n'est donc modifiable qu'à la création, jamais en édition. */
function ajouterMatiere(code, nom, couleur){
  code = code.toUpperCase().trim();
  nom = nom.trim();
  if (!code || !nom) { toast('Code et nom requis.'); return; }
  if (DB.matieres.some(m => m.code === code)) { toast('Ce code existe déjà.'); return; }
  DB.matieres.push({code: code, nom: nom, c: couleur});
  sauver();
  rendre();
  toast(code + ' ajoutée.');
}

function modifierMatiere(code, nom, couleur){
  const m = DB.matieres.find(x => x.code === code);
  if (!m) return;
  nom = nom.trim();
  if (!nom) { toast('Le nom ne peut pas être vide.'); return; }
  const idsCours = DB.cours.filter(c => c.code === code).map(c => c.id);
  const nbRevisions = DB.revisions.filter(r => idsCours.indexOf(r.cours) !== -1).length;
  if (nbRevisions > 0 && !confirm('ATTENTION : vous allez modifier ' + nbRevisions +
      ' révision' + (nbRevisions > 1 ? 's' : '') + ', confirmez-vous ?')) return;
  m.nom = nom;
  m.c = couleur;
  matiereEnEdition = null;
  sauver();
  rendre();
  toast('Matière modifiée.');
}

function supprimerMatiere(code){
  const nb = DB.cours.filter(c => c.code === code).length;
  const msg = nb
    ? 'Supprimer ' + code + ' ? ' + nb + ' cours l\u2019utilisent encore et garderont ce code.'
    : 'Supprimer la matière ' + code + ' ?';
  if (!confirm(msg)) return;
  DB.matieres = DB.matieres.filter(m => m.code !== code);
  sauver();
  rendre();
  toast('Matière supprimée.');
}

let reportEnCours = null;
const voile = document.getElementById('voile');

function ouvrirReport(id){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  const c = trouverCours(r.cours);
  reportEnCours = id;
  document.getElementById('voile-info').textContent =
    (c ? refCours(c) + libelleAnnee(c) + ' · ' : '') + libelleRang(r.rang) + ' · prévue le ' + libelleCourt(r.date);
  document.getElementById('voile-date').value = isoDe(plus(dDe(r.date), 7));
  voile.classList.add('on');
}
/* Report d'une occurrence de tâche : même feuille que pour une
   révision, avec son propre marqueur pour ne pas confondre les deux. */
let reportTacheEnCours = null;
function ouvrirReportTache(id){
  const o = DB.occurrences.find(x => x.id === id);
  if (!o) return;
  const t = trouverTache(o.tache);
  reportTacheEnCours = id;
  reportEnCours = null;
  document.getElementById('voile-info').textContent =
    (t ? t.intitule + ' · ' : '') + 'prévue le ' + libelleCourt(o.date);

}

function fermerReport(){ voile.classList.remove('on'); reportEnCours = null; reportTacheEnCours = null; }

document.getElementById('voile-annuler').addEventListener('click', fermerReport);
voile.addEventListener('click', e => { if (e.target === voile) fermerReport(); });
document.getElementById('voile-ok').addEventListener('click', () => {
  const d = document.getElementById('voile-date').value;
  if (!d) return;
  if (reportTacheEnCours) {
    const o = DB.occurrences.find(x => x.id === reportTacheEnCours);

  } else if (reportEnCours) {
    const r = DB.revisions.find(x => x.id === reportEnCours);
    if (r) { r.date = d; r.statut = 'reportee'; sauver(); }
  } else return;
  fermerReport();
  rendre();
  toast('Reportée au ' + libelleCourt(d) + '.');
});

/* Note de difficulté, rattachée au cours (pas à une révision précise) :
   modifiable depuis n'importe quelle révision de ce cours, passée ou
   à venir, puisqu'elle porte sur la matière elle-même. */
let noteEnCours = null;
const noteVoile = document.getElementById('note-voile');

function ouvrirNote(coursId){
  const c = trouverCours(coursId);
  if (!c) return;
  noteEnCours = coursId;
  document.getElementById('note-info').textContent = refCours(c) + libelleAnnee(c) + ' · ' + matiereDe(c.code).nom;
  document.getElementById('note-texte').value = c.commentaire || '';
  noteVoile.classList.add('on');
}
function fermerNote(){ noteVoile.classList.remove('on'); noteEnCours = null; }

document.getElementById('note-annuler').addEventListener('click', fermerNote);
noteVoile.addEventListener('click', e => { if (e.target === noteVoile) fermerNote(); });
document.getElementById('note-ok').addEventListener('click', () => {
  if (!noteEnCours) return;
  const c = trouverCours(noteEnCours);
  if (c) {
    c.commentaire = document.getElementById('note-texte').value.trim();
    completerRappels(); // la note change la cadence des rappels : annuelle ↔ trimestrielle
    sauver(); rendre(); toast('Note enregistrée.');
  }
  fermerNote();
});

/* Confirmation, requise avant de marquer une révision faite ou
   annulée. Pour une annulation, deux issues possibles : cette seule
   révision, ou toute la série encore en attente pour ce cours. */
let actionEnCours = null;
const confirmVoile = document.getElementById('confirm-voile');

function demanderConfirmation(id, statut){
  const r = DB.revisions.find(x => x.id === id);
  if (!r) return;
  const c = trouverCours(r.cours);
  actionEnCours = {id: id};
  const actions = document.getElementById('confirm-actions');
  const zoneNote = document.getElementById('confirm-note-zone');
  if (statut === 'faite') {
    document.getElementById('confirm-titre').textContent = 'Marquer comme faite ?';
    zoneNote.style.display = '';
    document.getElementById('confirm-note').value = (c && c.commentaire) || '';
    actions.innerHTML = '<button class="bouton principal" data-confirm="faite">Confirmer</button>';
  } else {
    document.getElementById('confirm-titre').textContent = 'Annuler cette révision ?';
    zoneNote.style.display = 'none';
    /* Annuler toute la série reste possible, mais uniquement depuis
       les Paramètres avancés (protégés par mot de passe) : ici, on ne
       propose que la révision seule, pour éviter un geste accidentel. */
    actions.innerHTML = '<button class="bouton principal" style="background:var(--annulee);box-shadow:none" ' +
      'data-confirm="annulee-une">Confirmer</button>';
  }
  document.getElementById('confirm-info').textContent =
    (c ? refCours(c) + libelleAnnee(c) + ' · ' : '') + libelleRang(r.rang) + ' · ' + libelleJour(r.date);
  confirmVoile.classList.add('on');
}
function fermerConfirmation(){ confirmVoile.classList.remove('on'); actionEnCours = null; }

document.getElementById('confirm-non').addEventListener('click', fermerConfirmation);
confirmVoile.addEventListener('click', e => {
  if (e.target === confirmVoile) { fermerConfirmation(); return; }
  const b = e.target.closest('button[data-confirm]');
  if (!b || !actionEnCours) return;
  const type = b.dataset.confirm;
  if (type === 'faite') {
    const r = DB.revisions.find(x => x.id === actionEnCours.id);
    const c = r && trouverCours(r.cours);
    if (c) { c.commentaire = document.getElementById('confirm-note').value.trim(); completerRappels(); }
    marquer(actionEnCours.id, 'faite');
  }
  else if (type === 'annulee-une')   marquer(actionEnCours.id, 'annulee');
  fermerConfirmation();
});

vue.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'faite')         demanderConfirmation(id, 'faite');
  else if (act === 'annuler')  demanderConfirmation(id, 'annulee');
  else if (act === 'reporter') ouvrirReport(id);
  else if (act === 'note') { if (!modeLecture()) ouvrirNote(id); }
  else if (act === 'reactiver') {
    const r = DB.revisions.find(x => x.id === id);
    if (r) { r.statut = 'aFaire'; sauver(); rendre(); toast('Révision remise en attente.'); }
  }
  else if (act === 'suppr-revision') {
    if (confirm('Supprimer définitivement cette révision ? Cette action est irréversible.')) supprimerRevision(id);
  }
  else if (act === 'suppr-serie-hist') {
    const c = trouverCours(id);
    if (c && confirm('Supprimer définitivement toute la série ' + refCours(c) + libelleAnnee(c) +
        ' (y compris les révisions encore à venir) ? Cette action est irréversible.')) {
      supprimerCours(id); rendre(); toast('Série ' + refCours(c) + ' supprimée.');
    }
  }
  else if (act === 'export') exporterSauvegarde();
  else if (act === 'export-mail') envoyerSauvegardeParMail();
  else if (act === 'importDeclencheur') {
    const f = document.getElementById('fichier-import');
    if (f) f.click();
  }
  else if (act === 'maj') {
    if (confirm('Forcer la mise à jour ? L\'application va se recharger.')) forcerMiseAJour();
  }
  /* --- Tâches bonus --- */
  else if (act === 'tache-jour') {
    b.classList.toggle('actif');
    return;
  }
  else if (act === 'tache-ouvrir') {
    tacheDepliee = (tacheDepliee === id) ? null : id;
    rendre();
  }
  else if (act === 'tache-faite') {
    const o = DB.occurrences.find(x => x.id === id);
    if (o) {
      o.statut = 'faite';
      arreterMinuteur(false);
      sauver(); rendre();
      const t = trouverTache(o.tache);
      toast(t && t.controleParent ? 'Fait — en attente du contrôle parent.' : 'Bravo, tâche faite !');
    }
  }
  else if (act === 'tache-timer') lancerMinuteur(id);
  else if (act === 'tache-annuler') {
    const o = DB.occurrences.find(x => x.id === id);
    if (o) { o.statut = 'annulee'; sauver(); rendre(); toast('Tâche annulée.'); }
  }
  else if (act === 'tache-reactiver') {
    const o = DB.occurrences.find(x => x.id === id);
    if (o) { o.statut = 'aFaire'; o.controleFait = false; sauver(); rendre(); toast('Tâche remise en attente.'); }
  }
  else if (act === 'tache-reporter') ouvrirReportTache(id);
  else if (act === 'tache-suppr') {
    const t = DB.taches.find(x => x.id === id);
    if (t && confirm('Supprimer la tâche « ' + t.intitule + ' » et toutes ses occurrences ?')) {
      supprimerTache(id); rendre(); toast('Tâche supprimée.');
    }
  }
  else if (act === 'parametres-deverrouiller') ouvrirMotDePasse(b.dataset.cible);
  else if (act === 'imprimer-planning') imprimerPlanning(b);
  else if (act === 'chat-nom') ouvrirChatNom();
  else if (act === 'chat-envoyer') envoyerMessageChat();
  else if (act === 'notif-activer') demanderNotifications();
  else if (act === 'sync-source') {
    if (confirm('Faire de ce téléphone la source qui encode et partage les cours ?')) activerPartage();
  }
  else if (act === 'sync-suivre') {
    const champ = document.getElementById('sync-code-entree');
    ajouterSuivi(champ ? champ.value : '');
  }
  else if (act === 'sync-scanner') ouvrirScanner();
  else if (act === 'sync-copier') {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DB.reglages.codePartage)
        .then(() => toast('Code copié.'))
        .catch(() => toast('Copie impossible : sélectionne le texte manuellement.'));
    } else {
      toast('Copie indisponible : sélectionne le texte manuellement.');
    }
  }
  else if (act === 'sync-regenerer') regenererCodePartage();
  else if (act === 'sync-actualiser') {
    if (DB.reglages.role === 'source') sauver();
    else demarrerToutesLesEcoutesSuivi();
    demarrerEcouteChat();
    toast('Actualisation demandée.');
  }
  else if (act === 'sync-desactiver') {
    if (confirm('Désactiver le partage sur cet appareil ?')) {
      if (window.SabosseSync) {
        window.SabosseSync.arreter();
        window.SabosseSync.arreterChat(DB.reglages.codePartage);
      }
      delete messagesChatPar[DB.reglages.codePartage];
      delete chatNonLuParCanal[DB.reglages.codePartage];
      DB.reglages.role = 'aucun';
      DB.reglages.affichage = 'personnel';
      sauver();
      rendre();
      toast('Partage désactivé.');
    }
  }
  else if (act === 'sync-retirer') {
    const s = DB.suivis.find(x => x.code === id);
    const nom = (s && s.reglages && s.reglages.prenom) || 'cet enfant';
    if (confirm('Ne plus suivre ' + nom + ' ?')) retirerSuivi(id);
  }
  else if (act === 'restaurer-1h') restaurerInstantane(3600000);
  else if (act === 'restaurer-24h') restaurerInstantane(24 * 3600000);
  else if (act === 'restaurer-7j') restaurerInstantane(7 * 24 * 3600000);
  else if (act === 'matiere-editer') { matiereEnEdition = id; rendre(); }
  else if (act === 'matiere-annuler-edition') { matiereEnEdition = null; rendre(); }
  else if (act === 'matiere-enregistrer') {
    const nom = document.getElementById('me-nom').value;
    const couleur = document.getElementById('me-couleur').value;
    modifierMatiere(id, nom, couleur);
  }
  else if (act === 'matiere-suppr') supprimerMatiere(id);
  else if (act === 'matiere-ajouter') {
    const code = document.getElementById('nm-code').value;
    const nom = document.getElementById('nm-nom').value;
    const couleur = document.getElementById('nm-couleur').value;
    ajouterMatiere(code, nom, couleur);
  }
  else if (act === 'cours-annuler-serie') {
    const c = trouverCours(id);
    if (c && confirm('Annuler toute la série ' + refCours(c) + libelleAnnee(c) + ' encore en attente ? ' +
        'Réversible depuis l\u2019historique.')) {
      annulerSerie(id);
    }
  }
  else if (act === 'suppr') {
    const c = trouverCours(id);
    if (c && confirm('Supprimer ' + refCours(c) + libelleAnnee(c) + ' et toutes ses révisions ?')) {
      supprimerCours(id); rendre(); toast('Cours supprimé.');
    }
  }
});

vue.addEventListener('input', e => {
  if (e.target.id === 'f-date') majApercu();
  if (e.target.id === 'f-num') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
});

vue.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'chat-texte' && e.key === 'Enter') {
    e.preventDefault();
    envoyerMessageChat();
  }
});

vue.addEventListener('change', e => {
  if (e.target.id === 'f-prenom') {
    DB.reglages.prenom = e.target.value;
    sauver();
    return;
  }
  if (e.target.id === 'f-email') {
    DB.reglages.email = e.target.value;
    sauver();
    return;
  }
  if (e.target.id === 'f-type-compte') {
    DB.reglages.typeCompte = e.target.value;
    sauver();
    rendre(); // la visibilité des onglets et du contrôle parental en dépend
    return;
  }
  if (e.target.id === 'f-export-hebdo') {
    DB.reglages.exportHebdo = e.target.checked;
    sauver();
    return;
  }
  if (e.target.id === 'f-tolerance') {
    const v = parseInt(e.target.value, 10);
    DB.reglages.tolerance = (isNaN(v) || v < 0) ? 3 : Math.min(v, 30);
    sauver();
    rendre();
    return;
  }
  if (e.target.id === 'f-mat') {
    const champNum = document.getElementById('f-num');
    if (champNum) champNum.value = e.target.value ? prochainNumero(e.target.value) : '';
    return;
  }
  /* Formulaire de tâche : on n'affiche que les options utiles au
     type de récurrence choisi. */
  if (e.target.id === 't-type') {
    const t = e.target.value;
    const bs = document.getElementById('t-bloc-semaine');
    const bm = document.getElementById('t-bloc-mois');
    const bf = document.getElementById('t-bloc-fin');
    if (bs) bs.style.display = (t === 'semaine') ? '' : 'none';
    if (bm) bm.style.display = (t === 'mois') ? '' : 'none';
    if (bf) bf.style.display = (t === 'aucune') ? 'none' : '';
    return;
  }
  if (e.target.name === 't-moismode') {
    const bp = document.getElementById('t-bloc-position');
    if (bp) bp.style.display = (e.target.value === 'position') ? '' : 'none';
    return;
  }
  /* Coche « Contrôle fait » d'une occurrence, réservée aux parents. */
  if (e.target.dataset && e.target.dataset.act === 'tache-controle') {
    const o = DB.occurrences.find(x => x.id === e.target.dataset.id);
    if (o) {
      o.controleFait = e.target.checked;
      sauver(); rendre();
      toast(o.controleFait ? 'Contrôle validé — bonus acquis.' : 'Contrôle retiré.');
    }
    return;
  }
  if (e.target.dataset && e.target.dataset.act === 'cours-annee') {
    const c = DB.cours.find(x => x.id === e.target.dataset.id);
    if (c) {
      c.annee = e.target.value;
      sauver();
      rendre();
      toast(c.annee ? 'Année mise à jour.' : 'Année retirée.');
    }
    return;
  }
  if (e.target.id === 'fichier-import' && e.target.files && e.target.files[0]) {
    importerSauvegarde(e.target.files[0]);
    e.target.value = '';
  }
});

/* Enregistrement d'une nouvelle tâche bonus. */
vue.addEventListener('click', e => {
  if (e.target.id !== 't-ok') return;
  const intitule = (document.getElementById('t-intitule').value || '').trim();
  const duree = parseInt(document.getElementById('t-duree').value, 10);
  const debut = document.getElementById('t-debut').value;
  const heure = document.getElementById('t-heure').value || '';
  const type = document.getElementById('t-type').value;
  const intervalle = parseInt(document.getElementById('t-intervalle').value, 10) || 1;
  const fin = (document.getElementById('t-fin') || {}).value || '';
  const chControle = document.getElementById('t-controle');

  if (!intitule) { toast('Donne un intitulé à la tâche.'); return; }
  if (!duree || duree < 1) { toast('Indique une durée en minutes.'); return; }
  if (!debut) { toast('Indique une date de début.'); return; }

  const recur = {type: type, intervalle: intervalle, finLe: fin};
  if (type === 'semaine') {
    recur.jours = Array.from(document.querySelectorAll('.jour-pion.actif'))
      .map(b => parseInt(b.dataset.jour, 10));
    if (!recur.jours.length) { toast('Choisis au moins un jour de la semaine.'); return; }
  }
  if (type === 'mois') {
    const mode = document.querySelector('input[name="t-moismode"]:checked');
    recur.moisMode = mode ? mode.value : 'date';
    if (recur.moisMode === 'position') {
      recur.position = parseInt(document.getElementById('t-position').value, 10);
      recur.jourSemaine = parseInt(document.getElementById('t-jour-semaine').value, 10);
    }
  }

  ajouterTache({
    id: 'T' + Date.now().toString(36),
    intitule: intitule,
    duree: duree,
    debut: debut,
    heure: heure,
    recur: recur,
    /* Jamais de contrôle parental sur un compte étudiant autonome. */
    controleParent: !!(chControle && chControle.checked) && typeCompte() !== 'etudiant'
  });
  vueActive = 'agenda';
  rendre();
  toast('Tâche « ' + intitule + ' » planifiée.');
});

vue.addEventListener('click', e => {
  if (e.target.id !== 'f-ok') return;
  const annee = document.getElementById('f-annee').value;
  const code = document.getElementById('f-mat').value;
  let num = document.getElementById('f-num').value.replace(/\D/g, '');
  const date = document.getElementById('f-date').value;
  if (!annee) { toast('Choisis une année scolaire.'); return; }
  if (!code) { toast('Choisis une matière.'); return; }
  if (!num)  { toast('Indique le numéro du cours.'); return; }
  if (!date) { toast('Indique la date du cours.'); return; }
  num = num.padStart(3, '0');
  if (!ajouterCours(code, num, date, annee)) { toast('Ce cours est déjà enregistré.'); return; }
  vueActive = 'agenda';
  rendre();
  toast(code + '-' + num + ' planifié.');
});

document.getElementById('barre').addEventListener('click', e => {
  const b = e.target.closest('button[data-vue]');
  if (!b) return;
  vueActive = b.dataset.vue;
  rendre();
});

document.getElementById('bascule-profil').addEventListener('click', e => {
  const b = e.target.closest('button[data-act="profil"]');
  if (!b) return;
  if (b.dataset.code === DB.reglages.affichage) return;
  DB.reglages.affichage = b.dataset.code;
  sauver();
  /* Chaque canal tourne déjà en tâche de fond (voir canauxChat()) :
     changer de profil affiché ne fait que changer lequel est à
     l'écran, ses messages sont déjà là. rendre() marquera ce canal
     comme vu si on est sur l'onglet Chat au moment du changement. */
  rendre();
});

completerRappels(); // étend l'horizon des rappels à long terme
completerTaches();  // matérialise les occurrences de tâches sur l'horizon glissant
encaisserSemaines(); // bascule dans la cagnotte les semaines de tâches désormais closes
rendre();
verifierRappelJournalier();
proposerExportHebdo();

/* Le module de synchronisation se charge après ce script (il est
   différé) : on attend son signal avant de démarrer l'écoute ou de
   pousser l'état actuel, plutôt que de dépendre de l'ordre de chargement. */
window.addEventListener('sabosse-sync-pret', () => {
  if (DB.reglages.role === 'suivi') demarrerToutesLesEcoutesSuivi();
  else if (DB.reglages.role === 'source' && DB.reglages.codePartage) {
    window.SabosseSync.envoyer(DB.reglages.codePartage, {
      cours: DB.cours, revisions: DB.revisions, matieres: DB.matieres,
      taches: DB.taches, occurrences: DB.occurrences,
      reglages: {afficherAncrage: DB.reglages.afficherAncrage, prenom: DB.reglages.prenom,
                 typeCompte: DB.reglages.typeCompte, cagnotte: DB.reglages.cagnotte}
    });
  }
  demarrerEcouteChat();
  traiterLienSuivi(); // un QR scanné par l'appareil photo natif arrive ici via location.hash
  rendre(); // met à jour le bloc Synchronisation si Paramètres avancés est ouvert
});

/* Retour de connexion : si la dernière action a poussé dans le vide
   (téléphone hors réseau), on rattrape avec l'état complet actuel
   plutôt que d'attendre la prochaine action de l'utilisateur. */
window.addEventListener('online', () => {
  if (DB.reglages.role === 'source') sauver();
  else if (DB.reglages.role === 'suivi') demarrerToutesLesEcoutesSuivi();
  demarrerEcouteChat();
});

/* Bug rapporté : l'affichage ne reflétait pas les changements distants
   après une mise en arrière-plan prolongée. Sur iOS, l'app peut être
   suspendue pendant que l'écran est verrouillé ou qu'on change d'app,
   ce qui peut figer la connexion temps réel à Firestore sans qu'elle
   ne se relance seule au retour. On force une re-souscription complète
   chaque fois que l'app redevient visible, plutôt que de dépendre
   uniquement de la reconnexion interne du SDK. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (DB.reglages.role === 'source') sauver();
  else if (DB.reglages.role === 'suivi') demarrerToutesLesEcoutesSuivi();
  demarrerEcouteChat();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* Écran de démarrage : 2 secondes fixes, puis fondu. Se déclenche à
   chaque chargement complet de la page — c'est la seule chose que le
   Javascript puisse distinguer d'un « kill » depuis l'écran d'accueil,
   un vrai lancement d'app natif se comportant d'ailleurs pareil. */
setTimeout(() => {
  const ecran = document.getElementById('ecran-demarrage');
  if (!ecran) return;
  ecran.classList.add('sortie');
  setTimeout(() => ecran.remove(), 420);
}, 2000);
</script>
